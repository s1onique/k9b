# =============================================================================
# k9b CNPG Live Lab Runner RBAC
#
# Minimal permissions required for the k9b-cnpg-incident-lab-live workflow
# to run on the spbnix-k8s ARC runner scale set.
#
# IMPORTANT: Replace the placeholder service account namespace/name below
# with the actual values from the live lab run:
#   1. Run the live workflow once to identify the runner service account
#   2. Check the output of "Kubernetes Subject Diagnostics" step
#   3. Update the ClusterRoleBinding and RoleBinding subjects below
#
# Application (one-time, by cluster admin):
#   kubectl apply -f deploy/github-actions/k9b-cnpg-live-lab-runner-rbac.yaml
#
# The live lab workflow does NOT apply this manifest itself (would require
# elevated permissions before permissions are granted).
# =============================================================================

---
# ClusterRole for cluster-scoped resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k9b-cnpg-live-lab-runner-cluster
  labels:
    app.kubernetes.io/name: k9b-cnpg-incident-lab
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: manual
rules:
  # Cluster-scoped namespace lifecycle for lab namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]

  # Node visibility for diagnostics
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

  # CNPG Cluster CRD read (specific resource name, not wildcard)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["clusters.postgresql.cnpg.io"]
    verbs: ["get"]

---
# ClusterRole for lab namespace resources
# Since lab namespace is generated per-run, use ClusterRole for namespaced resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k9b-cnpg-live-lab-runner-lab-namespace
  labels:
    app.kubernetes.io/name: k9b-cnpg-incident-lab
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: manual
rules:
  # Core workload resources for lab namespace
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

  # Secrets: create/update only, no read access (would leak credentials)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "patch", "update"]

  # Workload controllers
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

  # CNPG Cluster custom resources
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

  # Jobs (may be needed by Helm charts)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
# Role for cnpg-system namespace (read-only access to CNPG operator)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k9b-cnpg-live-lab-runner-cnpg-system
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: k9b-cnpg-incident-lab
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: manual
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Note: deployments are in the apps API group
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for cluster-scoped permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k9b-cnpg-live-lab-runner-cluster
  labels:
    app.kubernetes.io/name: k9b-cnpg-incident-lab
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: manual
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k9b-cnpg-live-lab-runner-cluster
subjects:
  # =============================================================================
  # TODO: Replace with actual runner service account from live lab run
  #
  # To identify the correct service account:
  # 1. Run the live workflow once
  # 2. Check "ServiceAccount namespace:" in "Kubernetes Subject Diagnostics" step
  # 3. Check "kubectl auth whoami" output for the exact service account name
  # 4. Update the namespace and name below
  # =============================================================================
  - kind: ServiceAccount
    name: <RUNNER_SERVICE_ACCOUNT>
    namespace: <RUNNER_NAMESPACE>

---
# ClusterRoleBinding for lab namespace resources
# Grants namespaced permissions cluster-wide (pods, services, configmaps, etc.)
# Lab namespaces are created dynamically by the runner
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k9b-cnpg-live-lab-runner-lab-namespace
  labels:
    app.kubernetes.io/name: k9b-cnpg-incident-lab
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: manual
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k9b-cnpg-live-lab-runner-lab-namespace
subjects:
  # =============================================================================
  # TODO: Replace with actual runner service account from live lab run
  # =============================================================================
  - kind: ServiceAccount
    name: <RUNNER_SERVICE_ACCOUNT>
    namespace: <RUNNER_NAMESPACE>

---
# RoleBinding for cnpg-system namespace (read-only CNPG operator access)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k9b-cnpg-live-lab-runner-cnpg-system
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: k9b-cnpg-incident-lab
    app.kubernetes.io/component: ci-rbac
    app.kubernetes.io/managed-by: manual
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k9b-cnpg-live-lab-runner-cnpg-system
subjects:
  # =============================================================================
  # TODO: Replace with actual runner service account from live lab run
  # =============================================================================
  - kind: ServiceAccount
    name: <RUNNER_SERVICE_ACCOUNT>
    namespace: <RUNNER_NAMESPACE>

# =============================================================================
# Design Notes:
#
# Why this structure?
# - ClusterRole + ClusterRoleBinding for cluster-scoped resources (namespaces, nodes, CRD)
# - ClusterRole + ClusterRoleBinding for lab namespace resources (grants apply cluster-wide)
# - Role + RoleBinding for cnpg-system namespace (proper namespace scoping)
#
# Lab namespace permissions strategy:
# - Since lab namespace is generated per-run (k9b-cnpg-lab-${GITHUB_RUN_ID}),
#   we use ClusterRoleBinding for lab namespace resources
# - This grants permissions to any namespace the runner creates
#
# Secrets policy:
# - secrets create/update: Required for Helm chart resource creation
# - secrets get/list/watch: NOT granted (would leak credentials)
#
# What's intentionally NOT granted:
# - No cluster-admin binding
# - No wildcard API groups or resources
# - No delete on nodes, CRDs
# - No secrets read access
# =============================================================================