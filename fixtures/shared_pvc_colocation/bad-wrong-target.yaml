# BAD fixture: required hostname affinity targets frontend instead of backend
# Expected: FAIL - Selector must target app.kubernetes.io/component=backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k9b-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k9b
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k9b
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          image: k9b:latest
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: k9b-runs
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k9b
                  app.kubernetes.io/component: frontend
              topologyKey: kubernetes.io/hostname