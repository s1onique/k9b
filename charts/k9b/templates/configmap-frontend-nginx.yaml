{{/*
Nginx configuration ConfigMap for frontend.
Templates the backend service DNS name to match the Helm release naming.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k9b.frontend.fullname" . }}-nginx
  labels:
    {{- include "k9b.frontend.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;

    error_log /dev/stderr notice;
    pid /tmp/nginx/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        access_log /dev/stdout;

        sendfile on;
        keepalive_timeout 65;

        # nginx temp paths moved to /tmp for non-root/readonly filesystem compatibility
        client_body_temp_path /tmp/nginx/client_temp;
        proxy_temp_path       /tmp/nginx/proxy_temp;
        fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
        uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
        scgi_temp_path        /tmp/nginx/scgi_temp;

        server {
            listen 8080;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            # Health check endpoint for Kubernetes probes
            location = /healthz {
                access_log off;
                return 200 "ok\n";
                add_header Content-Type text/plain;
            }

            # API proxy: forward /api/* requests to the backend service.
            # Backend service name is templated to match Helm release naming (e.g. infra-k9b-backend).
            location /api/ {
                proxy_pass http://{{ include "k9b.backend.fullname" . }}:8080/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Root and index.html: explicit no-store cache control to prevent heuristic caching
            location = / {
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                try_files /index.html =404;
            }

            location = /index.html {
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                try_files /index.html =404;
            }

            # Static assets: immutable cache for fingerprinted bundles
            # Return 404 for missing assets (not index.html fallback)
            location /assets/ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                try_files $uri =404;
            }

            # SPA fallback: serve index.html for app routes (non-file, non-asset paths)
            # Explicit no-store cache control prevents heuristic caching of SPA shell
            location / {
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                try_files $uri $uri/ /index.html;
            }
        }
    }