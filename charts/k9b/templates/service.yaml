{{/*
Backend service.
Exposes the k9b REST API and UI.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k9b.backend.fullname" . }}
  labels:
    {{- include "k9b.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "k9b.backend.selectorLabels" . | nindent 4 }}
---
{{/*
Frontend service.
Exposes the k9b web UI.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k9b.frontend.fullname" . }}
  labels:
    {{- include "k9b.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "k9b.frontend.selectorLabels" . | nindent 4 }}
