{{/*
Admin auth secret (optional).

This secret is created only when:
- backend.auth.enabled=true
- backend.auth.existingSecret is empty
- backend.auth.adminPasswordHash is set

For production, prefer using existingSecret with a pre-created Kubernetes Secret.
Chart-managed secrets land in Helm release history and may leak into backups.

WARNING: Do NOT commit real password hashes to values.yaml.
*/}}
{{- if and .Values.backend.auth.enabled (not .Values.backend.auth.existingSecret) .Values.backend.auth.adminPasswordHash }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k9b.fullname" . }}-admin-auth
  labels:
    {{- include "k9b.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backend.auth.passwordHashKey | quote }}: {{ .Values.backend.auth.adminPasswordHash | quote }}
{{- end }}
