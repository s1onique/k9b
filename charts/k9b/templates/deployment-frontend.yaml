{{/*
Frontend deployment.
Provides the web UI for k9b diagnostics.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k9b.frontend.fullname" . }}
  labels:
    {{- include "k9b.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "k9b.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k9b.frontend.labels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          {{- if .Values.frontend.command }}
          command: {{ .Values.frontend.command }}
          {{- end }}
          {{- if .Values.frontend.args }}
          args: {{ .Values.frontend.args }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          env:
            - name: VITE_BACKEND_HOST
              value: {{ .Values.frontend.env.VITE_BACKEND_HOST | quote }}
            - name: VITE_BACKEND_PORT
              value: {{ .Values.frontend.env.VITE_BACKEND_PORT | quote }}
            - name: FRONTEND_HOST
              value: {{ .Values.frontend.env.FRONTEND_HOST | quote }}
          {{- $hasResources := false }}
          {{- if .Values.frontend.resources.limits }}
          {{- $hasResources = true }}
          {{- end }}
          {{- if .Values.frontend.resources.requests }}
          {{- $hasResources = true }}
          {{- end }}
          {{- if $hasResources }}
          resources:
            {{- if .Values.frontend.resources.limits }}
            {{- with .Values.frontend.resources.limits }}
            limits:
              {{- if .cpu }}
              cpu: {{ .cpu }}
              {{- end }}
              {{- if .memory }}
              memory: {{ .memory }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.frontend.resources.requests }}
            {{- with .Values.frontend.resources.requests }}
            requests:
              {{- if .cpu }}
              cpu: {{ .cpu }}
              {{- end }}
              {{- if .memory }}
              memory: {{ .memory }}
              {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.frontend.securityContext }}
          {{- with .Values.frontend.securityContext }}
          securityContext:
            {{- if hasKey . "allowPrivilegeEscalation" }}
            allowPrivilegeEscalation: {{ .allowPrivilegeEscalation }}
            {{- end }}
            {{- if hasKey . "readOnlyRootFilesystem" }}
            readOnlyRootFilesystem: {{ .readOnlyRootFilesystem }}
            {{- end }}
            {{- if hasKey . "capabilities" }}
            capabilities:
              {{- if .capabilities.drop }}
              drop:
                {{- range .capabilities.drop }}
                - {{ . }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp/nginx
            {{- if .Values.frontend.configmapNginx }}
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        {{- if .Values.frontend.configmapNginx }}
        - name: nginx-conf
          configMap:
            name: {{ include "k9b.frontend.fullname" . }}-nginx
        {{- end }}