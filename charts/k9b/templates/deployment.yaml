{{/*
Backend deployment.
Provides the REST API and UI for k9b diagnostics.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k9b.backend.fullname" . }}
  labels:
    {{- include "k9b.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # Recreate strategy required: backend mounts a PVC (runs persistence) that can only
  # be attached to one node at a time. RollingUpdate with maxSurge > 0 can cause
  # Multi-Attach errors when Kubernetes creates the new pod before the old pod terminates.
  # Recreate ensures the old pod is deleted before the new pod starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "k9b.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k9b.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k9b.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          {{- if .Values.backend.command }}
          command: {{ .Values.backend.command }}
          {{- end }}
          {{- if .Values.backend.args }}
          args:
            {{- toYaml .Values.backend.args | nindent 12 }}
          {{- else }}
          args:
            - python
            - -m
            - k8s_diag_agent.cli
            - health-ui
            {{- if .Values.backend.unsafeBind }}
            - --unsafe-bind
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: HEALTH_SKIP_REFRESH
              value: {{ .Values.backend.env.HEALTH_SKIP_REFRESH | quote }}
            - name: HEALTH_UI_HOST
              value: {{ .Values.backend.env.HEALTH_UI_HOST | quote }}
            - name: HEALTH_UI_PORT
              value: {{ .Values.backend.env.HEALTH_UI_PORT | quote }}
            - name: HEALTH_CONFIG_PATH
              value: {{ .Values.backend.env.HEALTH_CONFIG_PATH | quote }}
            - name: HEALTH_RUNS_DIR
              value: {{ .Values.backend.env.HEALTH_RUNS_DIR | quote }}
            - name: HEALTH_UI_RUNS_DIR
              value: {{ .Values.backend.env.HEALTH_UI_RUNS_DIR | quote }}
            - name: PYTHONPATH
              value: {{ .Values.backend.env.PYTHONPATH | quote }}
            - name: K9B_ENABLE_DEBUG_ENDPOINTS
              value: {{ .Values.backend.env.K9B_ENABLE_DEBUG_ENDPOINTS | default "false" | quote }}
            - name: KUBERNETES_AUTH_MODE
              value: {{ .Values.kubernetes.auth.mode | quote }}
            - name: KUBERNETES_AUTH_KUBECONFIG_ENABLED
              value: {{ .Values.kubeconfig.enabled | quote }}
            {{- if and .Values.kubeconfig.enabled (ne .Values.kubernetes.auth.mode "inCluster") }}
            - name: KUBECONFIG
              value: {{ printf "%s/%s" .Values.kubeconfig.mountPath .Values.kubeconfig.fileName | quote }}
            {{- end }}
            {{- if and (eq .Values.kubernetes.auth.mode "inCluster") .Values.serviceAccount.automountServiceAccountToken }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- if .Values.uiAuth.enabled }}
            - name: K9B_UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.uiAuth.secretName }}
                  key: K9B_UI_TOKEN
            {{- end }}
            # Always render K9B_AUTH_ENABLED - backend defaults to enabled when this env var is absent
            - name: K9B_AUTH_ENABLED
              value: {{ .Values.backend.auth.enabled | quote }}
            {{- if .Values.backend.auth.enabled }}
            - name: K9B_ADMIN_USERNAME
              value: {{ .Values.backend.auth.adminUsername | quote }}
            - name: K9B_SECURE_COOKIE
              value: {{ .Values.backend.auth.secureCookie | quote }}
            - name: K9B_SESSION_COOKIE_NAME
              value: {{ .Values.backend.auth.sessionCookieName | quote }}
            - name: K9B_SESSION_MAX_AGE_SECONDS
              value: {{ .Values.backend.auth.sessionMaxAgeSeconds | quote }}
            - name: K9B_SESSION_IDLE_TIMEOUT_SECONDS
              value: {{ .Values.backend.auth.sessionIdleTimeoutSeconds | quote }}
            - name: K9B_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "k9b.adminAuthSecretName" . }}
                  key: {{ .Values.backend.auth.passwordHashKey }}
            {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.healthConfig.enabled }}
            - name: health-config
              mountPath: {{ .Values.healthConfig.mountPath }}
              subPath: health-config.json
              readOnly: true
            {{- end }}
            {{- if and .Values.kubeconfig.enabled (ne .Values.kubernetes.auth.mode "inCluster") }}
            - name: kubeconfig
              mountPath: {{ .Values.kubeconfig.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.runs.persistence.enabled }}
            - name: runs
              mountPath: {{ .Values.runs.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.healthConfig.enabled }}
        - name: health-config
          configMap:
            name: {{ include "k9b.healthConfig.fullname" . }}
        {{- end }}
        {{- if and .Values.kubeconfig.enabled (ne .Values.kubernetes.auth.mode "inCluster") }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.kubeconfig.secretName }}
        {{- end }}
        {{- if .Values.runs.persistence.enabled }}
        - name: runs
          persistentVolumeClaim:
            claimName: {{ include "k9b.runs.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}