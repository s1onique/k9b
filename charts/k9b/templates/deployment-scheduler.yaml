{{/*
Scheduler deployment.
Runs the scheduled health loop for k9b diagnostics.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k9b.scheduler.fullname" . }}
  labels:
    {{- include "k9b.scheduler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "k9b.scheduler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k9b.scheduler.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k9b.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.scheduler.initContainer.enabled }}
      initContainers:
        - name: scheduler-init
          image: {{ .Values.scheduler.initContainer.image | default .Values.image.backend.repository }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            {{- if .Values.scheduler.initContainer.command }}
              {{- toYaml .Values.scheduler.initContainer.command | nindent 12 }}
            {{- else }}
              - sh
              - -c
              - mkdir -p /app/runs/health
            {{- end }}
          volumeMounts:
            {{- if .Values.runs.persistence.enabled }}
            - name: runs
              mountPath: /app/runs
            {{- end }}
      {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          {{- if .Values.scheduler.command }}
          command: {{ .Values.scheduler.command }}
          {{- end }}
          {{- if .Values.scheduler.args }}
          args: {{ .Values.scheduler.args }}
          {{- end }}
          env:
            - name: LLAMA_CPP_BASE_URL
              value: {{ .Values.scheduler.env.LLAMA_CPP_BASE_URL | quote }}
            - name: LLAMA_CPP_MODEL
              value: {{ .Values.scheduler.env.LLAMA_CPP_MODEL | quote }}
            - name: HEALTH_CONFIG_PATH
              value: {{ .Values.scheduler.env.HEALTH_CONFIG_PATH | quote }}
            - name: HEALTH_RUNS_DIR
              value: {{ .Values.scheduler.env.HEALTH_RUNS_DIR | quote }}
            - name: PYTHONPATH
              value: {{ .Values.scheduler.env.PYTHONPATH | quote }}
            - name: HEALTH_BUILD_DIAGNOSTIC_PACK
              value: {{ .Values.scheduler.env.HEALTH_BUILD_DIAGNOSTIC_PACK | quote }}
            - name: LLAMA_CPP_ENABLE_THINKING
              value: {{ .Values.scheduler.env.LLAMA_CPP_ENABLE_THINKING | quote }}
            - name: HEALTH_REQUIRE_SUMMARY
              value: {{ .Values.scheduler.env.HEALTH_REQUIRE_SUMMARY | quote }}
            - name: HEALTH_REQUIRE_DIAGNOSTIC_PACK
              value: {{ .Values.scheduler.env.HEALTH_REQUIRE_DIAGNOSTIC_PACK | quote }}
            {{- if .Values.kubeconfig.enabled }}
            - name: KUBECONFIG
              value: {{ printf "%s/%s" .Values.kubeconfig.mountPath .Values.kubeconfig.fileName | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 10 }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.healthConfig.enabled }}
            - name: health-config
              mountPath: {{ .Values.healthConfig.mountPath }}
              subPath: health-config.json
              readOnly: true
            {{- end }}
            {{- if .Values.healthConfig.baseline.enabled }}
            - name: health-config
              mountPath: /app/runs/health-baseline.local.json
              subPath: health-baseline.local.json
              readOnly: true
            {{- end }}
            {{- if .Values.kubeconfig.enabled }}
            - name: kubeconfig
              mountPath: {{ .Values.kubeconfig.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.runs.persistence.enabled }}
            - name: runs
              mountPath: {{ .Values.runs.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- if or .Values.healthConfig.enabled .Values.healthConfig.baseline.enabled }}
        - name: health-config
          configMap:
            name: {{ include "k9b.healthConfig.fullname" . }}
        {{- end }}
        {{- if .Values.kubeconfig.enabled }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.kubeconfig.secretName }}
        {{- end }}
        {{- if .Values.runs.persistence.enabled }}
        - name: runs
          persistentVolumeClaim:
            claimName: {{ include "k9b.runs.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}