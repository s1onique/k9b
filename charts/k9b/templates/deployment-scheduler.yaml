{{/*
Scheduler deployment.
Runs the scheduled health loop for k9b diagnostics.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k9b.scheduler.fullname" . }}
  labels:
    {{- include "k9b.scheduler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  # Recreate strategy required: scheduler mounts a PVC (runs persistence) that can only
  # be attached to one node at a time. RollingUpdate with maxSurge > 0 can cause
  # Multi-Attach errors when Kubernetes creates the new pod before the old pod terminates.
  # Recreate ensures the old pod is deleted before the new pod starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "k9b.scheduler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k9b.scheduler.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k9b.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.scheduler.initContainer.enabled }}
      initContainers:
        - name: scheduler-init
          image: {{ .Values.scheduler.initContainer.image | default .Values.image.backend.repository }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            {{- if .Values.scheduler.initContainer.command }}
              {{- toYaml .Values.scheduler.initContainer.command | nindent 12 }}
            {{- else }}
              - sh
              - -c
              - mkdir -p /app/runs/health
            {{- end }}
          volumeMounts:
            {{- if .Values.runs.persistence.enabled }}
            - name: runs
              mountPath: /app/runs
            {{- end }}
      {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          {{- if .Values.scheduler.command }}
          command: {{ .Values.scheduler.command }}
          {{- end }}
          {{- if .Values.scheduler.args }}
          args:
            {{- toYaml .Values.scheduler.args | nindent 12 }}
          {{- else }}
          args:
            - scheduler
          {{- end }}
          {{- with .Values.scheduler.envFrom }}
          envFrom:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          env:
            - name: K9B_REVIEW_ENRICHMENT_ENABLED
              value: {{ .Values.scheduler.env.K9B_REVIEW_ENRICHMENT_ENABLED | quote }}
            - name: K9B_AUTO_DRILLDOWN_ENABLED
              value: {{ .Values.scheduler.env.K9B_AUTO_DRILLDOWN_ENABLED | quote }}
            - name: K9B_EXTERNAL_ANALYSIS_PROVIDER
              value: {{ .Values.scheduler.env.K9B_EXTERNAL_ANALYSIS_PROVIDER | quote }}
            - name: K9B_EXTERNAL_ANALYSIS_BASE_URL
              value: {{ .Values.scheduler.env.K9B_EXTERNAL_ANALYSIS_BASE_URL | quote }}
            - name: K9B_EXTERNAL_ANALYSIS_MODEL
              value: {{ .Values.scheduler.env.K9B_EXTERNAL_ANALYSIS_MODEL | quote }}
            - name: K9B_EXTERNAL_ANALYSIS_TIMEOUT_SECONDS
              value: {{ .Values.scheduler.env.K9B_EXTERNAL_ANALYSIS_TIMEOUT_SECONDS | quote }}
            - name: K9B_EXTERNAL_ANALYSIS_MAX_TOKENS_REVIEW_ENRICHMENT
              value: {{ .Values.scheduler.env.K9B_EXTERNAL_ANALYSIS_MAX_TOKENS_REVIEW_ENRICHMENT | quote }}
            - name: K9B_EXTERNAL_ANALYSIS_MAX_TOKENS_AUTO_DRILLDOWN
              value: {{ .Values.scheduler.env.K9B_EXTERNAL_ANALYSIS_MAX_TOKENS_AUTO_DRILLDOWN | quote }}
            - name: K9B_EXTERNAL_ANALYSIS_TEMPERATURE
              value: {{ .Values.scheduler.env.K9B_EXTERNAL_ANALYSIS_TEMPERATURE | quote }}
            - name: LLAMA_CPP_BASE_URL
              value: {{ .Values.scheduler.env.LLAMA_CPP_BASE_URL | quote }}
            - name: LLAMA_CPP_MODEL
              value: {{ .Values.scheduler.env.LLAMA_CPP_MODEL | quote }}
            - name: HEALTH_CONFIG_PATH
              value: {{ .Values.scheduler.env.HEALTH_CONFIG_PATH | quote }}
            - name: HEALTH_RUNS_DIR
              value: {{ .Values.scheduler.env.HEALTH_RUNS_DIR | quote }}
            - name: PYTHONPATH
              value: {{ .Values.scheduler.env.PYTHONPATH | quote }}
            - name: HEALTH_BUILD_DIAGNOSTIC_PACK
              value: {{ .Values.scheduler.env.HEALTH_BUILD_DIAGNOSTIC_PACK | quote }}
            - name: LLAMA_CPP_ENABLE_THINKING
              value: {{ .Values.scheduler.env.LLAMA_CPP_ENABLE_THINKING | quote }}
            - name: HEALTH_REQUIRE_SUMMARY
              value: {{ .Values.scheduler.env.HEALTH_REQUIRE_SUMMARY | quote }}
            - name: HEALTH_REQUIRE_DIAGNOSTIC_PACK
              value: {{ .Values.scheduler.env.HEALTH_REQUIRE_DIAGNOSTIC_PACK | quote }}
            - name: KUBERNETES_AUTH_MODE
              value: {{ .Values.kubernetes.auth.mode | quote }}
            - name: KUBERNETES_AUTH_KUBECONFIG_ENABLED
              value: {{ .Values.kubeconfig.enabled | quote }}
            {{- if and .Values.kubeconfig.enabled (ne .Values.kubernetes.auth.mode "inCluster") }}
            - name: KUBECONFIG
              value: {{ printf "%s/%s" .Values.kubeconfig.mountPath .Values.kubeconfig.fileName | quote }}
            {{- end }}
            {{- if and (eq .Values.kubernetes.auth.mode "inCluster") .Values.serviceAccount.automountServiceAccountToken }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- if .Values.scheduler.smallProvider.existingSecret }}
            - name: K9B_EXTERNAL_ANALYSIS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.scheduler.smallProvider.existingSecret }}
                  key: {{ .Values.scheduler.smallProvider.apiKeyKey }}
            {{- end }}
          {{- with .Values.scheduler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.healthConfig.enabled }}
            - name: health-config
              mountPath: {{ .Values.healthConfig.mountPath }}
              subPath: health-config.json
              readOnly: true
            {{- end }}
            {{- if .Values.healthConfig.baseline.enabled }}
            - name: health-config
              mountPath: /app/runs/health-baseline.local.json
              subPath: health-baseline.local.json
              readOnly: true
            {{- end }}
            {{- if and .Values.kubeconfig.enabled (ne .Values.kubernetes.auth.mode "inCluster") }}
            - name: kubeconfig
              mountPath: {{ .Values.kubeconfig.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.runs.persistence.enabled }}
            - name: runs
              mountPath: {{ .Values.runs.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- if or .Values.healthConfig.enabled .Values.healthConfig.baseline.enabled }}
        - name: health-config
          configMap:
            name: {{ include "k9b.healthConfig.fullname" . }}
        {{- end }}
        {{- if and .Values.kubeconfig.enabled (ne .Values.kubernetes.auth.mode "inCluster") }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.kubeconfig.secretName }}
        {{- end }}
        {{- if .Values.runs.persistence.enabled }}
        - name: runs
          persistentVolumeClaim:
            claimName: {{ include "k9b.runs.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        Affinity logic:
        1. If scheduler.affinity is explicitly set with content:
           - Render scheduler affinity only (override global if needed)
        2. If global affinity has content:
           - Render global affinity (includes podAffinity if set)
        3. Otherwise, render default hard affinity (production default)
      */ -}}
      {{- $hasSchedulerAffinity := false -}}
      {{- $schedulerAffinityPodAffinityContent := false -}}
      {{- if hasKey .Values.scheduler "affinity" }}
        {{- $hasSchedulerAffinity = true -}}
        {{- /* Check if podAffinity has actual content, not just empty dict */ -}}
        {{- if and .Values.scheduler.affinity.podAffinity (not (empty .Values.scheduler.affinity.podAffinity)) }}
          {{- $schedulerAffinityPodAffinityContent = true -}}
        {{- end }}
      {{- end }}
      {{- $hasGlobalAffinityContent := false -}}
      {{- if hasKey .Values "affinity" }}
        {{- if not (empty .Values.affinity) }}
          {{- $hasGlobalAffinityContent = true -}}
        {{- end }}
      {{- end }}
      {{- $renderAffinity := false -}}
      {{- $renderDefaultAffinity := false -}}
      {{- /* Determine what to render */ -}}
      {{- if $hasSchedulerAffinity }}
        {{- /* Scheduler affinity explicitly set - skip if empty podAffinity */ -}}
        {{- if or $schedulerAffinityPodAffinityContent }}
          {{- $renderAffinity = true -}}
        {{- end }}
      {{- else if $hasGlobalAffinityContent }}
        {{- /* Global affinity has content */ -}}
        {{- $renderAffinity = true -}}
      {{- else }}
        {{- /* Default: hard affinity for production */ -}}
        {{- $renderAffinity = true -}}
        {{- $renderDefaultAffinity = true -}}
      {{- end }}
      {{- if $renderAffinity }}
      affinity:
        {{- /* Render global affinity if it has content (and no scheduler affinity override) */ -}}
        {{- if and $hasGlobalAffinityContent (not $hasSchedulerAffinity) }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- end }}
        {{- /* Render scheduler podAffinity if it has content */ -}}
        {{- if and $hasSchedulerAffinity $schedulerAffinityPodAffinityContent }}
        {{- with .Values.scheduler.affinity }}
        podAffinity:
          {{- if .podAffinity.requiredDuringSchedulingIgnoredDuringExecution }}
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .podAffinity.requiredDuringSchedulingIgnoredDuringExecution | nindent 12 }}
          {{- end }}
          {{- if .podAffinity.preferredDuringSchedulingIgnoredDuringExecution }}
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .podAffinity.preferredDuringSchedulingIgnoredDuringExecution | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- /* Default hard affinity for production */ -}}
        {{- if $renderDefaultAffinity }}
        {{- $backendLabels := dict "app.kubernetes.io/name" (include "k9b.name" .) "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "backend" | toJson | fromJson }}
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- toYaml $backendLabels | nindent 18 }}
              topologyKey: kubernetes.io/hostname
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
