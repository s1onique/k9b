{{/*
ServiceAccount, ClusterRole and ClusterRoleBinding for k9b diagnostics.
Creates read-only cluster-wide RBAC for accessing Kubernetes resources when clusterScoped=true.
Creates namespace-scoped Role/RoleBinding when clusterScoped=false.

Backward compatibility: If clusterScoped is not set, falls back to clusterWide.
clusterScoped takes precedence over the deprecated clusterWide.
*/}}
{{- if .Values.rbac.create }}
{{- $clusterScoped := include "k9b.rbac.clusterScoped" . }}
{{- if eq $clusterScoped "true" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k9b.serviceAccountName" . }}
  labels:
    {{- include "k9b.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k9b.fullname" . }}
  labels:
    {{- include "k9b.labels" . | nindent 4 }}
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - namespaces
      - nodes
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - limitranges
    verbs:
      - get
      - list
      - watch
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - controllerrevisions
    verbs:
      - get
      - list
      - watch
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  # Networking resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  # Autoscaling resources
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
  # Metrics resources (read-only)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
  # Monitoring CRDs (Prometheus Operator) - read-only
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagers
      - prometheuses
      - prometheusrules
      - servicemonitors
      - podmonitors
    verbs:
      - get
      - list
      - watch
  # VictoriaMetrics Operator CRDs - read-only
  - apiGroups: ["operator.victoriametrics.com"]
    resources:
      - vmalerts
      - vmrules
      - vmservicescrapes
      - vmpodscrapes
    verbs:
      - get
      - list
      - watch
  # Discovery API resources (EndpointSlice for Service backend identity)
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  # Monitoring CRDs - additional resources for Alertmanager discovery
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagerconfigs
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k9b.fullname" . }}
  labels:
    {{- include "k9b.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k9b.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k9b.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k9b.serviceAccountName" . }}
  labels:
    {{- include "k9b.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k9b.fullname" . }}
  labels:
    {{- include "k9b.labels" . | nindent 4 }}
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - configmaps
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  # Networking resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  # Autoscaling resources
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
  # Metrics resources (read-only)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
  # Discovery API resources (EndpointSlice for Service backend identity)
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  # Monitoring CRDs (Prometheus Operator) - read-only
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagers
      - prometheuses
      - alertmanagerconfigs
      - prometheusrules
      - servicemonitors
      - podmonitors
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k9b.fullname" . }}
  labels:
    {{- include "k9b.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k9b.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k9b.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}