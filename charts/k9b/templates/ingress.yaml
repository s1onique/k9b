{{/*
Ingress for k9b services.
Creates ingress rules for backend and frontend when enabled.
*/}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "k9b.fullname" . }}
  labels:
    {{- include "k9b.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
      paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: {{ include "k9b.backend.fullname" . }}
              port:
                number: {{ .Values.backend.service.port }}
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "k9b.frontend.fullname" . }}
              port:
                number: {{ .Values.frontend.service.port }}
{{- end }}
