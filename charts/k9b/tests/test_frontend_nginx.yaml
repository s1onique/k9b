# Helm test assertions for k9b frontend nginx deployment.
# Ensures nginx runs unprivileged with readOnlyRootFilesystem + writable /tmp.
suite: frontend nginx deployment

templates:
  - deployment-frontend.yaml

tests:
  # ===== Security context with readOnlyRootFilesystem =====

  - it: frontend should render readOnlyRootFilesystem: true
    set:
      frontend.securityContext.readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: frontend should render allowPrivilegeEscalation: false
    set:
      frontend.securityContext.allowPrivilegeEscalation: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: frontend should drop all capabilities
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  # ===== Writable /tmp volume mount =====

  - it: frontend should mount emptyDir at /tmp for nginx temp paths
    asserts:
      - isNotNull:
          path: spec.template.spec.volumes[name=nginx-tmp]
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: nginx-tmp
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /tmp

  # ===== Health probes =====

  - it: frontend should have readinessProbe on /healthz
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: frontend should have livenessProbe on /healthz
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http

  # ===== No forbidden runtime commands =====

  - it: frontend should NOT render npm run dev
    set:
      frontend.command:
        - npm
        - run
        - dev
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command
          pattern: "npm.*dev"

  - it: frontend should NOT render vite at runtime
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0]
          pattern: "vite"

  - it: frontend should NOT render npm ci at runtime
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0]
          pattern: "npm ci"

  - it: frontend should NOT render npm install at runtime
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0]
          pattern: "npm install"

  # ===== Default command should be empty (use image CMD) =====

  - it: frontend should use image default CMD when command is empty
    set:
      frontend.command: []
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].command

  # ===== Nginx ConfigMap regression: backend service name must match Helm release =====

  # Regression check: when configmapNginx is enabled, the nginx ConfigMap must NOT
  # contain the hardcoded "k9b-backend" upstream (which would fail to resolve when
  # the Helm release name is not the chart name, e.g. "infra-k9b-backend").
  # The ConfigMap is created by configmap-frontend-nginx.yaml template.

  - it: frontend nginx ConfigMap should NOT contain hardcoded "k9b-backend" upstream
    set:
      frontend.configmapNginx: true
      # Simulate a release name that is different from the chart name
      # to expose the bug where nginx.conf has a static upstream.
      # Note: The test only validates that the ConfigMap exists and the deployment
      # references it. The actual nginx.conf content is validated by ensuring the
      # ConfigMap is rendered with the Helm-templated backend fullname.
    asserts:
      # ConfigMap must exist when configmapNginx is enabled
      - template:
          path: templates/configmap-frontend-nginx.yaml
          isNotNull: true
      - isNotNull:
          path: spec.template.spec.volumes[name=nginx-conf]
      # Verify the ConfigMap uses Helm template for backend fullname
      - matchRegex:
          template: templates/configmap-frontend-nginx.yaml
          pattern: 'k9b\.backend\.fullname'

  # Verify nginx.conf content in ConfigMap templates the backend service name
  - it: nginx ConfigMap should template backend service name (not hardcoded k9b-backend)
    set:
      frontend.configmapNginx: true
    asserts:
      # The configmap-frontend-nginx.yaml uses {{ include "k9b.backend.fullname" . }}
      # for the proxy_pass upstream. We verify the template is present (not the literal).
      - matchRegex:
          template: templates/configmap-frontend-nginx.yaml
          pattern: 'proxy_pass http://\{\{.*k9b\.backend\.fullname.*\}\}:8080'
      # The hardcoded "k9b-backend" string must NOT appear as the upstream value.
      - notMatchRegex:
          template: templates/configmap-frontend-nginx.yaml
          pattern: 'proxy_pass http://k9b-backend:'

  # ===== Static asset serving: /assets/ returns 404 for missing files =====
  # Regression: missing assets must return 404, not fall back to index.html

  - it: nginx ConfigMap /assets/ location should use try_files $uri =404
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /assets/.*\{[^}]*try_files \$uri =404;'

  - it: nginx ConfigMap /assets/ location should have immutable cache header
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /assets/.*\{[^}]*add_header Cache-Control "public, max-age=31536000, immutable" always;'

  # ===== Root/index.html: explicit no-store cache control =====

  - it: nginx ConfigMap / location should have no-store cache header
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = / \{[^}]*add_header Cache-Control "no-store, no-cache, must-revalidate" always;'

  - it: nginx ConfigMap /index.html location should have no-store cache header
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /index.html \{[^}]*add_header Cache-Control "no-store, no-cache, must-revalidate" always;'

  # ===== SPA fallback preserved for app routes =====

  - it: nginx ConfigMap should preserve SPA fallback for non-asset routes
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location / \{[^}]*try_files \$uri \$uri/ /index.html;'

  - it: nginx ConfigMap SPA fallback location should have no-store cache header
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location / \{[^}]*add_header Cache-Control "no-store, no-cache, must-revalidate" always;[^}]*try_files \$uri \$uri/ /index.html;'
