# Helm test assertions for k9b backend deployment in-cluster authentication mode.
suite: in-cluster authentication - backend deployment

templates:
  - deployment.yaml

tests:
  # ===== inCluster mode: no kubeconfig =====

  - it: backend should NOT render KUBECONFIG env when mode is inCluster
    set:
      kubernetes.auth.mode: inCluster
      kubeconfig.enabled: true
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env
          pattern: KUBECONFIG

  - it: backend should NOT render kubeconfig volume mount when mode is inCluster
    set:
      kubernetes.auth.mode: inCluster
      kubeconfig.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.volumes[name=kubeconfig]

  - it: backend should NOT render kubeconfig secret volume when mode is inCluster
    set:
      kubernetes.auth.mode: inCluster
      kubeconfig.enabled: true
    asserts:
      - isNull:
          path: spec.template.spec.volumes[name=kubeconfig]

  # ===== serviceAccountName and automountServiceAccountToken =====

  - it: backend should render serviceAccountName
    set:
      serviceAccount.create: true
      serviceAccount.name: ""
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-k9b-sa

  - it: backend should render automountServiceAccountToken true
    set:
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: backend should render automountServiceAccountToken false
    set:
      serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  # ===== POD_NAMESPACE in inCluster mode =====

  - it: backend should render POD_NAMESPACE env from fieldRef in inCluster mode
    set:
      kubernetes.auth.mode: inCluster
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env
          pattern: "name: POD_NAMESPACE"

  - it: backend should NOT render POD_NAMESPACE when not inCluster mode
    set:
      kubernetes.auth.mode: auto
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env
          pattern: "name: POD_NAMESPACE"

  - it: backend should NOT render POD_NAMESPACE when automountServiceAccountToken is false
    set:
      kubernetes.auth.mode: inCluster
      serviceAccount.automountServiceAccountToken: false
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env
          pattern: "name: POD_NAMESPACE"

  # ===== kubeconfig mode: kubeconfig IS rendered =====

  - it: backend should render KUBECONFIG env when mode is kubeconfig
    set:
      kubernetes.auth.mode: kubeconfig
      kubeconfig.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env
          pattern: "name: KUBECONFIG"

  - it: backend should render kubeconfig volume mount when mode is kubeconfig
    set:
      kubernetes.auth.mode: kubeconfig
      kubeconfig.enabled: true
    asserts:
      - isNotNull:
          path: spec.template.spec.volumes[name=kubeconfig]

  # ===== Kubernetes-safe bind configuration =====

  - it: backend should render --unsafe-bind flag by default (Kubernetes-safe bind)
    # Default unsafeBind=true enables cluster-wide access via Service
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args
          pattern: "--unsafe-bind"

  - it: backend should render K9B_UI_HOST=0.0.0.0 by default
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env
          pattern: "name: K9B_UI_HOST"
          value: "0.0.0.0"

  - it: backend should render K9B_UI_PORT=8080
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env
          pattern: "name: K9B_UI_PORT"
          value: "8080"

  - it: backend container should expose port 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].protocol
          value: TCP

  - it: backend should NOT render --unsafe-bind when unsafeBind is false (localhost-only)
    set:
      backend.unsafeBind: false
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args
          pattern: "--unsafe-bind"

  - it: backend should render localhost K9B_UI_HOST when unsafeBind is false
    set:
      backend.unsafeBind: false
      backend.env.K9B_UI_HOST: "127.0.0.1"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env
          pattern: "name: K9B_UI_HOST"
          value: "127.0.0.1"

  # ===== K9B_ENABLE_DEBUG_ENDPOINTS =====

  - it: backend should render K9B_ENABLE_DEBUG_ENDPOINTS=false by default
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env
          pattern: 'name: K9B_ENABLE_DEBUG_ENDPOINTS'
          value: 'value: "false"'

  - it: backend should render K9B_ENABLE_DEBUG_ENDPOINTS=true when override is set
    set:
      backend.env.K9B_ENABLE_DEBUG_ENDPOINTS: "true"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env
          pattern: 'name: K9B_ENABLE_DEBUG_ENDPOINTS'
          value: 'value: "true"'

  # ===== Backend Service port =====

  - it: backend service should expose port 8080
    template: service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.ports[0].protocol
          value: TCP
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.type
          value: ClusterIP

  - it: frontend service should expose port 8080
    template: service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http

  # ===== nginx proxy_pass points to backend Service on port 8080 =====

  - it: nginx ConfigMap should proxy /api/ to backend service on port 8080
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass http://\{\{.*k9b\.backend\.fullname.*\}\}:8080/api/'

  - it: nginx ConfigMap should NOT contain hardcoded backend address
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass http://k9b-backend:'

  # ===== Frontend nginx backend service uses consistent port 8080 =====

  - it: frontend nginx should listen on port 8080
    template: configmap-frontend-nginx.yaml
    set:
      frontend.configmapNginx: true
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'listen 8080;'
