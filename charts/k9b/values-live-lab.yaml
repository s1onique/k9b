# Live lab values for K3s/CNPG cluster deployments.
#
# This file provides live-lab-safe scheduling and resource overrides
# that allow k9b to schedule reliably on self-hosted lab runner clusters
# without weakening production defaults.
#
# Usage:
#   helm install k9b ./charts/k9b -f charts/k9b/values-live-lab.yaml [other options]
#
# Or override individual values:
#   helm install k9b ./charts/k9b --set scheduler.resources.requests.cpu=25m [other options]

# =============================================================================
# RBAC: Cluster-scoped for OTel lab (scheduler needs nodes, monitoring CRDs)
# NOTE: The OTel lab uses cluster-scoped RBAC because the scheduler needs:
# - nodes (cluster-scoped resource for snapshot collection)
# - monitoring.coreos.com CRDs (alertmanagers, prometheuses, etc.)
# - operator.victoriametrics.com CRDs (vmalerts, vmrules, etc.)
# =============================================================================
rbac:
  create: true
  clusterScoped: true

# =============================================================================
# Resources: Smaller, honest values for lab environments
# Lab clusters often have limited resources or shared nodes.
# Keep requests non-zero so the scheduler respects actual resource needs.
# =============================================================================
backend:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

scheduler:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Disable scheduler pod affinity entirely for lab scheduling.
  # Lab clusters may not have nodes that satisfy both taint/toleration
  # and pod affinity requirements with a single replica.
  # This completely removes the affinity constraint (not a soft/preferred version).
  affinity:
    podAffinity: {}

frontend:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# =============================================================================
# Health Configuration: Required for scheduler startup
# The scheduler health gate validates that targets is non-empty.
# Provider-smoke/live-lab deployments need at least one target to start.
# =============================================================================
healthConfig:
  data:
    targets:
      - context: "in-cluster"
        label: "lab-cluster"
        monitor_health: true
        watched_helm_releases: []
        watched_crd_families: []
        cluster_class: "lab"
        cluster_role: "primary"
        baseline_cohort: "fleet-lab"
    # =============================================================================
    # External Analysis: Enable auto-diagnosis loop and drilldown for live lab
    # These settings control the automatic diagnosis loop behavior in the scheduler.
    # The loop periodically runs diagnostic checks and can drill down into findings.
    #
    # IMPORTANT: Both auto_drilldown and review_enrichment require a provider that
    # points to an enabled adapter. Without this, review enrichment logs:
    #   provider="unspecified" status="skipped" skip_reason="No review enrichment provider configured"
    # =============================================================================
    external_analysis:
      # Adapters: Define enabled providers for external analysis.
      # The provider field in auto_drilldown/review_enrichment must reference an enabled adapter.
      adapters:
        - name: openai_compatible
          enabled: true
      auto_drilldown:
        enabled: true
        provider: openai_compatible
        max_per_run: 1
      review_enrichment:
        enabled: true
        provider: openai_compatible
