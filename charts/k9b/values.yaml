# Default values for k9b Helm chart.
# No secrets are embedded here - provide via --set or external Secret/ConfigMap references.

image:
  backend:
    repository: registry.spbnix.com/gitinsky/k9b-backend
    tag: ecacd81
    pullPolicy: IfNotPresent
  frontend:
    repository: registry.spbnix.com/gitinsky/k9b-frontend
    tag: ecacd81
    pullPolicy: IfNotPresent

# Kubernetes authentication mode for kubectl commands.
# - auto: Prefer explicit kubeconfig if present, otherwise use in-cluster service account (default)
# - inCluster: Use Pod ServiceAccount token at /var/run/secrets/kubernetes.io/serviceaccount/token
# - kubeconfig: Use explicit kubeconfig file (requires kubeconfig.enabled=true)
kubernetes:
  auth:
    mode: auto

backend:
  replicaCount: 1
  service:
    port: 8080
  # unsafeBind: When true, allows binding to non-loopback addresses (0.0.0.0, external IPs).
  # WARNING: The UI/API has mutation endpoints. Requires uiAuth.enabled=true for exposed deployments.
  # Default (true) enables cluster-wide access via Kubernetes Service.
  unsafeBind: true
  # command: Override container command (entrypoint). Leave empty to use image's default.
  command: []
  # args: Override container arguments. Leave empty to use image's default.
  args: []
  # incidentStore: Incident store configuration (SQLite backend recommended for production).
  # contentIndex: Content index configuration for accelerated read path.
  # When enabled, the backend queries a pre-built SQLite index for content lookups.
  # Safe fallback: if the DB is missing, stale, corrupt, or invalid, the backend
  # falls back to the direct read path automatically.
  contentIndex:
    # enabled: Enable content index read path (default: true).
    # Set to false to disable and use direct read path only.
    enabled: true
    # dbPath: Path to the SQLite content index database file.
    # Must be readable by the backend pod (mounted at /app/runs by default).
    dbPath: ""
  incidentStore:
    # backend: Incident store backend type (memory|file|sqlite).
    # sqlite is recommended for production with scheduler deployment.
    backend: sqlite
    # sqlitePath: Path to SQLite database file.
    sqlitePath: /app/runs/incidents/k9b-incidents.sqlite3
    # journalMode: SQLite journal mode (DELETE|TRUNCATE|PERSIST|WAL).
    # WARNING: WAL mode requires careful mount configuration (shared PVC) and is NOT the default.
    # WAL can cause "database is locked" errors in multi-pod deployments.
    journalMode: DELETE
  # internalApi: Internal API configuration for scheduler-to-backend promotion.
  # REQUIRED when incidentStore.backend=sqlite (scheduler uses backend API for incident promotion).
  internalApi:
    # existingSecret: Name of a Kubernetes Secret containing K9B_INTERNAL_API_TOKEN.
    # REQUIRED for sqlite backend mode - Helm rendering will FAIL without this.
    # Create via: kubectl create secret generic k9b-internal-api --from-literal=K9B_INTERNAL_API_TOKEN=<your-token>
    # IMPORTANT: Never commit real token values to values.yaml or version control.
    existingSecret: ""
    # tokenKey: Key name in the Secret containing the token.
    tokenKey: K9B_INTERNAL_API_TOKEN
  # auth: Admin authentication for the backend UI/API.
  # When enabled, the backend requires login with admin credentials.
  # The password hash must come from a Kubernetes Secret (existingSecret or adminPasswordHash).
  auth:
    # enabled: Enable admin authentication for the backend.
    enabled: false
    # adminUsername: Admin login username.
    adminUsername: admin
    # existingSecret: Name of a Kubernetes Secret containing K9B_ADMIN_PASSWORD_HASH.
    # Preferred for production deployments. Create via:
    #   kubectl create secret generic k9b-admin-auth --from-literal=K9B_ADMIN_PASSWORD_HASH='$pbkdf2-sha256$600000$...'
    # Leave empty to use adminPasswordHash below (for local/dev only).
    existingSecret: ""
    # passwordHashKey: Key name in the Secret containing the password hash.
    # Should match the key used when creating the Secret.
    passwordHashKey: K9B_ADMIN_PASSWORD_HASH
    # adminPasswordHash: Direct password hash value (local/dev convenience only).
    # WARNING: Do not commit real password hashes to values.yaml or version control.
    # Use existingSecret for production deployments.
    # The hash format is PBKDF2-HMAC-SHA256 (e.g., $pbkdf2-sha256$600000$salt$encoded_hash).
    adminPasswordHash: ""
    # secureCookie: Set to true for HTTPS deployments. False for HTTP/local development.
    # When true, the session cookie is marked Secure (HTTPS only).
    secureCookie: false
    # sessionCookieName: Name of the session cookie.
    sessionCookieName: k9b_session
    # sessionMaxAgeSeconds: Session cookie max age in seconds (8 hours by default).
    sessionMaxAgeSeconds: 28800
    # sessionIdleTimeoutSeconds: Session idle timeout in seconds (30 minutes by default).
    sessionIdleTimeoutSeconds: 1800
  env:
    # HEALTH_SKIP_REFRESH: Set to "0" to enable auto-refresh, "1" to skip.
    HEALTH_SKIP_REFRESH: "1"
    # K9B_UI_HOST: Bind address for the UI/API server.
    # Set to 0.0.0.0 for cluster-wide access via Kubernetes Service.
    # Requires backend.unsafeBind=true.
    K9B_UI_HOST: "0.0.0.0"
    K9B_UI_PORT: "8080"
    # HEALTH_CONFIG_PATH: Path to health config inside the container.
    HEALTH_CONFIG_PATH: "/app/runs/health-config.json"
    # HEALTH_RUNS_DIR: Directory for health run artifacts.
    HEALTH_RUNS_DIR: "/app/runs"
    HEALTH_UI_RUNS_DIR: "/app/runs"
    # PYTHONPATH: Python module search path.
    PYTHONPATH: "/app/src"
    # K9B_ENABLE_DEBUG_ENDPOINTS: Enable UI debug diagnostics endpoints (/api/debug/*).
    # Set to "true" to show diagnostic execution details button in the UI.
    K9B_ENABLE_DEBUG_ENDPOINTS: "false"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

scheduler:
  replicaCount: 1
  # command: Override container command (entrypoint). Leave empty to use image's default.
  command: []
  # args: Override container arguments. When empty, defaults to ["scheduler"].
  # The scheduler runs run_health_scheduler.py which accepts:
  #   --config, --every-seconds, --max-runs, --once, --quiet
  # Do NOT pass --unsafe-bind to scheduler; that flag belongs to the UI/API server.
  args: []
  # contentIndex: Content index producer configuration.
  # The scheduler produces and maintains the SQLite content index for backend read-path.
  # This is separate from the backend's read-path configuration.
  contentIndex:
    # enabled: Enable content index producer (default: true).
    # When enabled, the scheduler updates /app/runs/content-index.sqlite after each run.
    enabled: true
    # dbPath: Optional scheduler override. Empty means inherit backend.contentIndex.dbPath.
    dbPath: ""
    # updateMode: Update mode (update|rebuild_if_missing|rebuild).
    # - update: Incremental update (default)
    # - rebuild_if_missing: Rebuild only if DB is missing or invalid
    # - rebuild: Full rebuild every time
    updateMode: update
  # incidentPromotion: Incident promotion configuration.
  # When backend uses SQLite store (incidentStore.backend=sqlite), scheduler must
  # promote incidents via the backend internal API to avoid direct SQLite access.
  incidentPromotion:
    # mode: Promotion mode (local|backend-api|auto).
    # - local: Direct store promotion (memory/file backends only) - SCHEDULER CANNOT USE THIS WITH SQLITE
    # - backend-api: POST to backend internal API (required for SQLite backend)
    # - auto: Automatically select based on backend type (default)
    # Note: backend-api mode requires internalApi configuration below.
    mode: backend-api
    # internalApi: Configuration for backend internal API promotion.
    internalApi:
      # backendUrl: Base URL of the k9b-backend service.
      # Default: http://k9b-backend.k9b.svc.cluster.local:8080
      # REQUIRED for backend-api/auto mode - Helm rendering will FAIL without this.
      backendUrl: "http://k9b-backend.k9b.svc.cluster.local:8080"
      # existingSecret: Name of a Kubernetes Secret containing K9B_INTERNAL_API_TOKEN.
      # REQUIRED for backend-api mode when backend uses SQLite - Helm rendering will FAIL without this.
      # IMPORTANT: Never commit real token values to values.yaml or version control.
      # Create via: kubectl create secret generic k9b-internal-api --from-literal=K9B_INTERNAL_API_TOKEN=<your-token>
      existingSecret: ""
      # tokenKey: Key name in the Secret containing the token.
      tokenKey: K9B_INTERNAL_API_TOKEN
  env:
    # K9B_EXTERNAL_ANALYSIS_*: Canonical env vars for OpenAI-compatible review enrichment.
    # Override via --set scheduler.env.K9B_EXTERNAL_ANALYSIS_BASE_URL=http://your-llm:8080
    K9B_AUTOMATIC_DIAGNOSIS_LOOP_ENABLED: "false"
    K9B_REVIEW_ENRICHMENT_ENABLED: "false"
    K9B_AUTO_DRILLDOWN_ENABLED: "false"
    K9B_EXTERNAL_ANALYSIS_PROVIDER: ""
    K9B_EXTERNAL_ANALYSIS_BASE_URL: ""
    K9B_EXTERNAL_ANALYSIS_MODEL: ""
    K9B_EXTERNAL_ANALYSIS_TIMEOUT_SECONDS: "120"
    K9B_EXTERNAL_ANALYSIS_MAX_TOKENS_REVIEW_ENRICHMENT: "1200"
    K9B_EXTERNAL_ANALYSIS_MAX_TOKENS_AUTO_DRILLDOWN: "1200"
    K9B_EXTERNAL_ANALYSIS_TEMPERATURE: "0.0"
    # Legacy LLAMA_CPP_* vars are still accepted but deprecated.
    LLAMA_CPP_BASE_URL: ""
    LLAMA_CPP_MODEL: ""
    HEALTH_CONFIG_PATH: "/app/runs/health-config.json"
    HEALTH_RUNS_DIR: "/app/runs/health"
    PYTHONPATH: "/app/src"
    HEALTH_BUILD_DIAGNOSTIC_PACK: "1"
    LLAMA_CPP_ENABLE_THINKING: "false"
    # HEALTH_REQUIRE_SUMMARY: When "true", the scheduler script exits non-zero if health-summary
    # finds no runs (e.g., empty PVC). Default "false" allows fresh-PVC startup without failing.
    HEALTH_REQUIRE_SUMMARY: "false"
    # HEALTH_REQUIRE_DIAGNOSTIC_PACK: When "true", diagnostic pack failure causes non-zero exit.
    # Default "false" makes pack failures non-fatal (WARNING logged, script continues).
    HEALTH_REQUIRE_DIAGNOSTIC_PACK: "false"
  # envFrom: Inject env vars from Secret/ConfigMap refs (env vars from env: above are still set).
  # Example: Use a Secret to inject LLM credentials without hardcoding them in values.
  #   envFrom:
  #     - secretRef:
  #         name: k9b-external-analysis-credentials
  envFrom: []
  # smallProvider: Configuration for the "small" provider used for non-incident checks
  # (review enrichment, next-check planning, auto drilldown).
  # When smallProvider.existingSecret is set, the API key is injected via secretKeyRef.
  # Use the same secret as diagnosisProvider for shared credential bundle.
  smallProvider:
    # existingSecret: Name of a Kubernetes Secret containing K9B_EXTERNAL_ANALYSIS_API_KEY.
    # The secret key must contain the raw API key value.
    # Create via: kubectl create secret generic k9b-diagnosis-credentials \
    #   --from-literal=K9B_EXTERNAL_ANALYSIS_API_KEY='your-api-key'
    existingSecret: ""
    # apiKeyKey: Key name in the Secret containing the API key.
    apiKeyKey: K9B_EXTERNAL_ANALYSIS_API_KEY
  # initContainer: Optional init container to create /app/runs/health before scheduler starts.
  # Useful as additional hardening, but the scheduler script handles directory creation itself.
  initContainer:
    enabled: false
    # image: Override the init container image. Defaults to same as scheduler image if empty.
    image: ""
    # command: Override the init container command. Defaults to ["mkdir", "-p", "/app/runs/health"].
    command: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

frontend:
  replicaCount: 1
  service:
    port: 8080
  # command: Override container command (entrypoint). Leave empty to use image's default.
  command: []
  # args: Override container arguments. Leave empty to use image's default.
  args: []
  # configmapNginx: When true, mounts a Helm-templated nginx ConfigMap that resolves
  # the backend service name dynamically (e.g. infra-k9b-backend). This is required
  # for the /api/ proxy to work correctly with release-prefixed Helm deployments.
  # The nginx config uses {{ include "k9b.backend.fullname" . }} for the upstream.
  configmapNginx: true
  # securityContext: Frontend container security context (for nginx-unprivileged).
  # Must keep readOnlyRootFilesystem: true with nginx-tmp emptyDir volume.
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  env:
    # VITE_BACKEND_HOST: Backend service DNS name for Vite dev server (if used).
    # Note: The /api/ location proxy is configured via configmapNginx (nginx.conf),
    # which uses the Helm templated backend fullname (e.g. infra-k9b-backend).
    VITE_BACKEND_HOST: ""
    VITE_BACKEND_PORT: "8080"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  # hosts: List of ingress hosts with paths.
  # Example:
  #   hosts:
  #     - host: k9b.example.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  hosts: []
  # tls: TLS configuration (secretName and hosts).
  # Example (commented):
  #   tls:
  #     - secretName: k9b-tls
  #       hosts:
  #         - k9b.example.com
  tls: []

# Service account configuration.
# When serviceAccount.create=true, a ServiceAccount is created and used by all pods.
serviceAccount:
  create: true
  # name: If empty, defaults to <fullname>-sa
  name: ""
  # automountServiceAccountToken: Mount the service account token into the pods.
  # Set to false only if you want to disable automatic token mounting (e.g., to use
  # a custom credential mechanism). When using inCluster auth mode, this must be true.
  automountServiceAccountToken: true

# RBAC configuration for diagnostics.
# When rbac.create=true, ServiceAccount is always created.
# When rbac.clusterScoped=true, ClusterRole and ClusterRoleBinding are created (cluster-wide).
# When rbac.clusterScoped=false, Role and RoleBinding are created (namespace-scoped).
# Use clusterScoped=false for clusters where the runner lacks cluster-scoped RBAC permissions.
rbac:
  create: true
  # clusterScoped: When true, creates ClusterRole and ClusterRoleBinding (cluster-wide read access).
  # When false, creates Role and RoleBinding (namespace-scoped, requires no cluster permissions).
  clusterScoped: true
  # DEPRECATED: Use clusterScoped instead. This alias is retained for backward compatibility.
  # If both are set, clusterScoped takes precedence.
  clusterWide: true

# Runs storage persistence.
# PVC stores health run artifacts for scheduler and backend access.
runs:
  persistence:
    enabled: true
    size: 2Gi
    accessModes:
      - ReadWriteOnce
    # storageClassName: Leave empty to use cluster default.
    storageClassName: ""
    mountPath: /app/runs

# Health configuration (embedded in chart as ConfigMap).
# The healthConfig.data content is written to the health-config.json ConfigMap key.
# The healthConfig.baseline.data content is written to the health-baseline.local.json ConfigMap key.
healthConfig:
  enabled: true
  mountPath: /app/runs/health-config.json
  data:
    targets: []
  baseline:
    enabled: true
    data: {}

# Reference to external kubeconfig secret (for external cluster access).
# By default, uses in-cluster service account authentication.
# Enable this only if you need to access a different cluster than where k9b is deployed.
kubeconfig:
  enabled: false
  secretName: "k9b-kubeconfig"
  mountPath: "/app/kubeconfig"
  fileName: "config"

# Authentication token for UI/API mutation endpoints.
# Strongly recommended when HEALTH_UI_HOST is set to a non-loopback address
# unless the UI/API is protected by an authenticated reverse proxy.
uiAuth:
  enabled: false
  # Secret name containing K9B_UI_TOKEN key with the bearer token value.
  # Create via: kubectl create secret generic k9b-ui-auth --from-literal=K9B_UI_TOKEN=<your-token>
  secretName: "k9b-ui-auth"

# Pod-level security context (applied to all pods if set)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container-level security context
containerSecurityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Node selection and tolerations
nodeSelector: {}

tolerations: []

affinity: {}

# Diagnosis provider configuration for LLM-powered incident diagnosis.
# When diagnosisProvider.enabled=true, the backend API can call a configured
# LLM provider for one-pass diagnosis of incidents.
diagnosisProvider:
  # enabled: Enable diagnosis provider integration.
  enabled: false
  # existingSecret: Name of a Kubernetes Secret containing K9B_DIAGNOSIS_API_KEY.
  # The secret key must contain the raw API key value.
  # Create via: kubectl create secret generic k9b-diagnosis-credentials \
  #   --from-literal=K9B_DIAGNOSIS_API_KEY='your-api-key'
  existingSecret: ""
  # apiKeyKey: Key name in the Secret containing the API key.
  apiKeyKey: K9B_DIAGNOSIS_API_KEY
  # provider: LLM provider type.
  # Supported: openai_compatible, gigachat, qwen
  provider: "openai_compatible"
  # baseUrl: Base URL for the LLM API (OpenAI-compatible endpoint).
  # Example: http://your-llm-service:8080/v1
  baseUrl: ""
  # model: Model identifier to use for diagnosis.
  model: ""
  # timeoutSeconds: Request timeout in seconds (1-300).
  timeoutSeconds: 120
  # maxOutputChars: Maximum response length (100-100000).
  maxOutputChars: 8000
