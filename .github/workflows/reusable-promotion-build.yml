# CI-HERMETIC-TOOLCACHE:
# k9b CI is intentionally shell-first/toolcache-first.  Avoid setup/download
# actions where a pinned runner tool-cache path or checked-in script can be used.
# Missing cached tools must fail fast, not download mutable replacements.
# See docs/ci-hermetic-toolchain.md.

# ACT-K9B-HULK-PROMOTION-AUTOMATED-CLOSURE-LIVE-QUALIFICATION-AND-CI-TIMING01
# WAVE CORRECTION01 — reusable image build workflow
#
# CORRECTION04: Two single-image Harbor callers.
# This workflow calls the canonical single-image Harbor builder twice:
#   - build-backend: builds k9b-backend image
#   - build-frontend: builds k9b-frontend image
# Scheduler is an alias of backend (same image).
#
# Outputs are consumed directly from the called workflow's declared outputs.
# No second registry lookup; no tag/digest reconstruction.

name: k9b promotion build

on:
  workflow_call:
    inputs:
      registry:
        description: "Harbor registry hostname"
        type: string
        required: true
      harbor_project:
        description: "Harbor project name"
        type: string
        required: true
    outputs:
      backend_image_ref:
        description: "registry/project/k9b-backend@sha256:<digest>"
        value: ${{ jobs.build-backend.outputs.image_ref }}
      scheduler_image_ref:
        description: "Same as backend_image_ref (scheduler uses backend image)"
        value: ${{ jobs.build-backend.outputs.image_ref }}
      frontend_image_ref:
        description: "registry/project/k9b-frontend@sha256:<digest>"
        value: ${{ jobs.build-frontend.outputs.image_ref }}
      backend_digest:
        description: "sha256:<digest> for backend"
        value: ${{ jobs.build-backend.outputs.image_digest }}
      scheduler_digest:
        description: "Same as backend_digest"
        value: ${{ jobs.build-backend.outputs.image_digest }}
      frontend_digest:
        description: "sha256:<digest> for frontend"
        value: ${{ jobs.build-frontend.outputs.image_digest }}
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      SPBNIX_CA_CERT_PEM:
        required: true

# =============================================================================
# MODEL B: Two single-image reusable-workflow callers
# Each calls harbor-build-image.yml with the correct input contract.
# No runs-on/steps; job-level uses + with + secrets only.
# =============================================================================

jobs:
  # P0-1: First single-image caller - backend
  build-backend:
    name: build k9b-backend
    uses: ./.github/workflows/harbor-build-image.yml
    with:
      registry: ${{ inputs.registry }}
      harbor_project: ${{ inputs.harbor_project }}
      image_name: k9b-backend
      dockerfile: ./Dockerfile.python
      build_args: |
        KUBECTL_VERSION=v1.29.6
        HELM_VERSION=3.20.1
      image_push_enabled: true
      registry_cache_read_enabled: true
      registry_cache_write_enabled: true
    secrets:
      HARBOR_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      HARBOR_TOKEN: ${{ secrets.REGISTRY_PASSWORD }}
      SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}

  # P0-1: Second single-image caller - frontend
  build-frontend:
    name: build k9b-frontend
    uses: ./.github/workflows/harbor-build-image.yml
    with:
      registry: ${{ inputs.registry }}
      harbor_project: ${{ inputs.harbor_project }}
      image_name: k9b-frontend
      dockerfile: ./frontend/Dockerfile
      build_args: ""
      image_push_enabled: true
      registry_cache_read_enabled: true
      registry_cache_write_enabled: true
    secrets:
      HARBOR_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      HARBOR_TOKEN: ${{ secrets.REGISTRY_PASSWORD }}
      SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}

  # MODEL A: Ordinary job - constructs and uploads aggregate artifact.
  # Consumes only the declared outputs from the Harbor callers.
  # P0-4: No crane/manifest-tool registry lookup; uses needs.* outputs directly.
  create-artifact:
    name: create image-reference artifact
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Generate image-refs.json from caller outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          # P0-6: Validate immutable ref grammar ^[^@]+@sha256:[0-9a-f]{64}$
          import re
          DIGEST_PATTERN = re.compile(r"^[^@]+@sha256:[0-9a-f]{64}$")

          backend_ref = os.environ.get("BACKEND_IMAGE_REF", "")
          frontend_ref = os.environ.get("FRONTEND_IMAGE_REF", "")

          for name, ref in [("backend", backend_ref), ("frontend", frontend_ref)]:
              if not DIGEST_PATTERN.match(ref):
                  print(f"FATAL: {name} image ref does not match required grammar: {ref}")
                  print(f"Required: registry/project/name@sha256:<64 hex chars>")
                  raise SystemExit(1)
              print(f"Validated {name} image ref: {ref}")

          # P0-4: Scheduler is alias of backend
          scheduler_ref = backend_ref

          data = {
              "backend": backend_ref,
              "scheduler": scheduler_ref,  # P0-4: alias of backend
              "frontend": frontend_ref,
          }
          with open("image-refs.json", "w") as fh:
              json.dump(data, fh, indent=2)
          print("Created image-refs.json")
          PY
        env:
          BACKEND_IMAGE_REF: ${{ needs.build-backend.outputs.image_ref }}
          FRONTEND_IMAGE_REF: ${{ needs.build-frontend.outputs.image_ref }}

      - name: Upload image-reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-refs
          path: image-refs.json
