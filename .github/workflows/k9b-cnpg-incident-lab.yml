# CI-HERMETIC-TOOLCACHE:
# k9b CI is intentionally shell-first/toolcache-first. Avoid setup/download
# actions where a pinned runner tool-cache path or checked-in script can be used.
# Missing cached tools must fail fast, not download mutable replacements.
# See docs/ci-hermetic-toolchain.md.

name: K3s CNPG Incident Lab

# Build-and-verify workflow for the K3s/CNPG incident lab scaffold.
# Live namespace-mode lab is available via manual workflow_dispatch with run_live_lab=true.
# The live lab runs in an existing K3s cluster with preinstalled CNPG operator.

on:
  # Manual workflow dispatch for ad-hoc runs
  workflow_dispatch:
    inputs:
      artifact_retention_days:
        description: 'Artifact retention days'
        required: false
        default: '7'
        type: string
      run_live_lab:
        description: 'Run live namespace-mode lab after build-and-verify'
        required: false
        default: false
        type: boolean
      incident_scenario:
        description: 'Incident scenario'
        required: false
        default: 'pod-failure'
        type: choice
        options:
          - pod-failure
      enable_provider_smoke:
        description: 'Enable provider-backed diagnosis smoke test (requires provider secrets)'
        required: false
        default: false
        type: boolean

  # CI on PR when lab files change (build-and-verify only, no live lab)
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/k9b-cnpg-incident-lab*.yml"
      - ".github/workflows/k9b-image-builder.yml"
      - "cmd/k9b-cnpg-incident-lab/**"
      - "internal/lab/cnpg/**"
      - "scripts/verify_k3s_cnpg_incident_lab_artifact.py"
      - "tests/test_verify_k3s_cnpg_incident_lab.py"
      - "tests/test_live_lab_config.py"
      - "fixtures/lab/**"
      - "Makefile"
      - "go.work"

  # CI on push to main when lab files change (build-and-verify only)
  push:
    branches:
      - main
    paths:
      - ".github/workflows/k9b-cnpg-incident-lab*.yml"
      - ".github/workflows/k9b-image-builder.yml"
      - "cmd/k9b-cnpg-incident-lab/**"
      - "internal/lab/cnpg/**"
      - "scripts/verify_k3s_cnpg_incident_lab_artifact.py"
      - "tests/test_verify_k3s_cnpg_incident_lab.py"
      - "tests/test_live_lab_config.py"
      - "fixtures/lab/**"
      - "Makefile"
      - "go.work"

env:
  GO_VERSION: '1.25'
  PYTHON_VERSION: '3.13'

jobs:
  # ===========================================================================
  # Build and Verify Job (always runs on ubuntu-latest)
  # ===========================================================================
  build-and-verify:
    name: Build and Verify Lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wire Go from tool cache
        run: source scripts/ci/wire_toolcache_go.sh "${{ env.GO_VERSION }}"

      - name: Wire Python from tool cache
        run: source scripts/ci/wire_toolcache_python.sh "${{ env.PYTHON_VERSION }}"

      - name: Emit toolchain provenance
        run: scripts/ci/emit_toolchain_provenance.sh "go,python"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install pytest pyyaml

      # Sync Go workspace
      - name: Sync Go workspace
        run: go work sync

      # Build the lab runner
      - name: Build lab runner
        run: |
          mkdir -p dist
          go build -v -o dist/k9b-cnpg-incident-lab ./cmd/k9b-cnpg-incident-lab

      # Run Go unit tests for lab package
      - name: Run Go unit tests
        run: |
          echo "=== Running Go unit tests for internal/lab/cnpg ==="
          go test -v ./internal/lab/cnpg/...

      # Run Python verifier tests
      - name: Run Python verifier tests
        run: |
          echo "=== Running Python verifier tests ==="
          .venv/bin/python -c "import yaml; print('PyYAML import OK')"
          .venv/bin/python -m pytest tests/test_verify_k3s_cnpg_incident_lab.py tests/test_live_lab_config.py -v

      # Verify passing fixture
      - name: Verify passing fixture
        run: |
          echo "=== Verifying passing fixture ==="
          .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py --artifact-dir fixtures/lab/pass

      # Verify fail-no-incident fixture fails
      - name: Verify fail-no-incident fixture fails as expected
        run: |
          echo "=== Verifying fail-no-incident fixture (should fail) ==="
          set +e
          .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py --artifact-dir fixtures/lab/fail-no-incident > /tmp/fail-no-incident.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: fail-no-incident fixture unexpectedly passed"
            cat /tmp/fail-no-incident.log
            exit 1
          fi
          echo "fail-no-incident correctly failed with exit code $rc"
          grep -E "k9b-incidents.json|k9b incident evidence" /tmp/fail-no-incident.log

      # Verify fail-secret fixture fails
      - name: Verify fail-secret fixture fails as expected
        run: |
          echo "=== Verifying fail-secret fixture (should fail) ==="
          set +e
          .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py --artifact-dir fixtures/lab/fail-secret > /tmp/fail-secret.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: fail-secret fixture unexpectedly passed"
            cat /tmp/fail-secret.log
            exit 1
          fi
          echo "fail-secret correctly failed with exit code $rc"
          grep -Ei "secret|password|api" /tmp/fail-secret.log

      # Upload build artifacts
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k9b-cnpg-incident-lab-ci-${{ github.run_id }}
          path: |
            dist/k9b-cnpg-incident-lab
            /tmp/fail-no-incident.log
            /tmp/fail-secret.log
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days || '7' }}

      - name: Summary
        run: |
          echo "=== K3s CNPG Incident Lab CI Summary ==="
          echo "Lab runner built: dist/k9b-cnpg-incident-lab"
          echo "Go tests: PASSED"
          echo "Python verifier tests: PASSED"
          echo "Passing fixture: PASSED"
          echo "Fail fixtures: Correctly rejected"
          if [[ "${{ inputs.run_live_lab }}" == "true" ]]; then
            echo "Live namespace-mode lab will run in 'live-k3s-lab' job."
          else
            echo "NOTE: Live lab not requested. Use workflow_dispatch with run_live_lab=true."
          fi

  # ===========================================================================
  # Build Lab Images (only when live lab is requested)
  # Reuses the canonical k9b-image-builder workflow - does NOT include
  # Docker/buildctl/registry logic here.
  # ===========================================================================
  build-lab-images:
    name: Build Lab Images
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_lab == true
    needs: build-and-verify
    uses: ./.github/workflows/k9b-image-builder.yml
    with:
      image_tag: ${{ github.sha }}
      push: true
      purpose: k3s-cnpg-lab
    secrets: inherit

  # ===========================================================================
  # Live K3s Lab Job (only runs when manually requested)
  # Reuses Harbor image-build workflow outputs and deploys to existing cluster.
  # ===========================================================================
  live-k3s-lab:
    name: Live K3s CNPG Lab (Namespace Mode)
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_lab == true
    needs:
      - build-and-verify
      - build-lab-images
    uses: ./.github/workflows/k9b-cnpg-incident-lab-live.yml
    with:
      incident_scenario: ${{ inputs.incident_scenario || 'pod-failure' }}
      artifact_retention_days: ${{ inputs.artifact_retention_days || '7' }}
      enable_provider_smoke: ${{ inputs.enable_provider_smoke || false }}
      backend_image_repository: ${{ needs.build-lab-images.outputs.backend_image_repository }}
      backend_image_tag: ${{ needs.build-lab-images.outputs.backend_image_tag }}
      backend_image_ref: ${{ needs.build-lab-images.outputs.backend_image_ref }}
      backend_image_digest: ${{ needs.build-lab-images.outputs.backend_image_digest }}
      frontend_image_repository: ${{ needs.build-lab-images.outputs.frontend_image_repository }}
      frontend_image_tag: ${{ needs.build-lab-images.outputs.frontend_image_tag }}
      frontend_image_ref: ${{ needs.build-lab-images.outputs.frontend_image_ref }}
    secrets: inherit
