name: K3s CNPG Incident Lab

# Build-and-verify workflow for the K3s/CNPG incident lab scaffold.
# Live K3s provisioning is available via manual workflow_dispatch with run_live_lab=true.

on:
  # Manual workflow dispatch for ad-hoc runs
  workflow_dispatch:
    inputs:
      artifact_retention_days:
        description: 'Artifact retention days'
        required: false
        default: '7'
        type: string
      run_live_lab:
        description: 'Run live K3s/CNPG lab after build-and-verify'
        required: false
        default: false
        type: boolean
      incident_scenario:
        description: 'Incident scenario'
        required: false
        default: 'pod-failure'
        type: choice
        options:
          - pod-failure

  # CI on PR when lab files change (build-and-verify only, no live K3s)
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/k9b-cnpg-incident-lab*.yml"
      - "cmd/k9b-cnpg-incident-lab/**"
      - "internal/lab/cnpg/**"
      - "scripts/verify_k3s_cnpg_incident_lab_artifact.py"
      - "tests/test_verify_k3s_cnpg_incident_lab.py"
      - "tests/test_live_lab_config.py"
      - "fixtures/lab/**"
      - "Makefile"
      - "go.work"

  # CI on push to main when lab files change (build-and-verify only)
  push:
    branches:
      - main
    paths:
      - ".github/workflows/k9b-cnpg-incident-lab*.yml"
      - "cmd/k9b-cnpg-incident-lab/**"
      - "internal/lab/cnpg/**"
      - "scripts/verify_k3s_cnpg_incident_lab_artifact.py"
      - "tests/test_verify_k3s_cnpg_incident_lab.py"
      - "tests/test_live_lab_config.py"
      - "fixtures/lab/**"
      - "Makefile"
      - "go.work"

env:
  GO_VERSION: '1.25'
  PYTHON_VERSION: '3.13'

jobs:
  # ===========================================================================
  # Build and Verify Job (always runs)
  # ===========================================================================
  build-and-verify:
    name: Build and Verify Lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            cmd/k9b-cnpg-incident-lab/go.sum
            internal/lab/cnpg/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install pytest

      # Sync Go workspace
      - name: Sync Go workspace
        run: go work sync

      # Build the lab runner
      - name: Build lab runner
        run: |
          mkdir -p dist
          go build -v -o dist/k9b-cnpg-incident-lab ./cmd/k9b-cnpg-incident-lab

      # Run Go unit tests for lab package
      - name: Run Go unit tests
        run: |
          echo "=== Running Go unit tests for internal/lab/cnpg ==="
          go test -v ./internal/lab/cnpg/...

      # Run Python verifier tests
      - name: Run Python verifier tests
        run: |
          echo "=== Running Python verifier tests ==="
          .venv/bin/python -m pytest tests/test_verify_k3s_cnpg_incident_lab.py tests/test_live_lab_config.py -v

      # Verify passing fixture
      - name: Verify passing fixture
        run: |
          echo "=== Verifying passing fixture ==="
          .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py --artifact-dir fixtures/lab/pass

      # Verify fail-no-incident fixture fails
      - name: Verify fail-no-incident fixture fails as expected
        run: |
          echo "=== Verifying fail-no-incident fixture (should fail) ==="
          set +e
          .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py --artifact-dir fixtures/lab/fail-no-incident > /tmp/fail-no-incident.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: fail-no-incident fixture unexpectedly passed"
            cat /tmp/fail-no-incident.log
            exit 1
          fi
          echo "fail-no-incident correctly failed with exit code $rc"
          grep -E "k9b-incidents.json|k9b incident evidence" /tmp/fail-no-incident.log

      # Verify fail-secret fixture fails
      - name: Verify fail-secret fixture fails as expected
        run: |
          echo "=== Verifying fail-secret fixture (should fail) ==="
          set +e
          .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py --artifact-dir fixtures/lab/fail-secret > /tmp/fail-secret.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: fail-secret fixture unexpectedly passed"
            cat /tmp/fail-secret.log
            exit 1
          fi
          echo "fail-secret correctly failed with exit code $rc"
          grep -Ei "secret|password|api" /tmp/fail-secret.log

      # Upload build artifacts
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k9b-cnpg-incident-lab-ci-${{ github.run_id }}
          path: |
            dist/k9b-cnpg-incident-lab
            /tmp/fail-no-incident.log
            /tmp/fail-secret.log
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days || '7' }}

      - name: Summary
        run: |
          echo "=== K3s CNPG Incident Lab CI Summary ==="
          echo "Lab runner built: dist/k9b-cnpg-incident-lab"
          echo "Go tests: PASSED"
          echo "Python verifier tests: PASSED"
          echo "Passing fixture: PASSED"
          echo "Fail fixtures: Correctly rejected"
          if [[ "${{ inputs.run_live_lab }}" == "true" ]]; then
            echo "Live K3s lab will run in 'live-k3s-lab' job."
          else
            echo "NOTE: Live K3s not requested. Use workflow_dispatch with run_live_lab=true."
          fi

  # ===========================================================================
  # Live K3s Lab Job (only runs when manually requested)
  # ===========================================================================
  live-k3s-lab:
    name: Live K3s CNPG Lab
    needs: build-and-verify
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_lab == true
    uses: ./.github/workflows/k9b-cnpg-incident-lab-live.yml
    with:
      k3s_version: 'v1.31.0+k3s1'
      cnpg_version: '1.26.0'
      incident_scenario: ${{ inputs.incident_scenario || 'pod-failure' }}
      artifact_retention_days: ${{ inputs.artifact_retention_days || '7' }}
