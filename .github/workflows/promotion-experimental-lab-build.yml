# ACT-K9B-HULK-PROMOTION-EXPERIMENTAL-LAB-BUILD-LANE01-CORRECTION01
# Experimental lab build lane (executable)
#
# This is an ISOLATED lane that does NOT depend on the failing full
# Factory verification.  It produces immutable backend / scheduler /
# frontend images under an explicitly experimental namespace so the
# team can exercise the promotion runtime immediately.
#
# Hard boundaries (structurally enforced):
#   - Canonical verify.yml is NOT modified.
#   - No pytest skip, xfail, or conditional skip is introduced.
#   - No continue-on-error is added to canonical CI.
#   - Branch-protection requirements are unchanged.
#   - The Harbor build is invoked at JOB LEVEL (jobs.build.uses),
#     not from a step.
#   - The Harbor workflow's image-reference outputs are the canonical
#     source of truth; no second registry lookup is performed.
#   - The classify job constructs its record from declared outputs;
#     it does not read /tmp from a previous runner.
#
# The produced image is classified IMAGE_CLASS=experimental-lab and is
# NOT publication-qualified.

# CI-HERMETIC-TOOLCACHE:
# k9b CI is intentionally shell-first/toolcache-first.  Avoid setup/download
# actions where a pinned runner tool-cache path or checked-in script can be used.
# Missing cached tools must fail fast, not download mutable replacements.
# See docs/ci-hermetic-toolchain.md.

name: k9b promotion experimental lab build

on:
  push:
    branches:
      - hotfix/incident-promotion-runtime-truth01
    tags:
      - "qualification/lab/*"
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        default: lab
        options: [lab, staging, production]

concurrency:
  group: k9b-experimental-lab-build-${{ inputs.environment || 'lab' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_CLASS: experimental-lab

jobs:
  runtime-gate:
    name: promotion runtime gate at SUBJECT_SHA
    runs-on: ubuntu-latest
    outputs:
      subject_sha: ${{ steps.identity.outputs.subject_sha }}
      runtime_gate: ${{ steps.gate.outputs.runtime_gate }}
    steps:
      - name: checkout at SUBJECT_SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: lock SUBJECT_SHA
        id: identity
        run: |
          set -euo pipefail
          subject_sha="$(git rev-parse HEAD)"
          if [ "$subject_sha" != "${{ github.sha }}" ]; then
            echo "FATAL: checked-out HEAD != github.sha"
            exit 1
          fi
          echo "subject_sha=$subject_sha" >> "$GITHUB_OUTPUT"

      - name: canonical Python bootstrap
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel setuptools
          .venv/bin/python -m pip install -e .
          .venv/bin/python --version
          .venv/bin/python -m pytest --version

      - name: focused promotion runtime gate
        id: gate
        run: |
          set -euo pipefail
          # Promotion-runtime tests (real promotion path coverage).
          set -o pipefail
          TESTS=(
            "tests/unit/test_scoped_recording_authority_first_replay.py"
            "tests/unit/test_scoped_recording_authority_interleaved_corrupt.py"
            "tests/unit/test_scoped_selection_identity.py"
            "tests/unit/test_scoped_selection_record_fabrication_guard.py"
            "tests/unit/test_promotion_dispatch_outcome01_classifier.py"
            "tests/unit/test_promotion_diagnosis_handoff.py"
            "tests/unit/test_promotion_diagnosis_handoff_regression.py"
            "tests/unit/test_promotion_http_wire_semantics.py"
            "tests/unit/test_promotion_http_wire_semantics_reconciliation.py"
            "tests/unit/test_promotion_http_wire_binding.py"
            "tests/unit/test_promotion_http_wire_binding_invariants.py"
            "tests/unit/test_promotion_http_wire_structure.py"
            "tests/unit/test_promotion_http_observation.py"
            "tests/unit/test_promotion_http_loopback.py"
            "tests/unit/test_promotion_http_mapping.py"
            "tests/unit/test_promotion_http_context.py"
            "tests/unit/test_promotion_http_transport_matrix.py"
            "tests/unit/test_promotion_artifact_reading.py"
            "tests/unit/test_promotion_outcomes.py"
            "tests/unit/test_promotion_http_test_server_support.py"
            "tests/unit/test_run_summary_derivation.py"
            "tests/unit/test_run_identity_reconciliation.py"
            "tests/unit/test_round10_run_identity_matrix.py"
            "tests/unit/test_make_targeted_digest_manifest.py"
            "tests/unit/test_make_targeted_digest.py"
            "tests/unit/test_make_targeted_digest_self_reference.py"
            "tests/unit/test_targeted_digest_manifest.py"
            "tests/unit/test_diagnosis_loop_trajectory.py"
            "tests/unit/test_commit_unknown_selection_handoff01_witness.py"
            "tests/unit/test_act_k9b_hulk_commit_unknown_selection_handoff01.py"
            "tests/unit/test_act_k9b_hulk_current_run_promotion_dispatch_outcome01_wrapper.py"
            "tests/unit/test_act_k9b_hulk_promotion_succeeded_record_validation.py"
            "tests/unit/test_act_k9b_hulk_current_run_promotion_seam01_verifier.py"
            "tests/unit/test_scoped_accumulator_atomic_recording.py"
            "tests/unit/test_scoped_accumulator_rollback.py"
            "tests/unit/test_scoped_handoff_completed_invariants.py"
            "tests/unit/test_scoped_handoff_identity_shape.py"
            "tests/unit/test_scoped_handoff_ownership_fixtures.py"
            "tests/unit/test_scoped_handoff_rejected_invariants.py"
            "tests/unit/test_scoped_handoff_uncertain_invariants.py"
            "tests/unit/test_scoped_selection_commit_unknown.py"
            "tests/unit/test_scoped_selection_completed.py"
            "tests/unit/test_scoped_selection_dispatch_integration.py"
            "tests/unit/test_scoped_selection_explicit_no_promotion.py"
            "tests/unit/test_scoped_selection_no_global_fallback.py"
            "tests/unit/test_scoped_selection_rejected.py"
          )
          # Verify each test file exists; missing files fail the gate
          # BEFORE pytest starts (no silent coverage gaps).
          MISSING=0
          for t in "${TESTS[@]}"; do
            if [ ! -f "$t" ]; then
              echo "FATAL: required promotion-runtime test missing: $t"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "FATAL: $MISSING required test file(s) missing"
            exit 1
          fi
          # Run the gate; pipefail ensures the pipeline return code
          # reflects the pytest exit code, not the tee return code.
          set -o pipefail
          .venv/bin/python -m pytest -q "${TESTS[@]}" 2>&1 \
            | tee runtime-gate-transcript.log
          echo "runtime_gate=pass" >> "$GITHUB_OUTPUT"

      - name: ruff on changed runtime Python (blocking)
        run: |
          set -euo pipefail
          BASE_SHA="f09348dc6f7dd8887c51278ee0a504c7e22d1417"
          SUBJECT_SHA="${{ steps.identity.outputs.subject_sha }}"
          mapfile -t CHANGED < <(git diff --name-only -z --diff-filter=ACMRT \
            "$BASE_SHA".."$SUBJECT_SHA" -- '*.py' | tr '\0' '\n' | grep -v '^$')
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "No runtime Python changed in BASE..SUBJECT"
            exit 0
          fi
          .venv/bin/python -m ruff check "${CHANGED[@]}"

      - name: mypy on changed runtime Python (blocking)
        run: |
          set -euo pipefail
          BASE_SHA="f09348dc6f7dd8887c51278ee0a504c7e22d1417"
          SUBJECT_SHA="${{ steps.identity.outputs.subject_sha }}"
          mapfile -t CHANGED < <(git diff --name-only -z --diff-filter=ACMRT \
            "$BASE_SHA".."$SUBJECT_SHA" -- '*.py' | tr '\0' '\n' | grep -v '^$')
          if [ ${#CHANGED[@]} -eq 0 ]; then
            exit 0
          fi
          .venv/bin/python -m mypy "${CHANGED[@]}"

      - name: workflow syntax validation (this file)
        run: |
          set -euo pipefail
          .venv/bin/python -c "import yaml; yaml.safe_load(open('.github/workflows/promotion-experimental-lab-build.yml'))"

      - name: git diff --check
        run: |
          set -euo pipefail
          git diff --check

      - name: upload runtime gate transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-gate-${{ steps.identity.outputs.subject_sha }}
          path: runtime-gate-transcript.log

  # Phase 2: canonical Harbor build (delegated at JOB level)
  build:
    name: canonical harbor build (delegated)
    needs: runtime-gate
    uses: ./.github/workflows/harbor-build-image.yml
    with:
      closure_sha: ${{ github.sha }}
      environment: ${{ inputs.environment || 'lab' }}
    secrets:
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  # Phase 3: structural classification
  classify:
    name: classify image as experimental-lab (not publication-qualified)
    needs: [runtime-gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: install Python for record construction
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel setuptools

      - name: construct record.json from declared outputs (no /tmp)
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          # Validate the regex: registry/repository@sha256:64hex
          import re
          pattern = re.compile(r"^[^@]+@sha256:[0-9a-f]{64}$")
          record = {
              "image_class": "experimental-lab",
              "subject_sha": os.environ.get("SUBJECT_SHA", "${{ github.sha }}"),
              "runtime_gate": "${{ needs.runtime-gate.outputs.runtime_gate }}",
              "full_verify": "not_required_for_experimental_build",
              "ready_for_image_publication": False,
              "ready_for_production_deployment": False,
              "ready_for_live_acceptance": False,
              "full_verify_remains_authoritative": True,
              "canonical_tests_skipped_or_weakened": False,
              "backend_image_ref": "${{ needs.build.outputs.backend_image_ref }}",
              "scheduler_image_ref": "${{ needs.build.outputs.scheduler_image_ref }}",
              "frontend_image_ref": "${{ needs.build.outputs.frontend_image_ref }}",
          }
          for img in ("backend", "scheduler", "frontend"):
              ref = record[f"{img}_image_ref"]
              if not pattern.match(ref):
                  raise SystemExit(f"FATAL: malformed {img}_image_ref: {ref}")
          Path("/tmp/k9b_experimental_record.json").write_text(
              json.dumps(record, indent=2)
          )
          print(json.dumps(record, indent=2))
          PY
        env:
          SUBJECT_SHA: ${{ github.sha }}

      - name: upload experimental-lab record
        uses: actions/upload-artifact@v4
        with:
          name: experimental-lab-record-${{ github.sha }}
          path: /tmp/k9b_experimental_record.json

      - name: emit classification summary
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("/tmp/k9b_experimental_record.json").read_text())
          print("=" * 60)
          print("EXPERIMENTAL-LAB BUILD CLASSIFICATION")
          print("=" * 60)
          for k in (
              "image_class", "subject_sha", "runtime_gate", "full_verify",
              "ready_for_image_publication", "ready_for_production_deployment",
              "ready_for_live_acceptance",
              "full_verify_remains_authoritative",
              "canonical_tests_skipped_or_weakened",
          ):
              print(f"  {k} = {record.get(k)}")
          for img in ("backend", "scheduler", "frontend"):
              print(f"  {img}_image_ref = {record.get(f'{img}_image_ref')}")
          print("=" * 60)
          print("READY_FOR_IMAGE_PUBLICATION = false")
          print("READY_FOR_PRODUCTION_DEPLOYMENT = false")
          print("READY_FOR_LIVE_ACCEPTANCE = false")
          print("FULL_VERIFY_REMAINS_AUTHORITATIVE = true")
          print("CANONICAL_TESTS_SKIPPED_OR_WEAKENED = false")
          print("=" * 60)
          PY