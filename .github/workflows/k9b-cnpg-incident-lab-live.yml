# Reusable workflow for live K3s/CNPG incident lab execution in namespace mode.
#
# This workflow:
# - Runs on an existing K3s cluster with preinstalled CNPG operator
# - Uses protected environment kubeconfig (NOT ARC runner SA credentials)
# - Creates a unique lab namespace from GITHUB_RUN_ID
# - Deploys k9b via Helm chart using image-builder outputs
# - Injects incident using tracked manifest
# - Collects artifacts and verifies them
#
# THIS WORKFLOW MUST NOT INCLUDE:
# - docker build / docker push / docker save
# - /var/run/docker.sock
# - buildctl
# - curl -sfL https://get.k3s.io
# - /etc/rancher/k3s/k3s.yaml
# - kubectl apply for CNPG operator manifests
# - CNPG CRD creation
# - Ambient in-cluster credentials (must use protected kubeconfig)

name: K3s CNPG Incident Lab - Live (Namespace Mode)

on:
  workflow_call:
    inputs:
      incident_scenario:
        description: 'Incident scenario'
        required: true
        type: string
      artifact_retention_days:
        description: 'Artifact retention days'
        required: true
        type: string
      backend_image_repository:
        description: 'Backend image repository from image-builder'
        required: true
        type: string
      backend_image_tag:
        description: 'Backend image tag from image-builder'
        required: true
        type: string
      backend_image_ref:
        description: 'Backend image reference (repository:tag)'
        required: true
        type: string
      backend_image_digest:
        description: 'Backend image digest (sha256:...)'
        required: false
        type: string
        default: ''
      frontend_image_repository:
        description: 'Frontend image repository from image-builder'
        required: false
        type: string
        default: ''
      frontend_image_tag:
        description: 'Frontend image tag from image-builder'
        required: false
        type: string
        default: ''
      frontend_image_ref:
        description: 'Frontend image reference (repository:tag)'
        required: false
        type: string
        default: ''
      enable_provider_smoke:
        description: 'Enable provider-backed diagnosis smoke test (requires provider secrets)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.13'
  # kubectl version (pinned for cache key stability)
  KUBECTL_VERSION: 'v1.31.0'
  # Lab namespace derived from run ID
  LAB_NAMESPACE: k9b-cnpg-lab-${{ github.run_id }}
  # Use ConfigMap driver to avoid Secret read permissions for Helm release metadata
  HELM_DRIVER: configmap
  # Artifact directory (set before bootstrap)
  ARTIFACT_DIR: ./lab-artifacts/live
  # Image tag for summary
  IMAGE_TAG: ${{ inputs.backend_image_tag }}

jobs:
  live-k3s-lab:
    name: Live K3s CNPG Lab
    # Run on ARC runner scale set spbnix-k8s (cluster access, no Docker)
    # Protected environment provides kubeconfig and requires approval
    runs-on: spbnix-k8s
    # Protected environment for kubeconfig secret
    environment: k9b-live-lab-admin
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # =======================================================================
      # Setup
      # =======================================================================
      - uses: actions/checkout@v4

      # =======================================================================
      # Restore kubectl tool cache
      # Uses restore/save split to save cache immediately after setup-kubectl,
      # even if the job fails later. This is more robust for live-lab workflows.
      # =======================================================================
      - name: Restore kubectl tool cache
        id: cache-kubectl
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.tool_cache }}/kubectl
          key: kubectl-${{ runner.os }}-${{ runner.arch }}-${{ env.KUBECTL_VERSION }}

      # =======================================================================
      # Setup kubectl (pinned version compatible with cluster)
      # =======================================================================
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: '${{ env.KUBECTL_VERSION }}'

      # =======================================================================
      # Save kubectl tool cache
      # Saves cache immediately after setup-kubectl (even if job fails later).
      # Only saves when there was a cache miss (cache-hit != 'true').
      # =======================================================================
      - name: Save kubectl tool cache
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.tool_cache }}/kubectl
          key: ${{ steps.cache-kubectl.outputs.cache-primary-key }}

      # =======================================================================
      # Set up Helm
      # =======================================================================
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.16.3'

      - name: Verify Helm installation
        run: helm version --short

      # =======================================================================
      # Setup Python environment (needed for preflight scripts)
      # =======================================================================
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest pyyaml

      # =======================================================================
      # Initialize artifact directory
      # =======================================================================
      - name: Initialize artifact directory
        run: |
          mkdir -p \
            ./lab-artifacts/live/logs \
            ./lab-artifacts/live/baseline \
            ./lab-artifacts/live/incident \
            ./lab-artifacts/live/recovery-or-final \
            ./lab-artifacts/live/image-preflight \
            ./lab-artifacts/live/rollout-watch \
            ./lab-artifacts/live/symptom-watch

      # =======================================================================
      # Initialize watchdog directory and trap for Helm wait cleanup
      # Creates watchdog directory and trap for cleanup on EXIT
      # =======================================================================
      - name: Initialize watchdog directory
        run: |
          # Create watchdog directory for Helm wait monitoring
          mkdir -p ./lab-artifacts/live/watchdog
          echo "Watchdog directory created: ./lab-artifacts/live/watchdog"
          
          # Set up trap for cleanup on EXIT
          # This ensures watchdog directory is cleaned up even on workflow cancellation
          cleanup_watchdog() {
            echo "Cleaning up watchdog directory..."
            rm -rf ./lab-artifacts/live/watchdog 2>/dev/null || true
          }
          trap cleanup_watchdog EXIT
          
          # Mark watchdog as active
          date > ./lab-artifacts/live/watchdog/active.txt
          echo "Watchdog trap set: cleanup_watchdog EXIT"

      # =======================================================================
      # Bootstrap protected kubeconfig and validate credential source
      # This step fails closed if wrong identity (ARC runner SA) is detected
      # =======================================================================
      - name: Bootstrap protected kubeconfig and validate credentials
        env:
          K9B_LIVE_LAB_ADMIN_KUBECONFIG_B64: ${{ secrets.K9B_LIVE_LAB_ADMIN_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          
          ARTIFACT_DIR="./lab-artifacts/live" scripts/k9b_cnpg_live_lab_bootstrap.sh \
            K9B_LIVE_LAB_ADMIN_KUBECONFIG_B64 KUBECONFIG "$LAB_NAMESPACE"
          
          # Source GITHUB_ENV to get KUBECONFIG
          source "${GITHUB_ENV}"
          
          echo "KUBECONFIG bootstrapped: ${KUBECONFIG}"
          echo "Bootstrap complete, credential source validated"

      # =======================================================================
      # Source KUBECONFIG from bootstrap step
      # =======================================================================
      - name: Verify kubectl with protected kubeconfig
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" version --client
          kubectl --kubeconfig="${KUBECONFIG}" cluster-info
          echo "kubectl verified with protected kubeconfig"

      # =======================================================================
      # Preflight: Verify existing cluster access
      # =======================================================================
      - name: Verify cluster access
        run: |
          source "${GITHUB_ENV}"
          echo "=== Verifying cluster access ==="
          kubectl --kubeconfig="${KUBECONFIG}" version --client
          kubectl --kubeconfig="${KUBECONFIG}" auth can-i get pods --all-namespaces
          kubectl --kubeconfig="${KUBECONFIG}" get nodes -o wide
          echo "Cluster access verified"

      # =======================================================================
      # Preflight: Verify existing CNPG operator (FATAL)
      # =======================================================================
      - name: Verify CNPG operator preflight
        run: |
          source "${GITHUB_ENV}"
          echo "=== Verifying existing CNPG operator ==="
          
          echo "Checking CNPG CRD..."
          if ! kubectl --kubeconfig="${KUBECONFIG}" get crd clusters.postgresql.cnpg.io > /dev/null 2>&1; then
            echo "ERROR: CNPG CRD not found. Existing CNPG operator/CRD not found; namespace-mode lab requires preinstalled CNPG."
            exit 1
          fi
          echo "CNPG CRD found"

          echo "Checking CNPG operator pods..."
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n cnpg-system -o wide

          echo "Checking for running CNPG operator pod..."
          READY_CNPG_PODS="$(kubectl --kubeconfig="${KUBECONFIG}" get pods -n cnpg-system \
            -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\n"}{end}' \
            | grep -iE 'cloudnative-pg|cnpg' || true)"

          if [ -z "$READY_CNPG_PODS" ]; then
            echo "ERROR: no running CNPG operator pod found in cnpg-system"
            kubectl --kubeconfig="${KUBECONFIG}" get pods -n cnpg-system -o wide || true
            exit 1
          fi
          echo "Running CNPG operator pods: $READY_CNPG_PODS"

          echo "Checking CNPG operator deployment..."
          if kubectl --kubeconfig="${KUBECONFIG}" get deployment -n cnpg-system -o name 2>/dev/null | grep -qE "(cloudnative-pg|cnpg)"; then
            echo "CNPG operator deployment found"
            kubectl --kubeconfig="${KUBECONFIG}" get deployment -n cnpg-system
          else
            echo "WARNING: CNPG operator deployment not found with standard names"
            kubectl --kubeconfig="${KUBECONFIG}" get deployments -n cnpg-system 2>/dev/null || echo "No deployments in cnpg-system"
          fi

          echo "CNPG operator preflight PASSED"

      - name: Save CNPG operator preflight
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" get crd clusters.postgresql.cnpg.io > ./lab-artifacts/live/logs/cnpg-operator-preflight.txt 2>&1
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n cnpg-system >> ./lab-artifacts/live/logs/cnpg-operator-preflight.txt 2>&1
          kubectl --kubeconfig="${KUBECONFIG}" get deployments -n cnpg-system >> ./lab-artifacts/live/logs/cnpg-operator-preflight.txt 2>&1

      # =======================================================================
      # Create unique lab namespace
      # =======================================================================
      - name: Create lab namespace
        run: |
          source "${GITHUB_ENV}"
          echo "=== Creating lab namespace: $LAB_NAMESPACE ==="
          kubectl --kubeconfig="${KUBECONFIG}" create namespace "$LAB_NAMESPACE" --dry-run=client -o yaml | kubectl --kubeconfig="${KUBECONFIG}" apply -f -
          kubectl --kubeconfig="${KUBECONFIG}" label namespace "$LAB_NAMESPACE" \
            lab.k9b.io/name=k3s-cnpg-incident \
            lab.k9b.io/run-id="${{ github.run_id }}" \
            lab.k9b.io/managed=true \
            --overwrite
          echo "Lab namespace created and labeled"
          kubectl --kubeconfig="${KUBECONFIG}" get namespace "$LAB_NAMESPACE"

      # =======================================================================
      # RBAC preflight for namespace (warns but doesn't block)
      # =======================================================================
      - name: Check namespace-scoped Kubernetes permissions
        run: |
          source "${GITHUB_ENV}"
          echo "=== Checking namespace-scoped Kubernetes permissions ==="
          scripts/k9b_cnpg_live_lab_rbac_preflight.sh namespace "$LAB_NAMESPACE" || {
            echo "WARNING: Some namespace permissions are missing but continuing..."
            echo "This may cause Helm deployment to fail"
          }

      # =======================================================================
      # Image preflight: Resolved image refs (write artifact before checks)
      # =======================================================================
      - name: Write resolved image refs artifact
        run: |
          source "${GITHUB_ENV}"
          echo "=== Writing resolved image refs ==="
          
          # Compute exact image refs as Helm will render them
          BACKEND_IMAGE_REF="${{ inputs.backend_image_repository }}:${{ inputs.backend_image_tag }}"
          # Derive frontend image from workflow inputs (repository:tag) or full ref
          if [ -n "${{ inputs.frontend_image_ref }}" ]; then
            FRONTEND_IMAGE_REF="${{ inputs.frontend_image_ref }}"
          elif [ -n "${{ inputs.frontend_image_repository }}" ] && [ -n "${{ inputs.frontend_image_tag }}" ]; then
            FRONTEND_IMAGE_REF="${{ inputs.frontend_image_repository }}:${{ inputs.frontend_image_tag }}"
          else
            FRONTEND_IMAGE_REF=""
          fi
          
          echo "Backend image ref: ${BACKEND_IMAGE_REF}"
          echo "Frontend image ref: ${FRONTEND_IMAGE_REF}"
          
          # Write resolved images artifact
          mkdir -p ./lab-artifacts/live/image-preflight
          .venv/bin/python scripts/k9b_cnpg_image_preflight.py \
            resolved-images \
            --backend-image "${BACKEND_IMAGE_REF}" \
            --frontend-image "${FRONTEND_IMAGE_REF}" \
            --artifact-dir ./lab-artifacts/live
          
          echo "IMAGE_PREFLIGHT_BACKEND=${BACKEND_IMAGE_REF}" >> $GITHUB_ENV
          echo "IMAGE_PREFLIGHT_FRONTEND=${FRONTEND_IMAGE_REF}" >> $GITHUB_ENV
          echo "Resolved image refs written to lab-artifacts/live/image-preflight/resolved-images.json"

      # =======================================================================
      # Image preflight: Render Helm manifests and validate images (HARD GATE)
      # This step catches the mismatch where preflight checks one image but Helm deploys another.
      # Must run BEFORE registry preflight to fail fast.
      # =======================================================================
      - name: Render Helm and validate images against preflight refs
        id: render-preflight
        run: |
          set -euo pipefail
          source "${GITHUB_ENV}"
          echo "=== Render Helm manifests and validate images ==="
          
          # Use image refs from environment (set by resolved-images step)
          BACKEND_IMAGE_REF="${IMAGE_PREFLIGHT_BACKEND}"
          FRONTEND_IMAGE_REF="${IMAGE_PREFLIGHT_FRONTEND}"
          
          echo "Expected backend: ${BACKEND_IMAGE_REF}"
          echo "Expected frontend: ${FRONTEND_IMAGE_REF}"
          
          # Build frontend image set args if frontend image is provided
          FRONTEND_SET_ARGS=()
          if [ -n "${FRONTEND_IMAGE_REF}" ]; then
            # Parse frontend image into repository and tag
            FRONTEND_REPO="${FRONTEND_IMAGE_REF%:*}"
            FRONTEND_TAG="${FRONTEND_IMAGE_REF##*:}"
            FRONTEND_SET_ARGS+=("--set" "image.frontend.repository=${FRONTEND_REPO}")
            FRONTEND_SET_ARGS+=("--set" "image.frontend.tag=${FRONTEND_TAG}")
            echo "Frontend Helm overrides: repository=${FRONTEND_REPO}, tag=${FRONTEND_TAG}"
          fi
          
          # Build backend image set args
          BACKEND_REPO="${BACKEND_IMAGE_REF%:*}"
          BACKEND_TAG="${BACKEND_IMAGE_REF##*:}"
          BACKEND_SET_ARGS=(
            "--set" "image.backend.repository=${BACKEND_REPO}"
            "--set" "image.backend.tag=${BACKEND_TAG}"
            "--set" "image.backend.pullPolicy=IfNotPresent"
          )
          echo "Backend Helm overrides: repository=${BACKEND_REPO}, tag=${BACKEND_TAG}"
          
          # Run render preflight with all --set overrides
          # This renders the exact same manifests that will be deployed
          set +e
          .venv/bin/python scripts/k9b_cnpg_image_preflight.py \
            render-preflight \
            --chart ./charts/k9b \
            --release k9b \
            --namespace "$LAB_NAMESPACE" \
            --values ./charts/k9b/values-live-lab.yaml \
            "${BACKEND_SET_ARGS[@]}" \
            "${FRONTEND_SET_ARGS[@]}" \
            --set backend.auth.enabled=false \
            --set kubernetes.auth.mode=inCluster \
            --set serviceAccount.automountServiceAccountToken=true \
            --expected-backend "${BACKEND_IMAGE_REF}" \
            --expected-frontend "${FRONTEND_IMAGE_REF}" \
            --artifact-dir ./lab-artifacts/live
          RENDER_RC=$?
          set -e
          
          if [ ${RENDER_RC} -ne 0 ]; then
            echo ""
            echo "FAILURE: Render preflight failed (image ref mismatch detected)"
            echo ""
            echo "This means the Helm chart will deploy a different image than what was preflighted."
            echo "NOT_PROCEEDING_WITH_HELM=true"
            echo ""
            
            # Show detailed comparison if available
            if [ -f ./lab-artifacts/live/image-preflight/image-preflight-compare.json ]; then
              echo "Render preflight results:"
              .venv/bin/python scripts/pretty_print_json.py --file ./lab-artifacts/live/image-preflight/image-preflight-compare.json
            fi
            
            echo ""
            echo "Rendered images (from manifests):"
            if [ -f ./lab-artifacts/live/image-preflight/rendered-images.json ]; then
              .venv/bin/python scripts/extract_rendered_images_summary.py --file ./lab-artifacts/live/image-preflight/rendered-images.json
            fi
            
            exit 1
          fi
          
          echo "Render preflight PASSED: rendered images match expected"

      # =======================================================================
      # Preflight: Install Harbor CA certificate into runner trust store
      # This enables curl-based registry manifest checks to verify Harbor TLS
      # =======================================================================
      - name: Install Harbor CA certificate into runner trust
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
        run: |
          set -euo pipefail
          
          echo "=== Installing Harbor CA certificate into runner trust ==="
          
          if [[ -z "${SPBNIX_CA_CERT_PEM:-}" ]]; then
            echo "WARNING: SPBNIX_CA_CERT_PEM secret not set; registry preflight may fail with TLS errors"
            echo "HARBOR_CA_CERT_PATH=" >> $GITHUB_ENV
            exit 0
          fi
          
          # Write CA certificate to runner temp (never in repo)
          HARBOR_CA_CERT_DIR="${RUNNER_TEMP}/spbnix-ca"
          mkdir -p "$HARBOR_CA_CERT_DIR"
          echo "${SPBNIX_CA_CERT_PEM}" > "${HARBOR_CA_CERT_DIR}/harbor-ca.crt"
          chmod 0600 "${HARBOR_CA_CERT_DIR}/harbor-ca.crt"
          
          # Validate PEM content
          if ! openssl x509 -in "${HARBOR_CA_CERT_DIR}/harbor-ca.crt" -noout 2>/dev/null; then
            echo "ERROR: Invalid CA certificate PEM in SPBNIX_CA_CERT_PEM"
            exit 1
          fi
          
          # Install into system trust store (Debian/Ubuntu) if update-ca-certificates and sudo are available
          if command -v update-ca-certificates >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1; then
            echo "Installing CA into system trust store..."
            sudo install -m 0644 "${HARBOR_CA_CERT_DIR}/harbor-ca.crt" /usr/local/share/ca-certificates/harbor-pve1-spbnix-local.crt
            sudo update-ca-certificates
            echo "HARBOR_CA_CERT_PATH=" >> $GITHUB_ENV
            echo "CA certificate installed into system trust store"
          else
            echo "Using CA certificate from runner temp for curl --cacert"
            echo "HARBOR_CA_CERT_PATH=${HARBOR_CA_CERT_DIR}/harbor-ca.crt" >> $GITHUB_ENV
          fi
          
          # Also export for subshells
          export CURL_CA_BUNDLE="${HARBOR_CA_CERT_DIR}/harbor-ca.crt"
          export SSL_CERT_FILE="${HARBOR_CA_CERT_DIR}/harbor-ca.crt"
          echo "CURL_CA_BUNDLE=${CURL_CA_BUNDLE}" >> $GITHUB_ENV
          echo "SSL_CERT_FILE=${SSL_CERT_FILE}" >> $GITHUB_ENV
          
          echo "Harbor CA certificate installed"

      # =======================================================================
      # Image preflight: Registry manifest availability check (FAILS before Helm)
      # =======================================================================
      - name: Check registry manifest availability
        id: registry-preflight
        run: |
          set -euo pipefail
          source "${GITHUB_ENV}"
          echo "=== Checking registry manifest availability ==="
          
          # Use image refs from environment (set by resolved-images step)
          BACKEND_IMAGE_REF="${IMAGE_PREFLIGHT_BACKEND}"
          FRONTEND_IMAGE_REF="${IMAGE_PREFLIGHT_FRONTEND}"
          
          echo "Checking backend: ${BACKEND_IMAGE_REF}"
          echo "Checking frontend: ${FRONTEND_IMAGE_REF}"
          
          # Build registry preflight command with bash array (no eval)
          # shellcheck disable=SC2124
          PREFLIGHT_CMD=(
            .venv/bin/python scripts/k9b_cnpg_image_preflight.py
            registry-preflight
            --backend-image "${BACKEND_IMAGE_REF}"
            --frontend-image "${FRONTEND_IMAGE_REF}"
            --artifact-dir ./lab-artifacts/live
          )
          
          # Add CA cert path if available (for TLS verification)
          if [[ -n "${HARBOR_CA_CERT_PATH:-}" ]]; then
            PREFLIGHT_CMD+=(--ca-cert "${HARBOR_CA_CERT_PATH}")
            echo "Using CA certificate: ${HARBOR_CA_CERT_PATH}"
          else
            echo "NOTE: No CA certificate path set; using system trust store if available"
          fi
          
          # Run registry manifest preflight
          # Registry credentials are optional - the check will classify unauthorized if needed
          # AUTH_UNVERIFIED is non-blocking - node-side pullability is authoritative
          # Use set +e to capture exit code without exiting step immediately
          set +e
          "${PREFLIGHT_CMD[@]}"
          REGISTRY_RC=$?
          set -e
          
          # Check if ALL failures are runner_registry_auth_unverified (only safe to skip)
          # If ANY fatal failure exists (manifest_missing, tls_error, network_error), fail
          if [ "${REGISTRY_RC}" -ne 0 ]; then
            if [ -f ./lab-artifacts/live/image-preflight/registry-preflight.json ]; then
              .venv/bin/python scripts/check_all_auth_unverified.py ./lab-artifacts/live/image-preflight/registry-preflight.json > ./lab-artifacts/live/image-preflight/all_unverified.tmp 2>/dev/null
              ALL_UNVERIFIED=$(cat ./lab-artifacts/live/image-preflight/all_unverified.tmp)
            else
              ALL_UNVERIFIED="false"
            fi
            
            if [ "${ALL_UNVERIFIED}" != "true" ]; then
              echo ""
              echo "FAILURE: Registry manifest check failed (non-auth error)"
              echo ""
              
              # Extract failure class from result
              if [ -f ./lab-artifacts/live/image-preflight/registry-preflight.json ]; then
                echo "Registry preflight results:"
                .venv/bin/python scripts/pretty_print_json.py --file ./lab-artifacts/live/image-preflight/registry-preflight.json
              fi
              
              echo ""
              echo "Not proceeding with Helm deploy due to image availability failure."
              echo "Fix the image issue and re-run, or verify the image exists in the registry."
              exit 1
            fi
            
            echo "NOTE: Registry auth unverifiable (no credentials); continuing to node-side pullability"
          fi
          
          echo "Registry manifest check PASSED"

      # =======================================================================
      # Image preflight: ImagePullSecret verification (informational)
      # =======================================================================
      - name: Check imagePullSecrets status
        run: |
          source "${GITHUB_ENV}"
          echo "=== Checking imagePullSecrets status ==="
          
          .venv/bin/python scripts/k9b_cnpg_image_preflight.py \
            check-image-pull-secrets \
            --kubeconfig "${KUBECONFIG}" \
            --namespace "$LAB_NAMESPACE" \
            --artifact-dir ./lab-artifacts/live
          
          echo "ImagePullSecret status written to lab-artifacts/live/image-preflight/image-pull-secret.json"

      # =======================================================================
      # Image preflight: Node-side pullability preflight (FAILS before Helm)
      # =======================================================================
      - name: Check node-side image pullability
        id: node-pull-preflight
        run: |
          source "${GITHUB_ENV}"
          echo "=== Checking node-side image pullability ==="
          
          # Use image refs from environment (set by resolved-images step)
          BACKEND_IMAGE_REF="${IMAGE_PREFLIGHT_BACKEND}"
          FRONTEND_IMAGE_REF="${IMAGE_PREFLIGHT_FRONTEND}"
          
          echo "Testing backend image: ${BACKEND_IMAGE_REF}"
          echo "Testing frontend image: ${FRONTEND_IMAGE_REF}"
          
          # Run node pull preflight using diagnostic pods
          # Use set +e to capture exit code without exiting step immediately
          set +e
          .venv/bin/python scripts/k9b_cnpg_image_preflight.py \
            node-pull-preflight \
            --kubeconfig "${KUBECONFIG}" \
            --namespace "$LAB_NAMESPACE" \
            --backend-image "${BACKEND_IMAGE_REF}" \
            --frontend-image "${FRONTEND_IMAGE_REF}" \
            --artifact-dir ./lab-artifacts/live
          NODE_PULL_RC=$?
          set -e
          
          # Read the result to determine failure class
          if [ ${NODE_PULL_RC} -ne 0 ]; then
            echo ""
            echo "FAILURE: Node-side image pullability check failed"
            echo ""
            
            # Extract and display exact failure class (inside failure branch)
            .venv/bin/python scripts/extract_failure_class.py ./lab-artifacts/live/image-preflight/node-pull-preflight.json --default "node_image_pull_unknown" > ./lab-artifacts/live/image-preflight/exact_failure.tmp 2>/dev/null || echo "node_image_pull_unknown" > ./lab-artifacts/live/image-preflight/exact_failure.tmp
            EXACT_FAILURE=$(cat ./lab-artifacts/live/image-preflight/exact_failure.tmp)
            
            echo "Node pull preflight results:"
            .venv/bin/python scripts/pretty_print_json.py --file ./lab-artifacts/live/image-preflight/node-pull-preflight.json
            
            echo ""
            echo "FAILURE_CLASS: ${EXACT_FAILURE}"
            echo "Not proceeding with Helm deploy due to node-side image pull failure."
            echo "This typically indicates:"
            echo "  - Image exists in registry but nodes cannot pull it (network/auth)"
            echo "  - imagePullSecrets are missing or incorrect"
            echo "  - Node cannot reach registry (DNS/TLS/network)"
            echo ""
            echo "Artifacts:"
            echo "  - lab-artifacts/live/image-preflight/node-pull-backend.json"
            echo "  - lab-artifacts/live/image-preflight/node-pull-frontend.json"
            echo "  - lab-artifacts/live/image-preflight/node-pull-preflight.json"
            exit 1
          fi
          
          echo "Node-side image pullability check PASSED"

          # Extract and display exact failure class for diagnostics (on success path)
          if [ -f ./lab-artifacts/live/image-preflight/node-pull-preflight.json ]; then
            .venv/bin/python scripts/extract_failure_class.py ./lab-artifacts/live/image-preflight/node-pull-preflight.json --default "unknown" > ./lab-artifacts/live/image-preflight/first_failure.tmp 2>/dev/null || echo "unknown" > ./lab-artifacts/live/image-preflight/first_failure.tmp
            FIRST_FAILURE=$(cat ./lab-artifacts/live/image-preflight/first_failure.tmp)
            echo "NODE_PREF_FAILURE_CLASS=${FIRST_FAILURE}" >> $GITHUB_OUTPUT
          fi

      # =======================================================================
      # Step 1: Pre-Helm render (capture manifests for schema validation)
      # =======================================================================
      - name: Render Helm manifests (pre-flight schema check)
        id: helm-template
        run: |
          source "${GITHUB_ENV}"
          echo "=== Rendering Helm manifests ==="
          
          # Use already-resolved env vars for image refs
          BACKEND_REPO="${IMAGE_PREFLIGHT_BACKEND%:*}"
          BACKEND_TAG="${IMAGE_PREFLIGHT_BACKEND##*:}"
          echo "Backend: ${BACKEND_REPO}:${BACKEND_TAG}"
          
          # Build frontend image set args if frontend image is provided
          FRONTEND_SET_ARGS=()
          if [[ -n "${IMAGE_PREFLIGHT_FRONTEND:-}" ]]; then
            FRONTEND_REPO="${IMAGE_PREFLIGHT_FRONTEND%:*}"
            FRONTEND_TAG="${IMAGE_PREFLIGHT_FRONTEND##*:}"
            FRONTEND_SET_ARGS+=(--set "image.frontend.repository=${FRONTEND_REPO}")
            FRONTEND_SET_ARGS+=(--set "image.frontend.tag=${FRONTEND_TAG}")
            echo "Frontend: ${FRONTEND_REPO}:${FRONTEND_TAG}"
          else
            echo "Frontend: (using chart defaults)"
          fi
          
          # Render manifests to file for schema validation using array
          set +e
          HELM_TEMPLATE_CMD=(
            helm template k9b ./charts/k9b
            --namespace "${LAB_NAMESPACE}"
            --values ./charts/k9b/values-live-lab.yaml
            --set "image.backend.repository=${BACKEND_REPO}"
            --set "image.backend.tag=${BACKEND_TAG}"
            --set image.backend.pullPolicy=IfNotPresent
            --set backend.auth.enabled=false
            --set kubernetes.auth.mode=inCluster
            --set serviceAccount.automountServiceAccountToken=true
            "${FRONTEND_SET_ARGS[@]}"
          )
          "${HELM_TEMPLATE_CMD[@]}" > ./lab-artifacts/live/logs/helm-rendered.yaml \
            2> ./lab-artifacts/live/logs/helm-template.log
          TEMPLATE_RC=$?
          set -e
          
          if [ ${TEMPLATE_RC} -ne 0 ]; then
            echo "Helm template failed with exit code ${TEMPLATE_RC}"
            echo "Classifying as manifest schema error..."
            # Pass both stderr log (warnings) and stdout (manifests) to classifier
            cat ./lab-artifacts/live/logs/helm-template.log ./lab-artifacts/live/logs/helm-rendered.yaml > ./lab-artifacts/live/logs/helm-combined.txt
            .venv/bin/python scripts/k9b_cnpg_live_lab_bootstrap.py \
              classify-schema --input ./lab-artifacts/live/logs/helm-combined.txt
            echo "Helm template validation FAILED"
            exit 1
          fi
          
          echo "Helm template succeeded - manifests rendered to helm-rendered.yaml"
          echo "Checking for schema warnings in rendered output..."
          
          # Check for unknown field patterns in rendered YAML and stderr log
          if grep -qi "unknown field" ./lab-artifacts/live/logs/helm-rendered.yaml 2>/dev/null || \
             grep -qi "unknown field" ./lab-artifacts/live/logs/helm-template.log 2>/dev/null; then
            echo "WARNING: 'unknown field' pattern detected in rendered manifests"
            # Pass both stderr log (warnings) and stdout (manifests) to classifier
            cat ./lab-artifacts/live/logs/helm-template.log ./lab-artifacts/live/logs/helm-rendered.yaml > ./lab-artifacts/live/logs/helm-combined.txt
            .venv/bin/python scripts/k9b_cnpg_live_lab_bootstrap.py \
              classify-schema --input ./lab-artifacts/live/logs/helm-combined.txt
            echo "Schema warning detected - failing before Helm install"
            exit 1
          fi
          
          echo "No schema warnings detected in rendered manifests"

      # =======================================================================
      # Step 2: Server-side dry-run validation
      # =======================================================================
      - name: Validate manifests with server-side dry-run
        id: helm-dry-run
        run: |
          source "${GITHUB_ENV}"
          echo "=== Running server-side dry-run validation ==="
          
          # Apply dry-run server-side to catch schema issues before real install
          # Wrap with set +e to capture exit code before classification runs
          set +e
          kubectl --kubeconfig="${KUBECONFIG}" apply \
            --dry-run=server \
            --namespace "$LAB_NAMESPACE" \
            -f ./lab-artifacts/live/logs/helm-rendered.yaml \
            > ./lab-artifacts/live/logs/helm-server-dry-run.log 2>&1
          DRY_RUN_RC=$?
          set -e
          
          # kubectl apply --dry-run=server may exit 0 with warnings in output
          # Use precise schema patterns instead of generic "error" grep
          # Schema patterns: unknown field, strict decoding error, ValidationError,
          # error validating data, field not declared in schema
          if grep -qiE "unknown field|strict decoding error|validationerror|error validating data|field not declared in schema" \
            ./lab-artifacts/live/logs/helm-server-dry-run.log 2>/dev/null; then
            echo "Server-side dry-run has schema warnings"
            echo ""
            echo "Extracting schema evidence..."
            # Extract bounded evidence with field paths and line numbers
            .venv/bin/python scripts/k9b_cnpg_live_lab_bootstrap.py \
              extract-schema-evidence \
              --input ./lab-artifacts/live/logs/helm-server-dry-run.log \
              --rendered ./lab-artifacts/live/logs/helm-rendered.yaml \
              --output ./lab-artifacts/live/logs/schema-warnings.json
            echo ""
            echo "Schema evidence extracted to logs/schema-warnings.json"
            echo ""
            echo "Classifying schema error and updating diagnosis..."
            # Also classify to update lab-preflight.json and lab-diagnosis.md
            .venv/bin/python scripts/k9b_cnpg_live_lab_bootstrap.py \
              classify-schema \
              --input ./lab-artifacts/live/logs/helm-server-dry-run.log \
              --rendered ./lab-artifacts/live/logs/helm-rendered.yaml
            echo ""
            echo "Dry-run validation FAILED - not proceeding with Helm install"
            exit 1
          fi
          
          # kubectl apply --dry-run=server returns non-zero on validation failure
          if [ ${DRY_RUN_RC} -ne 0 ]; then
            echo "Server-side dry-run validation failed with exit code ${DRY_RUN_RC}"
            .venv/bin/python scripts/k9b_cnpg_live_lab_bootstrap.py \
              classify-schema \
              --input ./lab-artifacts/live/logs/helm-server-dry-run.log \
              --rendered ./lab-artifacts/live/logs/helm-rendered.yaml
            echo "Dry-run validation FAILED - not proceeding with Helm install"
            exit 1
          fi
          
          echo "Server-side dry-run validation PASSED"

      # =======================================================================
      # Create diagnosis provider secret (when provider smoke is enabled)
      # MUST run before Helm deploy so Secret exists for secretKeyRef injection.
      # =======================================================================
      - name: Create diagnosis provider secret
        if: inputs.enable_provider_smoke == true
        run: |
          source "${GITHUB_ENV}"
          echo "=== Creating diagnosis provider secret ==="
          
          # Validate required secrets are present BEFORE doing anything
          echo "Validating required provider secrets..."
          if [[ -z "${{ secrets.K9B_DIAGNOSIS_BASE_URL }}" ]]; then
            echo "ERROR: K9B_DIAGNOSIS_BASE_URL secret is required when enable_provider_smoke=true"
            echo "PROVIDER_SECRET_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SECRET_CLASS=missing_base_url" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          if [[ -z "${{ secrets.K9B_DIAGNOSIS_MODEL }}" ]]; then
            echo "ERROR: K9B_DIAGNOSIS_MODEL secret is required when enable_provider_smoke=true"
            echo "PROVIDER_SECRET_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SECRET_CLASS=missing_model" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          if [[ -z "${{ secrets.K9B_DIAGNOSIS_API_KEY }}" ]]; then
            echo "ERROR: K9B_DIAGNOSIS_API_KEY secret is required when enable_provider_smoke=true"
            echo "PROVIDER_SECRET_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SECRET_CLASS=missing_api_key" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "All required provider secrets validated"
          echo "provider_config_present=true" >> $GITHUB_OUTPUT
          echo "provider_model_present=true" >> $GITHUB_OUTPUT
          echo "provider_api_key_present=true" >> $GITHUB_OUTPUT
          
          # Create Kubernetes Secret for provider API key
          kubectl --kubeconfig="${KUBECONFIG}" create secret generic k9b-diagnosis-credentials \
            --namespace "$LAB_NAMESPACE" \
            --from-literal=K9B_DIAGNOSIS_API_KEY="${{ secrets.K9B_DIAGNOSIS_API_KEY }}" \
            --from-literal=K9B_EXTERNAL_ANALYSIS_API_KEY="${{ secrets.K9B_DIAGNOSIS_API_KEY }}" \
            --dry-run=client -o yaml | kubectl --kubeconfig="${KUBECONFIG}" apply -f -
          
          echo "Provider secret created with both keys: k9b-diagnosis-credentials"
          echo "PROVIDER_SECRET_STATUS=created" >> $GITHUB_OUTPUT
          echo "PROVIDER_SECRET_CLASS=secret_created" >> $GITHUB_OUTPUT
          echo "PROVIDER_SECRET_CREATED=true" >> $GITHUB_ENV

      # =======================================================================
      # Step 3: Deploy k9b via Helm chart (with proactive rollout monitor)
      # When enable_provider_smoke=true, also injects diagnosisProvider config.
      # Provider secret must exist before this step (created above).
      # =======================================================================
      - name: Deploy k9b via Helm chart (non-blocking)
        id: helm-deploy
        run: |
          source "${GITHUB_ENV}"
          echo "=== Deploying k9b via Helm chart ==="
          echo "Provider smoke enabled: ${{ inputs.enable_provider_smoke }}"
          
          # Use already-resolved env vars for image refs
          BACKEND_REPO="${IMAGE_PREFLIGHT_BACKEND%:*}"
          BACKEND_TAG="${IMAGE_PREFLIGHT_BACKEND##*:}"
          echo "Backend: ${BACKEND_REPO}:${BACKEND_TAG}"
          
          # Build frontend image set args if frontend image is provided
          FRONTEND_SET_ARGS=()
          if [[ -n "${IMAGE_PREFLIGHT_FRONTEND:-}" ]]; then
            FRONTEND_REPO="${IMAGE_PREFLIGHT_FRONTEND%:*}"
            FRONTEND_TAG="${IMAGE_PREFLIGHT_FRONTEND##*:}"
            FRONTEND_SET_ARGS+=(--set "image.frontend.repository=${FRONTEND_REPO}")
            FRONTEND_SET_ARGS+=(--set "image.frontend.tag=${FRONTEND_TAG}")
            echo "Frontend: ${FRONTEND_REPO}:${FRONTEND_TAG}"
          else
            echo "Frontend: (using chart defaults)"
          fi
          
          # Build provider config args when enable_provider_smoke is true
          # Use --set-string for string values to ensure Helm treats them as strings
          PROVIDER_SET_ARGS=()
          if [[ "${{ inputs.enable_provider_smoke }}" == "true" ]]; then
            echo "Adding diagnosisProvider config to Helm deployment..."
            PROVIDER_SET_ARGS+=(--set-string "diagnosisProvider.enabled=true")
            PROVIDER_SET_ARGS+=(--set-string "diagnosisProvider.existingSecret=k9b-diagnosis-credentials")
            PROVIDER_SET_ARGS+=(--set-string "diagnosisProvider.apiKeyKey=K9B_DIAGNOSIS_API_KEY")
            PROVIDER_SET_ARGS+=(--set-string "diagnosisProvider.baseUrl=${{ secrets.K9B_DIAGNOSIS_BASE_URL }}")
            PROVIDER_SET_ARGS+=(--set-string "diagnosisProvider.model=${{ secrets.K9B_DIAGNOSIS_MODEL }}")
            PROVIDER_SET_ARGS+=(--set-string "diagnosisProvider.provider=openai_compatible")
            PROVIDER_SET_ARGS+=(--set "diagnosisProvider.timeoutSeconds=120")
            PROVIDER_SET_ARGS+=(--set "diagnosisProvider.maxOutputChars=8000")
            
            # Small provider: same base URL, same API key (via same secret, different key)
            echo "Adding scheduler.smallProvider config to Helm deployment..."
            PROVIDER_SET_ARGS+=(--set-string "scheduler.smallProvider.existingSecret=k9b-diagnosis-credentials")
            PROVIDER_SET_ARGS+=(--set-string "scheduler.smallProvider.apiKeyKey=K9B_EXTERNAL_ANALYSIS_API_KEY")
            # Small provider uses same base URL but can use a different model
            PROVIDER_SET_ARGS+=(--set-string "scheduler.env.K9B_EXTERNAL_ANALYSIS_BASE_URL=${{ secrets.K9B_DIAGNOSIS_BASE_URL }}")
            PROVIDER_SET_ARGS+=(--set-string "scheduler.env.K9B_EXTERNAL_ANALYSIS_MODEL=${{ secrets.K9B_DIAGNOSIS_MODEL }}")
            PROVIDER_SET_ARGS+=(--set-string "scheduler.env.K9B_REVIEW_ENRICHMENT_ENABLED=true")
          else
            echo "Provider smoke disabled - using default diagnosisProvider config"
          fi
          
          # Create rollout-watch directory for proactive monitor
          mkdir -p ./lab-artifacts/live/rollout-watch
          
          # Capture Helm output to separate files for proper stdout/stderr splitting
          HELM_LOG_STDOUT="./lab-artifacts/live/logs/helm-install-stdout.log"
          HELM_LOG_STDERR="./lab-artifacts/live/logs/helm-install-stderr.log"
          HELM_LOG="./lab-artifacts/live/logs/helm-install.log"
          
          # ===================================================================
          # Evidence collection: Rendered manifest BEFORE helm upgrade
          # ===================================================================
          echo "Collecting rendered manifest evidence before deployment..."
          .venv/bin/python -m scripts.k9b_cnpg_live_lab_bootstrap collect-rendered-manifest-evidence \
            --chart-path ./charts/k9b \
            --values-path ./charts/k9b/values-live-lab.yaml \
            --artifact-dir ./lab-artifacts/live \
            --namespace "${LAB_NAMESPACE}" \
            --release-name k9b \
            || echo "Warning: Failed to collect rendered manifest evidence"
          
          # Deploy with --wait=false to avoid blocking using array
          set +e
          HELM_UPGRADE_CMD=(
            helm upgrade --install k9b ./charts/k9b
            --kubeconfig="${KUBECONFIG}"
            --namespace "${LAB_NAMESPACE}"
            --create-namespace
            --wait=false
            --values ./charts/k9b/values-live-lab.yaml
            --set "image.backend.repository=${BACKEND_REPO}"
            --set "image.backend.tag=${BACKEND_TAG}"
            --set image.backend.pullPolicy=IfNotPresent
            --set backend.auth.enabled=false
            --set kubernetes.auth.mode=inCluster
            --set serviceAccount.automountServiceAccountToken=true
            "${FRONTEND_SET_ARGS[@]}"
            "${PROVIDER_SET_ARGS[@]}"
          )
          # Capture stdout and stderr separately for proper evidence collection
          "${HELM_UPGRADE_CMD[@]}" > "${HELM_LOG_STDOUT}" 2> "${HELM_LOG_STDERR}"
          HELM_RC=$?
          # Combine for backward compatibility (e.g., classify-error reads combined log)
          cat "${HELM_LOG_STDOUT}" "${HELM_LOG_STDERR}" > "${HELM_LOG}" 2>/dev/null || true
          set -e
          
          echo "Helm install completed with exit code ${HELM_RC}"
          
          # ===================================================================
          # Evidence collection: Helm status/history/values IMMEDIATELY after Helm exits
          # Collects evidence on BOTH success and failure paths
          # ===================================================================
          echo "Collecting Helm evidence (both success and failure paths)..."
          # Write stdout and stderr to temp files for CLI subcommand
          HELM_STDOUT_FILE="${RUNNER_TEMP}/helm-stdout-${GITHUB_RUN_ID}.txt"
          HELM_STDERR_FILE="${RUNNER_TEMP}/helm-stderr-${GITHUB_RUN_ID}.txt"
          cat "${HELM_LOG_STDOUT}" > "${HELM_STDOUT_FILE}" 2>/dev/null || echo "" > "${HELM_STDOUT_FILE}"
          cat "${HELM_LOG_STDERR}" > "${HELM_STDERR_FILE}" 2>/dev/null || echo "" > "${HELM_STDERR_FILE}"
          .venv/bin/python -m scripts.k9b_cnpg_live_lab_bootstrap collect-helm-evidence \
            --kubeconfig "${KUBECONFIG}" \
            --namespace "${LAB_NAMESPACE}" \
            --release-name k9b \
            --artifact-dir ./lab-artifacts/live \
            --helm-returncode ${HELM_RC} \
            --helm-stdout-file "${HELM_STDOUT_FILE}" \
            --helm-stderr-file "${HELM_STDERR_FILE}" \
            || echo "Warning: Failed to collect Helm evidence"
          
          # Check if Helm itself failed (e.g., RBAC, CRD, schema errors)
          if [ ${HELM_RC} -ne 0 ]; then
            echo "Helm deployment failed with exit code ${HELM_RC}"
            echo "Classifying error..."
            ARTIFACT_DIR="./lab-artifacts/live" scripts/k9b_cnpg_live_lab_bootstrap.sh classify-error < "${HELM_LOG}" || true
            
            # Collect failure artifacts
            echo "Collecting failure artifacts..."
            kubectl --kubeconfig="${KUBECONFIG}" get events -n "$LAB_NAMESPACE" \
              --sort-by='.lastTimestamp' > ./lab-artifacts/live/namespace-events.txt 2>&1 || true
            kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" \
              -o wide > ./lab-artifacts/live/pods.txt 2>&1 || true
            kubectl --kubeconfig="${KUBECONFIG}" get svc -n "$LAB_NAMESPACE" \
              > ./lab-artifacts/live/services.txt 2>&1 || true
            kubectl --kubeconfig="${KUBECONFIG}" get pvc -n "$LAB_NAMESPACE" \
              > ./lab-artifacts/live/pvc.txt 2>&1 || true
            
            exit ${HELM_RC}
          fi
          
          echo "Helm deployment succeeded - starting proactive rollout monitor"
          echo "Monitoring rollout for up to 90 seconds with 8-second polling interval..."

      # =======================================================================
      # Step 4: Proactive rollout monitor (replaces long blocking --wait)
      # =======================================================================
      - name: Proactive rollout monitor
        id: rollout-monitor
        run: |
          source "${GITHUB_ENV}"
          echo "=== Proactive rollout monitor ==="
          
          # Use set +e to capture exit code without exiting immediately
          # This allows bounded-summary printing and artifact collection even on failure
          set +e
          .venv/bin/python scripts/k9b_cnpg_live_lab_bootstrap.py \
            monitor-rollout \
            --kubeconfig "${KUBECONFIG}" \
            --namespace "$LAB_NAMESPACE" \
            --artifact-dir ./lab-artifacts/live \
            --deadline 90 \
            --poll-interval 8
          MONITOR_RC=$?
          set -e
          
          # Read the bounded summary for CI output
          if [ -f ./lab-artifacts/live/rollout-watch/bounded-summary.txt ]; then
            echo ""
            echo "=== Rollout Diagnosis ==="
            cat ./lab-artifacts/live/rollout-watch/bounded-summary.txt
            echo ""
          fi
          
          # Read the final diagnosis for failure class
          if [ -f ./lab-artifacts/live/rollout-watch/final-diagnosis.json ]; then
            FAILURE_CLASS=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/rollout-watch/final-diagnosis.json --key failure_class)
            echo "FAILURE_CLASS=${FAILURE_CLASS}" >> $GITHUB_OUTPUT
            echo "ROLLOUT_ARTIFACTS=./lab-artifacts/live/rollout-watch" >> $GITHUB_OUTPUT
          fi
          
          # Check if rollout failed
          if [ ${MONITOR_RC} -ne 0 ]; then
            echo "Rollout monitor detected failure (exit code ${MONITOR_RC})"
            
            # Classify the wait timeout using watchdog artifacts
            .venv/bin/python scripts/k9b_cnpg_live_lab_bootstrap.py \
              classify-wait-timeout \
              --namespace "$LAB_NAMESPACE" \
              --kubeconfig "${KUBECONFIG}"
            
            # Collect final failure artifacts
            echo "Collecting failure artifacts..."
            kubectl --kubeconfig="${KUBECONFIG}" get events -n "$LAB_NAMESPACE" \
              --sort-by='.lastTimestamp' > ./lab-artifacts/live/namespace-events.txt 2>&1 || true
            kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" \
              -o wide > ./lab-artifacts/live/pods.txt 2>&1 || true
            kubectl --kubeconfig="${KUBECONFIG}" get svc -n "$LAB_NAMESPACE" \
              > ./lab-artifacts/live/services.txt 2>&1 || true
            kubectl --kubeconfig="${KUBECONFIG}" get pvc -n "$LAB_NAMESPACE" \
              > ./lab-artifacts/live/pvc.txt 2>&1 || true
            
            exit ${MONITOR_RC}
          fi
          
          echo "Rollout monitor: all workloads healthy"

      # =======================================================================
      # Provider smoke: Diagnose provider connectivity and sanitize artifacts
      # When enable_provider_smoke=true:
      #   - requires GitHub secrets for provider base URL/model/API key
      #   - creates Kubernetes Secret for provider API key
      #   - passes diagnosisProvider.* values into Helm install/upgrade
      #   - waits for backend restart and confirms provider initialized
      #   - calls POST /api/incidents/{incident_id}/one-pass-diagnosis against live backend
      #   - captures provider_invocation_attempted=true and provider_configured=true
      #   - fails if provider was not invoked
      # When enable_provider_smoke=false: skips cleanly
      # =======================================================================
      - name: Provider smoke test
        id: provider-smoke
        run: |
          source "${GITHUB_ENV}"
          echo "=== Running diagnosis provider smoke test ==="
          echo "enable_provider_smoke: ${{ inputs.enable_provider_smoke }}"
          
          # Create provider artifact directory
          mkdir -p ./lab-artifacts/live/provider-smoke
          
          # Skip cleanly when provider smoke is not enabled
          if [[ "${{ inputs.enable_provider_smoke }}" != "true" ]]; then
            echo "SKIP: Provider smoke test disabled (enable_provider_smoke=false)"
            echo "PROVIDER_SMOKE_STATUS=skipped" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=disabled" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # When enabled, require provider secrets
          if [[ -z "${{ secrets.K9B_DIAGNOSIS_BASE_URL }}" ]]; then
            echo "ERROR: K9B_DIAGNOSIS_BASE_URL secret is required when enable_provider_smoke=true"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=missing_secrets" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          if [[ -z "${{ secrets.K9B_DIAGNOSIS_MODEL }}" ]]; then
            echo "ERROR: K9B_DIAGNOSIS_MODEL secret is required when enable_provider_smoke=true"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=missing_secrets" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Log presence only (never log the actual URL value)
          echo "Provider base URL configured: true"
          echo "PROVIDER_SMOKE_ENABLED=true" >> $GITHUB_ENV
          
          echo "Provider smoke test: ENABLED"
          
          # Set default status (will be updated after backend API call)
          echo "PROVIDER_SMOKE_STATUS=pending" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_CLASS=awaiting_backend_call" >> $GITHUB_OUTPUT

      - name: Verify Helm release
        run: |
          source "${GITHUB_ENV}"
          helm --kubeconfig="${KUBECONFIG}" status k9b -n "$LAB_NAMESPACE"
          helm --kubeconfig="${KUBECONFIG}" get values k9b -n "$LAB_NAMESPACE"

      - name: Wait for k9b deployment
        run: |
          source "${GITHUB_ENV}"
          echo "Waiting for k9b deployment to be ready..."
          kubectl --kubeconfig="${KUBECONFIG}" rollout status deployment -n "$LAB_NAMESPACE" --timeout=180s || true
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" -o wide
          echo "Rollout status check completed"

      - name: Collect k9b deployment diagnostics
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" get all -n "$LAB_NAMESPACE" -o wide > ./lab-artifacts/live/baseline/k9b-all.txt 2>&1 || echo "unavailable" > ./lab-artifacts/live/baseline/k9b-all.txt
          kubectl --kubeconfig="${KUBECONFIG}" describe deployment -n "$LAB_NAMESPACE" > ./lab-artifacts/live/baseline/k9b-describe.txt 2>&1 || echo "unavailable" > ./lab-artifacts/live/baseline/k9b-describe.txt
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/baseline/k9b-pods.json 2>&1 || echo '{"pods":[]}' > ./lab-artifacts/live/baseline/k9b-pods.json
          echo "K9b diagnostics collected"

      # =======================================================================
      # Assert deployed k9b pod uses image-builder output image
      # =======================================================================
      - name: Assert k9b pod uses image-builder output image
        id: assert_image
        run: |
          source "${GITHUB_ENV}"
          echo "=== Verifying k9b pods use image-builder output ==="
          EXPECTED_IMAGE_REF="${{ inputs.backend_image_ref }}"
          echo "Expected image: $EXPECTED_IMAGE_REF"
          
          # Get actual pod images
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' > ./lab-artifacts/live/logs/k9b-images.txt 2>/dev/null || echo "" > ./lab-artifacts/live/logs/k9b-images.txt
          
          echo "Actual pod images:"
          cat ./lab-artifacts/live/logs/k9b-images.txt
          
          # Check if expected image is used
          if grep -q "$EXPECTED_IMAGE_REF" ./lab-artifacts/live/logs/k9b-images.txt; then
            echo "SUCCESS: k9b pod is using the image-builder output image"
            echo "assertion_passed=true" >> $GITHUB_OUTPUT
          else
            echo "ERROR: k9b pod does NOT use the expected image-builder output"
            echo "Expected: $EXPECTED_IMAGE_REF"
            echo "Actual images found:"
            cat ./lab-artifacts/live/logs/k9b-images.txt
            echo "assertion_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # =======================================================================
      # Deploy CNPG Cluster in lab namespace
      # =======================================================================
      - name: Deploy CNPG cluster
        run: |
          source "${GITHUB_ENV}"
          echo "=== Deploying CNPG cluster in $LAB_NAMESPACE ==="
          kubectl --kubeconfig="${KUBECONFIG}" apply -n "$LAB_NAMESPACE" -f - <<'EOF'
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: lab-cluster
          spec:
            instances: 1
            imageName: ghcr.io/cloudnative-pg/postgresql:17.5
            storage:
              size: 1Gi
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            bootstrap:
              initdb:
                database: labdb
                owner: labuser
          EOF
          echo "CNPG cluster manifest applied"

      - name: Wait for CNPG cluster healthy (FATAL)
        run: |
          source "${GITHUB_ENV}"
          echo "Waiting for CNPG cluster to become ready..."
          timeout 180 bash -c 'until kubectl --kubeconfig="${KUBECONFIG}" get cluster lab-cluster -n "$LAB_NAMESPACE" 2>/dev/null | grep -q "lab-cluster"; do sleep 5; done' || {
            echo "ERROR: CNPG cluster not found within timeout"
            exit 1
          }
          kubectl --kubeconfig="${KUBECONFIG}" wait \
            --for=jsonpath='{.status.instances}'=1 \
            cluster/lab-cluster \
            -n "$LAB_NAMESPACE" \
            --timeout=300s
          kubectl --kubeconfig="${KUBECONFIG}" get cluster lab-cluster -n "$LAB_NAMESPACE" -o yaml
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" -l cnpg.io/cluster=lab-cluster -o wide

      - name: Capture CNPG cluster manifest
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" get cluster lab-cluster -n "$LAB_NAMESPACE" -o yaml > ./lab-artifacts/live/incident/cnpg-cluster.yaml 2>/dev/null || true
          kubectl --kubeconfig="${KUBECONFIG}" get cluster lab-cluster -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/incident/cnpg-clusters.json 2>/dev/null || echo '{"clusters":[]}' > ./lab-artifacts/live/incident/cnpg-clusters.json

      # =======================================================================
      # Capture baseline
      # =======================================================================
      - name: Capture baseline artifacts
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" get nodes -o wide > ./lab-artifacts/live/baseline/nodes.txt
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" -o wide > ./lab-artifacts/live/baseline/pods.txt
          kubectl --kubeconfig="${KUBECONFIG}" get events -n "$LAB_NAMESPACE" --sort-by='.lastTimestamp' > ./lab-artifacts/live/baseline/events.txt 2>/dev/null || true
          kubectl --kubeconfig="${KUBECONFIG}" get cluster -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/baseline/cnpg-clusters.json 2>/dev/null || echo '{"clusters":[]}' > ./lab-artifacts/live/baseline/cnpg-clusters.json
          # k9b status from Helm release
          helm --kubeconfig="${KUBECONFIG}" status k9b -n "$LAB_NAMESPACE" > ./lab-artifacts/live/baseline/k9b-status.json 2>&1 || echo '{"installed":false}' > ./lab-artifacts/live/baseline/k9b-status.json

      # =======================================================================
      # Render incident fixture with namespace normalization
      # Namespaced source namespace mismatches are normalized (not fatal).
      # Namespace object mismatches and cluster-scoped resources are fatal.
      # =======================================================================
      - name: Render incident fixture with namespace normalization
        run: |
          source "${GITHUB_ENV}"
          echo "=== Rendering incident fixture with namespace normalization ==="
          
          if [ ! -f "fixtures/lab/live/pod-failure/injected-change.yaml" ]; then
            echo "ERROR: Tracked incident manifest not found: fixtures/lab/live/pod-failure/injected-change.yaml"
            exit 1
          fi
          
          # Render the fixture to lab-artifacts/live/incidents/<scenario>/
          mkdir -p "./lab-artifacts/live/incidents/pod-failure"
          
          # Render step: normalizes namespaced resources, fails on fatal issues
          .venv/bin/python scripts/k9b_cnpg_live_lab_fixture_render.py \
            render \
            --fixture fixtures/lab/live/pod-failure/injected-change.yaml \
            --output ./lab-artifacts/live/incidents/pod-failure/injected-change.yaml \
            --namespace "$LAB_NAMESPACE" \
            --artifact-dir ./lab-artifacts/live || {
            echo ""
            echo "FAILURE: Fixture rendering failed"
            echo "Check fixture-render-result.json for details"
            cat ./lab-artifacts/live/fixture-render-result.json 2>/dev/null || true
            exit 1
          }
          
          echo "Fixture rendered successfully to ./lab-artifacts/live/incidents/pod-failure/injected-change.yaml"
          echo "RENDERED_FIXTURE_PATH=./lab-artifacts/live/incidents/pod-failure/injected-change.yaml" >> $GITHUB_ENV

      # =======================================================================
      # Verify rendered artifact has correct namespace
      # =======================================================================
      - name: Verify rendered fixture namespace compliance
        run: |
          source "${GITHUB_ENV}"
          echo "=== Verifying rendered fixture namespace compliance ==="
          
          RENDERED_FIXTURE="${RENDERED_FIXTURE_PATH:-./lab-artifacts/live/incidents/pod-failure/injected-change.yaml}"
          
          # Verify the rendered artifact
          .venv/bin/python scripts/k9b_cnpg_live_lab_fixture_render.py \
            verify \
            --fixture "$RENDERED_FIXTURE" \
            --namespace "$LAB_NAMESPACE" || {
            echo ""
            echo "FAILURE: Rendered fixture has namespace violations"
            echo "This should not happen - renderer should have normalized all namespaced resources"
            exit 1
          }
          
          echo "Rendered fixture namespace compliance verified"

      # =======================================================================
      # Inject incident using rendered manifest (namespace mode)
      # =======================================================================
      - name: Inject pod-failure incident
        run: |
          source "${GITHUB_ENV}"
          echo "=== Injecting pod-failure incident ==="
          
          RENDERED_FIXTURE="${RENDERED_FIXTURE_PATH:-./lab-artifacts/live/incidents/pod-failure/injected-change.yaml}"
          
          if [ -f "$RENDERED_FIXTURE" ]; then
            echo "Applying rendered incident manifest: $RENDERED_FIXTURE"
            kubectl --kubeconfig="${KUBECONFIG}" apply -n "$LAB_NAMESPACE" -f "$RENDERED_FIXTURE"
            # Also copy to incident/ for artifact collection
            cp "$RENDERED_FIXTURE" ./lab-artifacts/live/incident/injected-change.yaml
          else
            echo "ERROR: Rendered incident manifest not found: $RENDERED_FIXTURE"
            exit 1
          fi

      - name: Wait for incident propagation
        run: sleep 30

      - name: Verify incident symptom - pod should be NotReady (FATAL)
        run: |
          source "${GITHUB_ENV}"
          echo "Verifying pod-failure incident symptom with state-aware polling..."
          
          # Create artifact directory for symptom verification
          mkdir -p ./lab-artifacts/live/symptom-watch
          
          # Run state-aware verifier with bounded polling
          # Deadline: 90s (allows for image pull + readiness probe check)
          # Poll interval: 5s
          set +e
          .venv/bin/python scripts/verify_pod_failure_symptom.py \
            --kubeconfig "${KUBECONFIG}" \
            --namespace "$LAB_NAMESPACE" \
            --pod-name "cnpg-lab-failing-app" \
            --deadline 90 \
            --poll-interval 5 \
            --artifact-dir ./lab-artifacts/live/symptom-watch
          VERIFY_RC=$?
          set -e
          
          # Read result for diagnostics
          if [ -f ./lab-artifacts/live/symptom-watch/pod-failure-symptom-result.json ]; then
            echo ""
            echo "=== Symptom Verification Result ==="
            .venv/bin/python scripts/extract_symptom_result.py ./lab-artifacts/live/symptom-watch/pod-failure-symptom-result.json
            
            # Extract symptom class for CI output
            SYMPTOM_CLASS=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/symptom-watch/pod-failure-symptom-result.json --key symptom_class)
            echo "SYMPTOM_CLASS=${SYMPTOM_CLASS}" >> $GITHUB_OUTPUT
          fi
          
          # Show polling snapshots if available
          if [ -f ./lab-artifacts/live/symptom-watch/pod-failure-symptom-snapshots.json ]; then
            echo ""
            echo "=== Polling History ==="
            .venv/bin/python scripts/format_polling_history.py ./lab-artifacts/live/symptom-watch/pod-failure-symptom-snapshots.json
          fi
          
          # Exit with verifier result
          if [ ${VERIFY_RC} -ne 0 ]; then
            echo ""
            echo "ERROR: Pod-failure symptom verification failed"
            echo "The pod did not reach the expected Running+NotReady state within the deadline,"
            echo "or a fatal error was detected (image pull failure, scheduling failure)."
            echo ""
            echo "Check ./lab-artifacts/live/symptom-watch/ for detailed diagnostics."
            exit 1
          fi
          
          echo ""
          echo "SUCCESS: Pod-failure symptom verified (Running + NotReady + readiness probe failure)"

      # =======================================================================
      # Capture incident
      # =======================================================================
      - name: Capture incident artifacts
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" -o wide > ./lab-artifacts/live/incident/pods.txt
          kubectl --kubeconfig="${KUBECONFIG}" get events -n "$LAB_NAMESPACE" --sort-by='.lastTimestamp' > ./lab-artifacts/live/incident/events.txt 2>/dev/null || true
          kubectl --kubeconfig="${KUBECONFIG}" describe pods -n "$LAB_NAMESPACE" > ./lab-artifacts/live/incident/describe-pods.txt 2>/dev/null || true
          kubectl --kubeconfig="${KUBECONFIG}" get incidents -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/incident/k9b-incidents.json 2>/dev/null || echo '[]' > ./lab-artifacts/live/incident/k9b-incidents.json

      # =======================================================================
      # Phase 1: Backend Health Gate
      # Fails fast if backend /api/health returns persistent HTTP 500.
      # Collects sanitized diagnostics and stops before incident discovery.
      # =======================================================================
      - name: "Phase 1: Backend Health Gate"
        id: backend-health-gate
        if: inputs.enable_provider_smoke == true
        run: |
          source "${GITHUB_ENV}"
          echo "=== Phase 1: Backend Health Gate ==="
          echo "Polling /api/health until HTTP 200 or max retries reached."
          echo ""
          
          # Wait for backend to stabilize after Helm upgrade with provider config
          echo "Waiting for backend deployment to settle..."
          kubectl --kubeconfig="${KUBECONFIG}" rollout status deployment/k9b-backend -n "$LAB_NAMESPACE" --timeout=120s || true
          
          # Run backend health gate script
          set +e
          .venv/bin/python scripts/check_backend_health_gate.py \
            --kubeconfig "${KUBECONFIG}" \
            --namespace "$LAB_NAMESPACE" \
            --deployment k9b-backend \
            --container backend \
            --port 8080 \
            --max-retries 30 \
            --retry-interval 5 \
            --artifact-dir ./lab-artifacts/live
          GATE_RC=$?
          set -e
          
          # Read result
          if [ -f ./lab-artifacts/live/provider-smoke/backend-health/health-check-result.json ]; then
            FAILURE_CLASS=$(.venv/bin/python scripts/extract_health_result.py ./lab-artifacts/live/provider-smoke/backend-health/health-check-result.json --field failure_class)
            FINAL_HTTP=$(.venv/bin/python scripts/extract_health_result.py ./lab-artifacts/live/provider-smoke/backend-health/health-check-result.json --field final_http_code)
            echo "Backend health result: failure_class=${FAILURE_CLASS}, http=${FINAL_HTTP}"
            echo "BACKEND_HEALTH_FAILURE_CLASS=${FAILURE_CLASS}" >> $GITHUB_OUTPUT
            echo "BACKEND_HEALTH_HTTP=${FINAL_HTTP}" >> $GITHUB_OUTPUT
          fi
          
          # Fail fast on backend health failure
          if [ ${GATE_RC} -ne 0 ]; then
            echo ""
            echo "FAILURE: Backend health check failed: ${FAILURE_CLASS:-unknown}"
            echo ""
            echo "The backend returned persistent HTTP ${FINAL_HTTP:-unknown} after all retries."
            echo "Stopping workflow with precise failure class instead of continuing to incident discovery."
            echo ""
            echo "Artifacts written to: lab-artifacts/live/provider-smoke/backend-health/"
            echo ""
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=${FAILURE_CLASS:-backend_health_failed}" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_PHASE=backend_health_gate" >> $GITHUB_OUTPUT
            
            # Verify backend-health artifacts with provider artifact verifier (fail-closed)
            # Wrap with set +e to capture nonzero exit without shell exit
            if [ -d ./lab-artifacts/live/provider-smoke/backend-health ]; then
              echo ""
              echo "Verifying backend-health artifacts for privacy..."
              set +e
              .venv/bin/python scripts/verify_diagnosis_provider_artifacts.py \
                --input ./lab-artifacts/live/provider-smoke/backend-health \
                --directory
              VERIFY_RC=$?
              set -e
              
              if [ ${VERIFY_RC} -ne 0 ]; then
                echo "ERROR: Backend-health artifact verification FAILED - unsafe content detected"
                echo "Quarantining unsafe backend-health artifacts..."
                
                # Quarantine: move to RUNNER_TEMP so it's not uploaded
                if [ -d ./lab-artifacts/live/provider-smoke/backend-health ]; then
                  mv ./lab-artifacts/live/provider-smoke/backend-health \
                     "${RUNNER_TEMP}/k9b-backend-health-quarantined" 2>/dev/null || true
                fi
                
                echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
                echo "PROVIDER_SMOKE_CLASS=backend_health_artifact_verification_failed" >> $GITHUB_OUTPUT
                echo "PROVIDER_SMOKE_PHASE=backend_health_verification" >> $GITHUB_OUTPUT
                exit 1
              fi
              
              echo "Backend-health artifact verification passed"
            fi
            
            # Do NOT proceed to incident discovery - this is the fail-fast point
            exit 1
          fi
          
          echo ""
          echo "Backend health check PASSED: HTTP 200"
          echo "PROVIDER_SMOKE_STATUS=pending" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_PHASE=backend_health_gate" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_CLASS=backend_healthy" >> $GITHUB_OUTPUT

      # =======================================================================
      # Phase 1b: Scheduler Health Gate
      # Checks scheduler health BEFORE incident discovery to fail fast when
      # the scheduler is unhealthy instead of waiting 120s for incidents
      # that will never be produced.
      # =======================================================================
      - name: "Phase 1b: Scheduler Health Gate"
        id: scheduler-health-gate
        if: inputs.enable_provider_smoke == true && steps.backend-health-gate.outputs.PROVIDER_SMOKE_STATUS != 'fail'
        run: |
          source "${GITHUB_ENV}"
          echo "=== Phase 1b: Scheduler Health Gate ==="
          echo "Checking scheduler health before incident discovery."
          echo ""
          
          # Run scheduler health gate script
          set +e
          .venv/bin/python scripts/check_scheduler_health_gate.py \
            --kubeconfig "${KUBECONFIG}" \
            --namespace "$LAB_NAMESPACE" \
            --artifact-dir ./lab-artifacts/live
          GATE_RC=$?
          set -e
          
          # Read result
          if [ -f ./lab-artifacts/live/provider-smoke/scheduler-health/scheduler-health-result.json ]; then
            FAILURE_CLASS=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/provider-smoke/scheduler-health/scheduler-health-result.json --key failure_class)
            echo "Scheduler health result: failure_class=${FAILURE_CLASS}"
            echo "SCHEDULER_HEALTH_FAILURE_CLASS=${FAILURE_CLASS}" >> $GITHUB_OUTPUT
          fi
          
          # Show bounded summary if available
          if [ -f ./lab-artifacts/live/provider-smoke/scheduler-health/bounded-summary.txt ]; then
            echo ""
            echo "=== Scheduler Health Summary ==="
            cat ./lab-artifacts/live/provider-smoke/scheduler-health/bounded-summary.txt
          fi
          
          # Fail fast on scheduler health failure
          if [ ${GATE_RC} -ne 0 ]; then
            echo ""
            echo "FAILURE: Scheduler health check failed: ${FAILURE_CLASS:-unknown}"
            echo ""
            echo "The scheduler is not healthy - incidents cannot be produced."
            echo "Stopping workflow with precise failure class instead of waiting for incidents."
            echo ""
            echo "Artifacts written to: lab-artifacts/live/provider-smoke/scheduler-health/"
            echo ""
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=${FAILURE_CLASS:-scheduler_health_failed}" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_PHASE=scheduler_health_gate" >> $GITHUB_OUTPUT
            
            # Do NOT proceed to incident discovery - this is the fail-fast point
            exit 1
          fi
          
          echo ""
          echo "Scheduler health check PASSED: scheduler is Ready"
          echo "PROVIDER_SMOKE_STATUS=pending" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_PHASE=scheduler_health_gate" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_CLASS=scheduler_healthy" >> $GITHUB_OUTPUT

      # =======================================================================
      # Phase 2: Incident Discovery
      # Only runs if backend health gate passed (HTTP 200) AND scheduler is healthy.
      # Replaces inline polling with classified failure modes and diagnostic collection.
      # =======================================================================
      - name: "Phase 2: Incident Discovery"
        id: incident-discovery
        if: inputs.enable_provider_smoke == true && steps.backend-health-gate.outputs.PROVIDER_SMOKE_STATUS != 'fail' && steps.scheduler-health-gate.outputs.PROVIDER_SMOKE_STATUS != 'fail'
        shell: bash
        run: |
          source "${GITHUB_ENV}"
          echo "=== Phase 2: Incident Discovery ==="
          echo "Backend health gate passed, scheduler is healthy, proceeding to incident discovery."
          echo ""
          
          # Build gate arguments
          # EXPECT_LLM_ENRICHMENT defaults to false; only set true when provider secrets are present
          EXPECT_LLM_ENRICHMENT="${EXPECT_LLM_ENRICHMENT:-false}"
          echo "Expect LLM enrichment: ${EXPECT_LLM_ENRICHMENT}"
          
          GATE_ARGS=(
            --kubeconfig "${KUBECONFIG}"
            --namespace "${LAB_NAMESPACE}"
            --backend-deployment k9b-backend
            --backend-container backend
            --backend-port 8080
            --fixture-name cnpg-lab-failing-app
            --max-retries 12
            --retry-interval 10
            --artifact-dir ./lab-artifacts/live/provider-smoke/incident-discovery
          )
          
          if [ "${EXPECT_LLM_ENRICHMENT}" = "true" ]; then
            GATE_ARGS+=(--expect-llm-enrichment)
          fi
          
          # Run incident discovery gate with classified failure modes
          # The gate:
          # 1. Verifies the incident fixture exists and is failing
          # 2. Detects candidate from fixture state
          # 3. Polls backend API with bounded retries
          # 4. Collects diagnostics on failure
          # 5. Classifies failure into actionable categories
          # 6. When --expect-llm-enrichment: checks LLM provider invocation
          #
          # Use set +e to capture exit code so artifact reading happens even on failure
          set +e
          .venv/bin/python scripts/check_incident_discovery_gate.py "${GATE_ARGS[@]}"
          GATE_RC=$?
          set -e
          
          # Read result
          if [ -f ./lab-artifacts/live/provider-smoke/incident-discovery/incident-discovery-result.json ]; then
            INCIDENT_ID=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/provider-smoke/incident-discovery/incident-discovery-result.json --key incident_id 2>/dev/null || echo "")
            FAILURE_CLASS=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/provider-smoke/incident-discovery/incident-discovery-result.json --key failure_class 2>/dev/null || echo "")
            DISCOVERY_STATUS=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/provider-smoke/incident-discovery/incident-discovery-result.json --key discovery_status 2>/dev/null || echo "")
            ENRICHMENT_GATE_STATUS=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/provider-smoke/incident-discovery/incident-discovery-result.json --key enrichment_gate_status 2>/dev/null || echo "")
            PROVIDER_ENABLED=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/provider-smoke/incident-discovery/incident-discovery-result.json --key provider_enabled 2>/dev/null || echo "")
            PROVIDER_CONFIGURED=$(.venv/bin/python scripts/extract_json_value.py ./lab-artifacts/live/provider-smoke/incident-discovery/incident-discovery-result.json --key provider_configured 2>/dev/null || echo "")
            echo "Incident discovery result: failure_class=${FAILURE_CLASS}, incident_id=${INCIDENT_ID}, discovery_status=${DISCOVERY_STATUS}, enrichment_gate_status=${ENRICHMENT_GATE_STATUS}"
            echo "INCIDENT_ID=${INCIDENT_ID}" >> $GITHUB_ENV
            echo "INCIDENT_DISCOVERY_FAILURE_CLASS=${FAILURE_CLASS}" >> $GITHUB_OUTPUT
          fi
          
          # Show bounded summary if available
          if [ -f ./lab-artifacts/live/provider-smoke/incident-discovery/bounded-summary.txt ]; then
            echo ""
            echo "=== Incident Discovery Summary ==="
            cat ./lab-artifacts/live/provider-smoke/incident-discovery/bounded-summary.txt
          fi
          
          # Fail or succeed based on gate result
          if [ ${GATE_RC} -ne 0 ]; then
            echo ""
            # Phase-aware failure message: incident discovery vs LLM enrichment failure
            # Use ${VAR:-} defaults to protect against missing JSON fields
            if [ -n "${INCIDENT_ID:-}" ] && [ "${DISCOVERY_STATUS:-}" = "passed" ]; then
              # Incident was found but gate failed due to enrichment/config issue
              case "${ENRICHMENT_GATE_STATUS:-}" in
                disabled)
                  echo "FAILURE: LLM enrichment failed: ${FAILURE_CLASS:-llm_enrichment_disabled}"
                  echo ""
                  echo "Incident discovery: PASSED (incident_id=${INCIDENT_ID})"
                  echo "LLM enrichment: DISABLED"
                  if [ -n "${PROVIDER_ENABLED:-}" ]; then
                    echo "Provider enabled: ${PROVIDER_ENABLED}"
                  fi
                  if [ -n "${PROVIDER_CONFIGURED:-}" ]; then
                    echo "Provider configured: ${PROVIDER_CONFIGURED}"
                  fi
                  echo ""
                  echo "The incident was discovered successfully, but LLM enrichment is disabled or not configured."
                  echo ""
                  echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
                  echo "PROVIDER_SMOKE_CLASS=${FAILURE_CLASS:-llm_enrichment_disabled}" >> $GITHUB_OUTPUT
                  echo "PROVIDER_SMOKE_PHASE=llm_enrichment" >> $GITHUB_OUTPUT
                  ;;
                *)
                  echo "FAILURE: LLM enrichment failed: ${FAILURE_CLASS:-unknown_enrichment_failure}"
                  echo ""
                  echo "Incident discovery: PASSED (incident_id=${INCIDENT_ID})"
                  echo "LLM enrichment: ${ENRICHMENT_GATE_STATUS:-FAILED}"
                  echo ""
                  echo "The incident was discovered successfully, but LLM enrichment failed."
                  echo ""
                  echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
                  echo "PROVIDER_SMOKE_CLASS=${FAILURE_CLASS:-llm_enrichment_failed}" >> $GITHUB_OUTPUT
                  echo "PROVIDER_SMOKE_PHASE=llm_enrichment" >> $GITHUB_OUTPUT
                  ;;
              esac
            else
              # True discovery failure
              echo "FAILURE: Incident discovery failed: ${FAILURE_CLASS:-unknown_failure}"
              echo ""
              case "${FAILURE_CLASS:-}" in
                incident_discovery_timeout|incident_promoted_not_listed|incident_candidate_not_promoted)
                  echo "The incident was not discovered within the timeout period."
                  ;;
                incident_fixture_missing)
                  echo "The incident fixture was not found in the namespace."
                  ;;
              esac
              echo ""
              echo "Check ./lab-artifacts/live/provider-smoke/incident-discovery/ for diagnostics."
              echo ""
              echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
              echo "PROVIDER_SMOKE_CLASS=${FAILURE_CLASS:-incident_discovery_failed}" >> $GITHUB_OUTPUT
              echo "PROVIDER_SMOKE_PHASE=incident_discovery" >> $GITHUB_OUTPUT
            fi
            exit 1
          fi
          
          echo ""
          echo "SUCCESS: Incident discovered: ${INCIDENT_ID:-unknown}"
          echo "INCIDENT_DISCOVERY_STATUS=passed" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_PHASE=incident_discovery" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_CLASS=incident_found" >> $GITHUB_OUTPUT

      # =======================================================================
      # Phase 3: One-Pass Diagnosis Call + Artifact Verification
      # Only runs if incident discovery succeeded.
      # Artifact verification happens here before raw temp cleanup.
      # =======================================================================
      - name: "Phase 3: One-Pass Diagnosis Call + Artifact Verification"
        id: one-pass-diagnosis
        if: inputs.enable_provider_smoke == true && steps.incident-discovery.outputs.PROVIDER_SMOKE_STATUS != 'fail'
        run: |
          source "${GITHUB_ENV}"
          echo "=== Phase 3: One-Pass Diagnosis Call + Artifact Verification ==="
          
          INCIDENT_ID="${INCIDENT_ID}"
          if [[ -z "$INCIDENT_ID" ]]; then
            echo "ERROR: No incident ID from phase 2"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=missing_incident_id" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          BACKEND_SVC="k9b-backend"
          BACKEND_PORT="8080"
          
          # Create temp directory for raw response (outside lab-artifacts/live)
          # Use RUNNER_TEMP which is cleaned between runs and not uploaded
          PROVIDER_RAW_TMP="${RUNNER_TEMP}/provider-smoke-raw"
          mkdir -p "${PROVIDER_RAW_TMP}"
          mkdir -p ./lab-artifacts/live/provider-smoke
          mkdir -p ./lab-artifacts/live/provider-smoke/incident-provider
          
          # Call the one-pass-diagnosis endpoint with inline JSON body
          # Use empty body {} - URL incident_id is authoritative
          # Capture HTTP status code using curl -w "%{http_code}"
          echo "Calling POST /api/incidents/${INCIDENT_ID}/one-pass-diagnosis..."
          set +e
          HTTP_OUTPUT=$(kubectl --kubeconfig="${KUBECONFIG}" exec -n "$LAB_NAMESPACE" \
            deploy/${BACKEND_SVC} -c backend -- \
            curl -sS -X POST \
            "http://localhost:${BACKEND_PORT}/api/incidents/${INCIDENT_ID}/one-pass-diagnosis" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\n%{http_code}" \
            --max-time 180 2>&1)
          API_RC=$?
          set -e
          
          # Parse HTTP status from last line
          HTTP_STATUS=$(echo "$HTTP_OUTPUT" | tail -1)
          RESPONSE_BODY=$(echo "$HTTP_OUTPUT" | sed '$d')
          
          echo "HTTP status: ${HTTP_STATUS}"
          
          # Fail immediately on non-200 HTTP status
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "ERROR: Provider route smoke failed with HTTP ${HTTP_STATUS}"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=http_error_${HTTP_STATUS}" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_PHASE=one_pass_diagnosis" >> $GITHUB_OUTPUT
            echo "http_status=${HTTP_STATUS}" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "HTTP 200 OK - provider route smoke passed"
          
          # Save raw response to temp directory (never in lab-artifacts/live)
          echo "$RESPONSE_BODY" > "${PROVIDER_RAW_TMP}/diagnosis-response.json"
          echo "$HTTP_STATUS" > "${PROVIDER_RAW_TMP}/http-status.txt"
          
          # Verify response is valid JSON before proceeding
          if ! echo "$RESPONSE_BODY" | .venv/bin/python scripts/validate_json.py 2>/dev/null; then
            echo "ERROR: Invalid JSON response from API (HTTP ${HTTP_STATUS})"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=invalid_response" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_PHASE=one_pass_diagnosis" >> $GITHUB_OUTPUT
            echo "http_status=${HTTP_STATUS}" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Parse response to check provider status
          echo "$RESPONSE_BODY" > "${PROVIDER_RAW_TMP}/response.json"
          PROVIDER_INVOKED=$(.venv/bin/python scripts/check_provider_status.py "${PROVIDER_RAW_TMP}/response.json" --field provider_invocation_attempted 2>/dev/null || echo "unknown")
          
          PROVIDER_CONFIGURED=$(.venv/bin/python scripts/check_provider_status.py "${PROVIDER_RAW_TMP}/response.json" --field provider_configured 2>/dev/null || echo "unknown")
          
          echo "Provider invocation attempted: ${PROVIDER_INVOKED}"
          echo "Provider configured: ${PROVIDER_CONFIGURED}"
          echo "http_status=${HTTP_STATUS}" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_PHASE=one_pass_diagnosis" >> $GITHUB_OUTPUT
          
          # Determine overall status
          # When smoke is explicitly enabled, ALL states except (configured=true, invoked=true) are failures
          if [[ "$PROVIDER_CONFIGURED" == "true" ]] && [[ "$PROVIDER_INVOKED" == "true" ]]; then
            echo "Provider smoke test: PASS"
            echo "PROVIDER_SMOKE_STATUS=pass" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=provider_invoked" >> $GITHUB_OUTPUT
            echo "provider_invoked=true" >> $GITHUB_OUTPUT
            echo "provider_configured=true" >> $GITHUB_OUTPUT
          elif [[ "$PROVIDER_CONFIGURED" == "false" ]]; then
            echo "Provider smoke test: FAIL - provider not configured"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=provider_not_configured" >> $GITHUB_OUTPUT
            echo "provider_invoked=false" >> $GITHUB_OUTPUT
            echo "provider_configured=false" >> $GITHUB_OUTPUT
            exit 1
          elif [[ "$PROVIDER_INVOKED" == "false" ]]; then
            echo "Provider smoke test: FAIL - provider configured but not invoked"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=provider_not_invoked" >> $GITHUB_OUTPUT
            echo "provider_invoked=false" >> $GITHUB_OUTPUT
            echo "provider_configured=true" >> $GITHUB_OUTPUT
            exit 1
          else
            # Unknown/missing fields - FAIL when smoke is explicitly enabled
            echo "Provider smoke test: FAIL - unknown/missing provider status fields"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=unknown_provider_status" >> $GITHUB_OUTPUT
            echo "provider_invoked=${PROVIDER_INVOKED}" >> $GITHUB_OUTPUT
            echo "provider_configured=${PROVIDER_CONFIGURED}" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # =======================================================================
          # Artifact Verification - runs BEFORE trap cleanup
          # Sanitize response for upload using directory-mode verifier (fail-closed)
          # Wrap with set +e to capture nonzero exit without shell exit
          # =======================================================================
          echo ""
          echo "Running artifact verification on incident-provider artifacts..."
          set +e
          .venv/bin/python scripts/verify_diagnosis_provider_artifacts.py \
            --input "${PROVIDER_RAW_TMP}" \
            --output ./lab-artifacts/live/provider-smoke/incident-provider \
            --directory
          SANITIZE_RC=$?
          set -e
          
          if [ ${SANITIZE_RC} -ne 0 ]; then
            echo "Provider artifact verification FAILED - secrets or topology detected"
            echo "PROVIDER_SMOKE_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_CLASS=artifact_verification_failed" >> $GITHUB_OUTPUT
            echo "PROVIDER_SMOKE_PHASE=artifact_verification" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Provider smoke test: artifact verification passed"
          echo "PROVIDER_SMOKE_STATUS=pass" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_CLASS=all_phases_passed" >> $GITHUB_OUTPUT
          echo "PROVIDER_SMOKE_PHASE=artifact_verification" >> $GITHUB_OUTPUT
          
          # Clean up raw temp directory now that sanitized artifacts are written
          rm -rf "${PROVIDER_RAW_TMP}"

      # =======================================================================
      # Phase 4: Persisted Diagnosis Contract Gate
      # Only runs if Phase 3 (provider route smoke) passed.
      # Fetches the incident after one-pass diagnosis to verify persisted state.
      # =======================================================================
      - name: "Phase 4: Persisted Diagnosis Contract Gate"
        id: persisted-diagnosis-contract
        if: inputs.enable_provider_smoke == true && steps.one-pass-diagnosis.outputs.PROVIDER_SMOKE_STATUS == 'pass'
        run: |
          source "${GITHUB_ENV}"
          echo "=== Phase 4: Persisted Diagnosis Contract Gate ==="
          
          INCIDENT_ID="${INCIDENT_ID}"
          if [[ -z "$INCIDENT_ID" ]]; then
            echo "ERROR: No incident ID from phase 2"
            echo "PERSISTED_DIAGNOSIS_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PERSISTED_DIAGNOSIS_CLASS=missing_incident_id" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          BACKEND_SVC="k9b-backend"
          BACKEND_PORT="8080"
          
          # Create temp directory for raw response (outside lab-artifacts/live)
          # Use RUNNER_TEMP which is cleaned between runs and not uploaded
          PERSISTED_RAW_TMP="${RUNNER_TEMP}/persisted-diagnosis-raw"
          mkdir -p "${PERSISTED_RAW_TMP}"
          mkdir -p ./lab-artifacts/live/provider-smoke/persisted-diagnosis
          
          # Fetch the incident after one-pass diagnosis
          echo "Fetching incident ${INCIDENT_ID} to verify persisted diagnosis state..."
          set +e
          HTTP_OUTPUT=$(kubectl --kubeconfig="${KUBECONFIG}" exec -n "$LAB_NAMESPACE" \
            deploy/${BACKEND_SVC} -c backend -- \
            curl -sS -X GET \
            "http://localhost:${BACKEND_PORT}/api/incidents/${INCIDENT_ID}" \
            -w "\n%{http_code}" \
            --max-time 60 2>&1)
          API_RC=$?
          set -e
          
          # Parse HTTP status from last line
          HTTP_STATUS=$(echo "$HTTP_OUTPUT" | tail -1)
          RESPONSE_BODY=$(echo "$HTTP_OUTPUT" | sed '$d')
          
          echo "Incident fetch HTTP status: ${HTTP_STATUS}"
          
          # Fail immediately on non-200 HTTP status
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "ERROR: Incident fetch failed with HTTP ${HTTP_STATUS}"
            echo "PERSISTED_DIAGNOSIS_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PERSISTED_DIAGNOSIS_CLASS=incident_fetch_http_error" >> $GITHUB_OUTPUT
            echo "PERSISTED_DIAGNOSIS_HTTP=${HTTP_STATUS}" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Incident fetch: HTTP 200 OK"
          
          # Save raw response to temp directory (never in lab-artifacts/live)
          echo "$RESPONSE_BODY" > "${PERSISTED_RAW_TMP}/incident-response.json"
          echo "$HTTP_STATUS" > "${PERSISTED_RAW_TMP}/http-status.txt"
          
          # Validate JSON before proceeding
          if ! echo "$RESPONSE_BODY" | .venv/bin/python scripts/validate_json.py 2>/dev/null; then
            echo "ERROR: Invalid JSON response from incident fetch (HTTP ${HTTP_STATUS})"
            echo "PERSISTED_DIAGNOSIS_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PERSISTED_DIAGNOSIS_CLASS=invalid_incident_json" >> $GITHUB_OUTPUT
            echo "PERSISTED_DIAGNOSIS_HTTP=${HTTP_STATUS}" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "JSON validation passed"
          echo "PERSISTED_DIAGNOSIS_HTTP=${HTTP_STATUS}" >> $GITHUB_OUTPUT
          
          # =======================================================================
          # Verify persisted diagnosis contract using dedicated script
          # =======================================================================
          echo ""
          echo "Running persisted diagnosis contract verification..."
          set +e
          .venv/bin/python scripts/check_persisted_diagnosis_contract.py \
            --incident-json "${PERSISTED_RAW_TMP}/incident-response.json" \
            --output-dir ./lab-artifacts/live/provider-smoke/persisted-diagnosis \
            --incident-http-status ${HTTP_STATUS} \
            --require-provider-invoked
          CONTRACT_RC=$?
          set -e
          
          if [ ${CONTRACT_RC} -ne 0 ]; then
            echo ""
            echo "Persisted diagnosis contract FAILED"
            
            # Extract failure class from result
            if [ -f ./lab-artifacts/live/provider-smoke/persisted-diagnosis/persisted-diagnosis-result.json ]; then
              FAILURE_CLASS=$(.venv/bin/python scripts/extract_json_value.py \
                ./lab-artifacts/live/provider-smoke/persisted-diagnosis/persisted-diagnosis-result.json \
                --key failure_class 2>/dev/null || echo "unknown")
              echo "PERSISTED_DIAGNOSIS_CLASS=${FAILURE_CLASS}" >> $GITHUB_OUTPUT
            fi
            
            echo "PERSISTED_DIAGNOSIS_STATUS=fail" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo ""
          echo "Persisted diagnosis contract PASSED"
          echo "PERSISTED_DIAGNOSIS_STATUS=pass" >> $GITHUB_OUTPUT
          echo "PERSISTED_DIAGNOSIS_CLASS=all_passed" >> $GITHUB_OUTPUT
          
          # =======================================================================
          # Artifact Verification - runs BEFORE raw temp cleanup
          # Sanitize response for upload using existing verifier (fail-closed)
          # =======================================================================
          echo ""
          echo "Running artifact verification on persisted-diagnosis artifacts..."
          set +e
          .venv/bin/python scripts/verify_diagnosis_provider_artifacts.py \
            --input "${PERSISTED_RAW_TMP}" \
            --output ./lab-artifacts/live/provider-smoke/persisted-diagnosis \
            --directory
          SANITIZE_RC=$?
          set -e
          
          if [ ${SANITIZE_RC} -ne 0 ]; then
            echo "Provider artifact verification FAILED - secrets or topology detected"
            echo "PERSISTED_DIAGNOSIS_STATUS=fail" >> $GITHUB_OUTPUT
            echo "PERSISTED_DIAGNOSIS_CLASS=artifact_verification_failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Persisted diagnosis contract: artifact verification passed"
          echo "PERSISTED_DIAGNOSIS_STATUS=pass" >> $GITHUB_OUTPUT
          echo "PERSISTED_DIAGNOSIS_CLASS=all_passed" >> $GITHUB_OUTPUT
          
          # Clean up raw temp directory now that sanitized artifacts are written
          rm -rf "${PERSISTED_RAW_TMP}"
          
          # Show bounded summary
          if [ -f ./lab-artifacts/live/provider-smoke/persisted-diagnosis/bounded-summary.txt ]; then
            echo ""
            echo "=== Persisted Diagnosis Contract Summary ==="
            cat ./lab-artifacts/live/provider-smoke/persisted-diagnosis/bounded-summary.txt
          fi

      # =======================================================================
      # Recover
      # =======================================================================
      - name: Recover from incident
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" delete pod cnpg-lab-failing-app -n "$LAB_NAMESPACE" --ignore-not-found=true || true
      - name: Wait for recovery
        run: sleep 30

      # =======================================================================
      # Capture final
      # =======================================================================
      - name: Capture final artifacts
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE" -o wide > ./lab-artifacts/live/recovery-or-final/pods.txt
          kubectl --kubeconfig="${KUBECONFIG}" get events -n "$LAB_NAMESPACE" --sort-by='.lastTimestamp' > ./lab-artifacts/live/recovery-or-final/events.txt 2>/dev/null || true
          kubectl --kubeconfig="${KUBECONFIG}" get cluster -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/recovery-or-final/cnpg-clusters.json 2>/dev/null || echo '{"clusters":[]}' > ./lab-artifacts/live/recovery-or-final/cnpg-clusters.json

      # =======================================================================
      # Generate lab result (namespace mode)
      # =======================================================================
      - name: Generate lab result
        run: |
          source "${GITHUB_ENV}"
          cat << EOF > ./lab-artifacts/live/lab-result.json
          {
            "ok": true,
            "scenario": "${{ inputs.incident_scenario }}",
            "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "cluster_mode": "existing",
            "runner_mode": "self-hosted",
            "cnpg_operator_mode": "existing",
            "lab_namespace": "$LAB_NAMESPACE",
            "k9b_image_repository": "${{ inputs.backend_image_repository }}",
            "k9b_image_tag": "${{ inputs.backend_image_tag }}",
            "k9b_image_ref": "${{ inputs.backend_image_ref }}",
            "k9b_image_digest": "${{ inputs.backend_image_digest }}",
            "incident_detected": false,
            "artifact_dir": "./lab-artifacts/live",
            "failure_reason": "k9b live detection deferred",
            "llm_triage_enabled": false,
            "llm_triage_attempted": false,
            "credential_source": "protected-environment",
            "kubeconfig_source": "k9b-live-lab-admin environment secret"
          }
          EOF
          {
            echo "Live K3s CNPG Incident Lab Run (Namespace Mode)"
            echo "Lab Namespace: $LAB_NAMESPACE"
            echo "Runner: self-hosted (existing cluster)"
            echo "CNPG Operator: existing"
            echo "k9b Image: ${{ inputs.backend_image_ref }}"
            echo "Credential Source: protected-environment"
            kubectl --kubeconfig="${KUBECONFIG}" cluster-info && kubectl --kubeconfig="${KUBECONFIG}" get nodes -o wide && kubectl --kubeconfig="${KUBECONFIG}" get clusters -n "$LAB_NAMESPACE"
            kubectl --kubeconfig="${KUBECONFIG}" get pods -n "$LAB_NAMESPACE"
          } > ./lab-artifacts/live/logs/lab-runner.log

      # =======================================================================
      # Collect logs (before cleanup to capture real state)
      # =======================================================================
      - name: Collect CNPG operator logs
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" logs -n cnpg-system -l app.kubernetes.io/name=cloudnative-pg --tail=50 > ./lab-artifacts/live/logs/cnpg-operator.log 2>/dev/null || echo "unavailable" > ./lab-artifacts/live/logs/cnpg-operator.log
      - name: Collect k9b logs
        run: |
          source "${GITHUB_ENV}"
          kubectl --kubeconfig="${KUBECONFIG}" logs -n "$LAB_NAMESPACE" --all-containers --tail=100 > ./lab-artifacts/live/logs/k9b.log 2>/dev/null || echo "unavailable" > ./lab-artifacts/live/logs/k9b.log
      - name: Collect Helm status
        run: |
          source "${GITHUB_ENV}"
          helm --kubeconfig="${KUBECONFIG}" status k9b -n "$LAB_NAMESPACE" > ./lab-artifacts/live/logs/helm-k9b-status.txt 2>&1 || echo "unavailable" > ./lab-artifacts/live/logs/helm-k9b-status.txt

      # =======================================================================
      # Cleanup lab namespace (always runs) - MUST happen before kubeconfig cleanup
      # =======================================================================
      - name: Cleanup lab namespace
        if: always()
        run: |
          source "${GITHUB_ENV}" || true
          echo "=== Cleaning up lab namespace: $LAB_NAMESPACE ==="
          if [ -n "${KUBECONFIG:-}" ]; then
            kubectl --kubeconfig="${KUBECONFIG}" delete namespace "$LAB_NAMESPACE" --wait=false --ignore-not-found=true 2>/dev/null || true
            echo "Lab namespace cleanup initiated with kubeconfig"
          else
            echo "No kubeconfig available - skipping namespace cleanup"
          fi

      # =======================================================================
      # Cleanup sensitive files (raw artifacts - kept local during job)
      # =======================================================================
      - name: Cleanup sensitive files (raw artifacts)
        run: |
          echo "Removing any accidental secret files from raw artifact directory..."
          find ./lab-artifacts/live -name "*secret*" -type f | xargs rm -f 2>/dev/null || true
          echo "Raw artifact cleanup complete."

      # =======================================================================
      # Sanitize artifacts for verification and upload
      # =======================================================================
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest pyyaml

      - name: Sanitize artifacts for verification
        run: |
          echo "=== Sanitizing live lab artifacts ==="
          echo "Input: ./lab-artifacts/live (raw)"
          echo "Output: ./lab-artifacts/live-sanitized"
          echo ""
          
          # Create sanitized directory
          mkdir -p ./lab-artifacts/live-sanitized
          
          # Run sanitizer with verification integrated
          # Use set +e to capture exit code without exiting step immediately
          # This allows printing findings summary and diagnostics before exit
          set +e
          .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py \
            --sanitize-only \
            --raw-artifact-dir ./lab-artifacts/live \
            --artifact-dir ./lab-artifacts/live-sanitized \
            --verbose
          SANITIZE_RC=$?
          set -e
          
          echo ""
          echo "=== Sanitization exit code: ${SANITIZE_RC} ==="
          
          # Show findings summary (using json.tool instead of bootstrap.py which doesn't have show-findings)
          if [ -s ./lab-artifacts/live-sanitized/_findings.json ]; then
            echo ""
            echo "=== Findings Summary ==="
            .venv/bin/python -m json.tool ./lab-artifacts/live-sanitized/_findings.json || cat ./lab-artifacts/live-sanitized/_findings.json
          else
            echo "No findings file found."
          fi
          
          # Exit with sanitizer result (will fail if actual secrets detected)
          if [ ${SANITIZE_RC} -ne 0 ]; then
            echo ""
            echo "FATAL: Artifact sanitization detected actual secrets or failed."
            echo "Raw artifacts remain local; sanitized artifacts not uploaded."
            exit 1
          fi

      # =======================================================================
      # Verify sanitized artifacts
      # =======================================================================
      - name: Verify sanitized artifacts
        run: |
          echo "=== Verifying sanitized artifacts ==="
          set +e
          .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py \
            --artifact-dir ./lab-artifacts/live-sanitized \
            --verbose
          VERIFY_RC=$?
          set -e
          
          if [ ${VERIFY_RC} -ne 0 ]; then
            echo "Artifact verification failed."
            exit 1
          fi
          
          # Create safety marker only after both sanitizer and verifier pass
          touch ./lab-artifacts/live-sanitized/.safe-for-upload
          echo "SANITIZED_ARTIFACTS_SAFE=true" >> "${GITHUB_ENV}"
          echo "Artifact verification passed."

      # =======================================================================
      # Cleanup kubeconfig file (always runs) - happens last after namespace cleanup
      # =======================================================================
      - name: Cleanup kubeconfig
        if: always()
        run: |
          source "${GITHUB_ENV}" || true
          if [ -n "${KUBECONFIG:-}" ] && [ -f "${KUBECONFIG}" ]; then
            echo "Removing kubeconfig: ${KUBECONFIG}"
            rm -f "${KUBECONFIG}"
            echo "Kubeconfig removed"
          else
            echo "No kubeconfig file to clean up"
          fi

      # =======================================================================
      # Upload live lab artifacts (fail-closed boundary)
      # Only uploads if BOTH sanitizer and sanitized verifier passed.
      # The SANITIZED_ARTIFACTS_SAFE env var is only set after both pass.
      # =======================================================================
      - name: Upload live lab artifacts
        if: ${{ always() && env.SANITIZED_ARTIFACTS_SAFE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: k9b-cnpg-incident-lab-live-${{ github.run_id }}
          path: ./lab-artifacts/live-sanitized/**
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Summary
        run: |
          echo "=== Live K3s CNPG Incident Lab Summary (Namespace Mode) ==="
          echo "Lab Namespace: $LAB_NAMESPACE"
          echo "Runner: self-hosted (existing cluster)"
          echo "CNPG Operator: existing (not installed by lab)"
          echo "Scenario: ${{ inputs.incident_scenario }}"
          echo "k9b Image: ${{ inputs.backend_image_ref }}"
          echo "Artifact: k9b-cnpg-incident-lab-live-${{ github.run_id }}"
          echo "Credential Source: protected-environment (k9b-live-lab-admin)"
          
          # Compute phase-aware summary from step outputs
          # Note: GitHub Actions step outputs must use expression syntax: ${{ steps.*.outputs.* }}
          PROVIDER_SMOKE_STATUS="${{ steps.one-pass-diagnosis.outputs.PROVIDER_SMOKE_STATUS || 'not_run' }}"
          PROVIDER_SMOKE_CLASS="${{ steps.one-pass-diagnosis.outputs.PROVIDER_SMOKE_CLASS || 'not_run' }}"
          PERSISTED_STATUS="${{ steps.persisted-diagnosis-contract.outputs.PERSISTED_DIAGNOSIS_STATUS || 'not_run' }}"
          PERSISTED_CLASS="${{ steps.persisted-diagnosis-contract.outputs.PERSISTED_DIAGNOSIS_CLASS || 'not_run' }}"
          INCIDENT_DISCOVERY_STATUS="${{ steps.incident-discovery.outputs.INCIDENT_DISCOVERY_STATUS || 'not_run' }}"
          
          # Compute detection status from phase-specific outputs only
          # Phase 2 (incident discovery) is authoritative for detection status
          if [[ "$INCIDENT_DISCOVERY_STATUS" == "passed" ]]; then
            DETECTION_STATUS="PASSED"
          elif [[ "${{ inputs.enable_provider_smoke }}" == "true" ]]; then
            DETECTION_STATUS="FAILED"
          else
            DETECTION_STATUS="DEFERRED"
          fi
          
          # Compute LLM status
          if [[ "${{ inputs.enable_provider_smoke }}" != "true" ]]; then
            LLM_STATUS="DISABLED"
          elif [[ "$PERSISTED_STATUS" == "pass" ]]; then
            LLM_STATUS="PERSISTED"
          elif [[ "$PROVIDER_SMOKE_STATUS" == "pass" ]]; then
            LLM_STATUS="PROVIDER_SMOKE_PASSED"
          elif [[ "$PROVIDER_SMOKE_STATUS" == "skipped" ]]; then
            LLM_STATUS="NOT_CALLED"
          else
            LLM_STATUS="FAILED"
          fi
          
          echo "Infrastructure: EXISTING | k9b Detection: ${DETECTION_STATUS} | LLM diagnosis persisted: ${LLM_STATUS}"
          echo "Namespace cleanup: always()"
