# Reusable workflow for live K3s/CNPG incident lab execution in namespace mode.
#
# This workflow:
# - Runs on an existing K3s cluster with preinstalled CNPG operator
# - Does NOT build images (consumes outputs from k9b-image-builder workflow)
# - Does NOT install K3s or CNPG operator
# - Creates a unique lab namespace from GITHUB_RUN_ID
# - Deploys k9b via Helm chart using image-builder outputs
# - Injects incident using tracked manifest
# - Collects artifacts and verifies them
#
# THIS WORKFLOW MUST NOT INCLUDE:
# - docker build / docker push / docker save
# - /var/run/docker.sock
# - buildctl
# - curl -sfL https://get.k3s.io
# - /etc/rancher/k3s/k3s.yaml
# - kubectl apply for CNPG operator manifests
# - CNPG CRD creation

name: K3s CNPG Incident Lab - Live (Namespace Mode)

on:
  workflow_call:
    inputs:
      incident_scenario:
        description: 'Incident scenario'
        required: true
        type: string
      artifact_retention_days:
        description: 'Artifact retention days'
        required: true
        type: string
      backend_image_repository:
        description: 'Backend image repository from image-builder'
        required: true
        type: string
      backend_image_tag:
        description: 'Backend image tag from image-builder'
        required: true
        type: string
      backend_image_ref:
        description: 'Backend image reference (repository:tag)'
        required: true
        type: string
      backend_image_digest:
        description: 'Backend image digest (sha256:...)'
        required: false
        type: string
        default: ''
      frontend_image_repository:
        description: 'Frontend image repository from image-builder'
        required: false
        type: string
        default: ''
      frontend_image_tag:
        description: 'Frontend image tag from image-builder'
        required: false
        type: string
        default: ''
      frontend_image_ref:
        description: 'Frontend image reference (repository:tag)'
        required: false
        type: string
        default: ''

env:
  PYTHON_VERSION: '3.13'
  # Lab namespace derived from run ID
  LAB_NAMESPACE: k9b-cnpg-lab-${{ github.run_id }}
  # Use ConfigMap driver to avoid Secret read permissions for Helm release metadata
  HELM_DRIVER: configmap

jobs:
  live-k3s-lab:
    name: Live K3s CNPG Lab
    # Run on ARC runner scale set spbnix-k8s (cluster access, no Docker)
    runs-on: spbnix-k8s
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # =======================================================================
      # Setup
      # =======================================================================
      - uses: actions/checkout@v4

      # =======================================================================
      # Setup kubectl (pinned version compatible with cluster)
      # =======================================================================
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      # =======================================================================
      # Configure in-cluster kubeconfig from service account mount
      # =======================================================================
      - name: Configure in-cluster kubeconfig
        run: |
          set -euo pipefail

          SA_DIR="/var/run/secrets/kubernetes.io/serviceaccount"
          KUBECONFIG_PATH="$HOME/.kube/config"

          if [ -z "${KUBERNETES_SERVICE_HOST:-}" ]; then
            echo "ERROR: KUBERNETES_SERVICE_HOST is not set; runner does not appear to be running in Kubernetes"
            exit 1
          fi

          if [ ! -f "$SA_DIR/token" ]; then
            echo "ERROR: service account token not mounted at $SA_DIR/token"
            exit 1
          fi

          if [ ! -f "$SA_DIR/ca.crt" ]; then
            echo "ERROR: service account CA not mounted at $SA_DIR/ca.crt"
            exit 1
          fi

          mkdir -p "$HOME/.kube"

          APISERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS:-${KUBERNETES_SERVICE_PORT:-443}}"

          kubectl config set-cluster in-cluster \
            --server="$APISERVER" \
            --certificate-authority="$SA_DIR/ca.crt" \
            --embed-certs=true

          kubectl config set-credentials runner-sa \
            --token="$(cat "$SA_DIR/token")"

          kubectl config set-context in-cluster \
            --cluster=in-cluster \
            --user=runner-sa \
            --namespace=default

          kubectl config use-context in-cluster

          chmod 0600 "$KUBECONFIG_PATH"

          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"
          echo "In-cluster kubeconfig configured"

      # =======================================================================
      # Runner preflight diagnostics (bounded - no token/kubeconfig leakage)
      # =======================================================================
      - name: Runner preflight diagnostics
        run: |
          echo "=== Runner Preflight Diagnostics ==="
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS: ${RUNNER_OS:-unknown}"
          echo "Runner arch: ${RUNNER_ARCH:-unknown}"
          command -v kubectl
          kubectl version --client
          kubectl config current-context
          echo "=== Runner diagnostics complete ==="

      # =======================================================================
      # Kubernetes subject diagnostics (no token/kubeconfig leakage)
      # =======================================================================
      - name: Kubernetes subject diagnostics
        run: |
          scripts/k9b_cnpg_live_lab_rbac_preflight.sh subject

      # =======================================================================
      # Fatal RBAC preflight - verify required permissions exist
      # =======================================================================
      - name: Verify live lab Kubernetes permissions
        run: scripts/k9b_cnpg_live_lab_rbac_preflight.sh cluster

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv && .venv/bin/pip install --upgrade pip pytest

      # =======================================================================
      # Preflight: Verify existing cluster access
      # =======================================================================
      - name: Verify cluster access
        run: |
          echo "=== Verifying existing cluster access ==="
          kubectl version --client
          kubectl auth can-i get pods --all-namespaces
          kubectl get nodes -o wide
          echo "Cluster access verified"

      # =======================================================================
      # Preflight: Verify existing CNPG operator (FATAL)
      # =======================================================================
      - name: Verify CNPG operator preflight
        run: |
          echo "=== Verifying existing CNPG operator ==="
          
          echo "Checking CNPG CRD..."
          if ! kubectl get crd clusters.postgresql.cnpg.io > /dev/null 2>&1; then
            echo "ERROR: CNPG CRD not found. Existing CNPG operator/CRD not found; namespace-mode lab requires preinstalled CNPG."
            exit 1
          fi
          echo "CNPG CRD found"

          echo "Checking CNPG operator pods..."
          kubectl get pods -n cnpg-system -o wide

          echo "Checking for running CNPG operator pod..."
          READY_CNPG_PODS="$(kubectl get pods -n cnpg-system \
            -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\n"}{end}' \
            | grep -iE 'cloudnative-pg|cnpg' || true)"

          if [ -z "$READY_CNPG_PODS" ]; then
            echo "ERROR: no running CNPG operator pod found in cnpg-system"
            kubectl get pods -n cnpg-system -o wide || true
            exit 1
          fi
          echo "Running CNPG operator pods: $READY_CNPG_PODS"

          echo "Checking CNPG operator deployment..."
          if kubectl get deployment -n cnpg-system -o name 2>/dev/null | grep -qE "(cloudnative-pg|cnpg)"; then
            echo "CNPG operator deployment found"
            kubectl get deployment -n cnpg-system
          else
            echo "WARNING: CNPG operator deployment not found with standard names"
            kubectl get deployments -n cnpg-system 2>/dev/null || echo "No deployments in cnpg-system"
          fi

          echo "CNPG operator preflight PASSED"

      - name: Save CNPG operator preflight
        run: |
          mkdir -p ./lab-artifacts/live/logs
          kubectl get crd clusters.postgresql.cnpg.io > ./lab-artifacts/live/logs/cnpg-operator-preflight.txt 2>&1
          kubectl get pods -n cnpg-system >> ./lab-artifacts/live/logs/cnpg-operator-preflight.txt 2>&1
          kubectl get deployments -n cnpg-system >> ./lab-artifacts/live/logs/cnpg-operator-preflight.txt 2>&1

      # =======================================================================
      # Setup Helm
      # =======================================================================
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.16.3'

      - name: Verify Helm installation
        run: helm version --short

      # =======================================================================
      # Create unique lab namespace
      # =======================================================================
      - name: Create lab namespace
        run: |
          echo "=== Creating lab namespace: ${{ env.LAB_NAMESPACE }} ==="
          kubectl create namespace "$LAB_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$LAB_NAMESPACE" \
            lab.k9b.io/name=k3s-cnpg-incident \
            lab.k9b.io/run-id="${{ github.run_id }}" \
            lab.k9b.io/managed=true \
            --overwrite
          echo "LAB_NAMESPACE=$LAB_NAMESPACE" >> $GITHUB_ENV
          echo "Lab namespace created and labeled"
          kubectl get namespace "$LAB_NAMESPACE"

      # =======================================================================
      # Verify namespace-scoped permissions after namespace creation
      # =======================================================================
      - name: Verify namespace-scoped Kubernetes permissions
        run: scripts/k9b_cnpg_live_lab_rbac_preflight.sh namespace "$LAB_NAMESPACE"

      # =======================================================================
      # Deploy k9b via Helm chart using image-builder outputs
      # =======================================================================
      - name: Deploy k9b via Helm chart
        run: |
          echo "=== Deploying k9b via Helm chart ==="
          echo "Backend image: ${{ inputs.backend_image_repository }}:${{ inputs.backend_image_tag }}"
          helm upgrade --install k9b ./charts/k9b \
            --namespace "$LAB_NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set image.backend.repository="${{ inputs.backend_image_repository }}" \
            --set image.backend.tag="${{ inputs.backend_image_tag }}" \
            --set image.backend.pullPolicy=IfNotPresent \
            --set backend.auth.enabled=false \
            --set kubernetes.auth.mode=inCluster \
            --set serviceAccount.automountServiceAccountToken=true
          echo "Helm deployment completed"

      - name: Verify Helm release
        run: |
          helm status k9b -n "$LAB_NAMESPACE"
          helm get values k9b -n "$LAB_NAMESPACE"

      - name: Wait for k9b deployment
        run: |
          echo "Waiting for k9b deployment to be ready..."
          kubectl rollout status deployment -n "$LAB_NAMESPACE" --timeout=180s || true
          kubectl get pods -n "$LAB_NAMESPACE" -o wide
          echo "Rollout status check completed"

      - name: Collect k9b deployment diagnostics
        run: |
          mkdir -p ./lab-artifacts/live/baseline ./lab-artifacts/live/logs
          kubectl get all -n "$LAB_NAMESPACE" -o wide > ./lab-artifacts/live/baseline/k9b-all.txt 2>&1 || echo "unavailable" > ./lab-artifacts/live/baseline/k9b-all.txt
          kubectl describe deployment -n "$LAB_NAMESPACE" > ./lab-artifacts/live/baseline/k9b-describe.txt 2>&1 || echo "unavailable" > ./lab-artifacts/live/baseline/k9b-describe.txt
          kubectl get pods -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/baseline/k9b-pods.json 2>&1 || echo '{"pods":[]}' > ./lab-artifacts/live/baseline/k9b-pods.json
          echo "K9b diagnostics collected"

      # =======================================================================
      # Assert deployed k9b pod uses image-builder output image
      # =======================================================================
      - name: Assert k9b pod uses image-builder output image
        id: assert_image
        run: |
          echo "=== Verifying k9b pods use image-builder output ==="
          EXPECTED_IMAGE_REF="${{ inputs.backend_image_ref }}"
          echo "Expected image: $EXPECTED_IMAGE_REF"
          
          # Get actual pod images
          mkdir -p ./lab-artifacts/live/logs
          kubectl get pods -n "$LAB_NAMESPACE" -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' > ./lab-artifacts/live/logs/k9b-images.txt 2>/dev/null || echo "" > ./lab-artifacts/live/logs/k9b-images.txt
          
          echo "Actual pod images:"
          cat ./lab-artifacts/live/logs/k9b-images.txt
          
          # Check if expected image is used
          if grep -q "$EXPECTED_IMAGE_REF" ./lab-artifacts/live/logs/k9b-images.txt; then
            echo "SUCCESS: k9b pod is using the image-builder output image"
            echo "assertion_passed=true" >> $GITHUB_OUTPUT
          else
            echo "ERROR: k9b pod does NOT use the expected image-builder output"
            echo "Expected: $EXPECTED_IMAGE_REF"
            echo "Actual images found:"
            cat ./lab-artifacts/live/logs/k9b-images.txt
            echo "assertion_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # =======================================================================
      # Deploy CNPG Cluster in lab namespace
      # =======================================================================
      - name: Deploy CNPG cluster
        run: |
          echo "=== Deploying CNPG cluster in $LAB_NAMESPACE ==="
          kubectl apply -n "$LAB_NAMESPACE" -f - <<'EOF'
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: lab-cluster
          spec:
            instances: 1
            imageName: ghcr.io/cloudnative-pg/postgresql:17.5
            storage:
              size: 1Gi
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            bootstrap:
              initdb:
                database: labdb
                owner: labuser
          EOF
          echo "CNPG cluster manifest applied"

      - name: Wait for CNPG cluster healthy (FATAL)
        run: |
          echo "Waiting for CNPG cluster to become ready..."
          timeout 180 bash -c 'until kubectl get cluster lab-cluster -n "$LAB_NAMESPACE" 2>/dev/null | grep -q "lab-cluster"; do sleep 5; done' || {
            echo "ERROR: CNPG cluster not found within timeout"
            exit 1
          }
          kubectl wait \
            --for=jsonpath='{.status.instances}'=1 \
            cluster/lab-cluster \
            -n "$LAB_NAMESPACE" \
            --timeout=300s
          kubectl get cluster lab-cluster -n "$LAB_NAMESPACE" -o yaml
          kubectl get pods -n "$LAB_NAMESPACE" -l cnpg.io/cluster=lab-cluster -o wide

      - name: Capture CNPG cluster manifest
        run: |
          mkdir -p ./lab-artifacts/live/incident
          kubectl get cluster lab-cluster -n "$LAB_NAMESPACE" -o yaml > ./lab-artifacts/live/incident/cnpg-cluster.yaml 2>/dev/null || true
          kubectl get cluster lab-cluster -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/incident/cnpg-clusters.json 2>/dev/null || echo '{"clusters":[]}' > ./lab-artifacts/live/incident/cnpg-clusters.json

      # =======================================================================
      # Capture baseline
      # =======================================================================
      - name: Capture baseline artifacts
        run: |
          mkdir -p ./lab-artifacts/live/baseline
          kubectl get nodes -o wide > ./lab-artifacts/live/baseline/nodes.txt
          kubectl get pods -n "$LAB_NAMESPACE" -o wide > ./lab-artifacts/live/baseline/pods.txt
          kubectl get events -n "$LAB_NAMESPACE" --sort-by='.lastTimestamp' > ./lab-artifacts/live/baseline/events.txt 2>/dev/null || true
          kubectl get cluster -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/baseline/cnpg-clusters.json 2>/dev/null || echo '{"clusters":[]}' > ./lab-artifacts/live/baseline/cnpg-clusters.json
          # k9b status from Helm release
          helm status k9b -n "$LAB_NAMESPACE" > ./lab-artifacts/live/baseline/k9b-status.json 2>&1 || echo '{"installed":false}' > ./lab-artifacts/live/baseline/k9b-status.json

      # =======================================================================
      # Inject incident using tracked manifest (namespace mode)
      # =======================================================================
      - name: Inject pod-failure incident
        run: |
          echo "=== Injecting pod-failure incident ==="
          mkdir -p ./lab-artifacts/live/incident
          
          # Apply the tracked incident manifest in lab namespace mode
          if [ -f "fixtures/lab/live/pod-failure/injected-change.yaml" ]; then
            echo "Applying tracked incident manifest: fixtures/lab/live/pod-failure/injected-change.yaml"
            kubectl apply -n "$LAB_NAMESPACE" -f fixtures/lab/live/pod-failure/injected-change.yaml
            cp fixtures/lab/live/pod-failure/injected-change.yaml ./lab-artifacts/live/incident/injected-change.yaml
          else
            echo "ERROR: Tracked incident manifest not found: fixtures/lab/live/pod-failure/injected-change.yaml"
            exit 1
          fi

      - name: Wait for incident propagation
        run: sleep 30

      - name: Verify incident symptom - pod should be NotReady (FATAL)
        run: |
          echo "Verifying pod-failure incident symptom..."
          POD_NAME="cnpg-lab-failing-app"
          
          # Wait for pod to be scheduled (FATAL)
          timeout 60 bash -c 'until kubectl get pod "'"$POD_NAME"'" -n "'"$LAB_NAMESPACE"'" >/dev/null 2>&1; do sleep 2; done' || {
            echo "ERROR: failing pod $POD_NAME not found in namespace $LAB_NAMESPACE"
            exit 1
          }
          
          # Check pod phase - must be Running
          POD_STATUS="$(kubectl get pod "$POD_NAME" -n "$LAB_NAMESPACE" -o jsonpath='{.status.phase}')"
          if [ "$POD_STATUS" != "Running" ]; then
            echo "ERROR: expected failing pod to be Running but NotReady; got phase=$POD_STATUS"
            kubectl describe pod "$POD_NAME" -n "$LAB_NAMESPACE"
            exit 1
          fi
          
          # Check Ready condition - must be False
          READY_STATUS="$(kubectl get pod "$POD_NAME" -n "$LAB_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"
          echo "Pod phase: $POD_STATUS"
          echo "Ready condition: $READY_STATUS"
          
          if [ "$READY_STATUS" = "True" ]; then
            echo "ERROR: expected pod to remain NotReady, but it became Ready"
            kubectl describe pod "$POD_NAME" -n "$LAB_NAMESPACE"
            exit 1
          fi
          
          if [ "$READY_STATUS" != "False" ]; then
            echo "ERROR: expected Ready=False; got Ready=$READY_STATUS"
            kubectl describe pod "$POD_NAME" -n "$LAB_NAMESPACE"
            exit 1
          fi
          
          echo "SUCCESS: Pod is Running/NotReady as expected (incident symptom confirmed)"

      # =======================================================================
      # Capture incident
      # =======================================================================
      - name: Capture incident artifacts
        run: |
          kubectl get pods -n "$LAB_NAMESPACE" -o wide > ./lab-artifacts/live/incident/pods.txt
          kubectl get events -n "$LAB_NAMESPACE" --sort-by='.lastTimestamp' > ./lab-artifacts/live/incident/events.txt 2>/dev/null || true
          kubectl describe pods -n "$LAB_NAMESPACE" > ./lab-artifacts/live/incident/describe-pods.txt 2>/dev/null || true
          kubectl get incidents -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/incident/k9b-incidents.json 2>/dev/null || echo '[]' > ./lab-artifacts/live/incident/k9b-incidents.json

      # =======================================================================
      # Recover
      # =======================================================================
      - name: Recover from incident
        run: kubectl delete pod cnpg-lab-failing-app -n "$LAB_NAMESPACE" --ignore-not-found=true || true
      - name: Wait for recovery
        run: sleep 30

      # =======================================================================
      # Capture final
      # =======================================================================
      - name: Capture final artifacts
        run: |
          mkdir -p ./lab-artifacts/live/recovery-or-final
          kubectl get pods -n "$LAB_NAMESPACE" -o wide > ./lab-artifacts/live/recovery-or-final/pods.txt
          kubectl get events -n "$LAB_NAMESPACE" --sort-by='.lastTimestamp' > ./lab-artifacts/live/recovery-or-final/events.txt 2>/dev/null || true
          kubectl get cluster -n "$LAB_NAMESPACE" -o json > ./lab-artifacts/live/recovery-or-final/cnpg-clusters.json 2>/dev/null || echo '{"clusters":[]}' > ./lab-artifacts/live/recovery-or-final/cnpg-clusters.json

      # =======================================================================
      # Generate lab result (namespace mode)
      # =======================================================================
      - name: Generate lab result
        run: |
          mkdir -p ./lab-artifacts/live/logs
          cat << EOF > ./lab-artifacts/live/lab-result.json
          {
            "ok": true,
            "scenario": "${{ inputs.incident_scenario }}",
            "started_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "cluster_mode": "existing",
            "runner_mode": "self-hosted",
            "cnpg_operator_mode": "existing",
            "lab_namespace": "$LAB_NAMESPACE",
            "k9b_image_repository": "${{ inputs.backend_image_repository }}",
            "k9b_image_tag": "${{ inputs.backend_image_tag }}",
            "k9b_image_ref": "${{ inputs.backend_image_ref }}",
            "k9b_image_digest": "${{ inputs.backend_image_digest }}",
            "incident_detected": false,
            "artifact_dir": "./lab-artifacts/live",
            "failure_reason": "k9b live detection deferred",
            "llm_triage_enabled": false,
            "llm_triage_attempted": false
          }
          EOF
          {
            echo "Live K3s CNPG Incident Lab Run (Namespace Mode)"
            echo "Lab Namespace: $LAB_NAMESPACE"
            echo "Runner: self-hosted (existing cluster)"
            echo "CNPG Operator: existing"
            echo "k9b Image: ${{ inputs.backend_image_ref }}"
            kubectl cluster-info && kubectl get nodes -o wide && kubectl get clusters -n "$LAB_NAMESPACE"
            kubectl get pods -n "$LAB_NAMESPACE"
          } > ./lab-artifacts/live/logs/lab-runner.log

      # =======================================================================
      # Collect logs (before cleanup to capture real state)
      # =======================================================================
      - name: Collect CNPG operator logs
        run: kubectl logs -n cnpg-system -l app.kubernetes.io/name=cloudnative-pg --tail=50 > ./lab-artifacts/live/logs/cnpg-operator.log 2>/dev/null || echo "unavailable" > ./lab-artifacts/live/logs/cnpg-operator.log
      - name: Collect k9b logs
        run: kubectl logs -n "$LAB_NAMESPACE" --all-containers --tail=100 > ./lab-artifacts/live/logs/k9b.log 2>/dev/null || echo "unavailable" > ./lab-artifacts/live/logs/k9b.log
      - name: Collect Helm status
        run: helm status k9b -n "$LAB_NAMESPACE" > ./lab-artifacts/live/logs/helm-k9b-status.txt 2>&1 || echo "unavailable" > ./lab-artifacts/live/logs/helm-k9b-status.txt

      # =======================================================================
      # Cleanup secrets (must happen before verifier scans artifacts)
      # =======================================================================
      - name: Cleanup sensitive files
        run: find ./lab-artifacts/live -name "*secret*" -type f | xargs rm -f 2>/dev/null || true

      # =======================================================================
      # Verify artifacts (runs on final artifact directory after cleanup)
      # =======================================================================
      - name: Verify live lab artifacts
        run: .venv/bin/python scripts/verify_k3s_cnpg_incident_lab_artifact.py --artifact-dir ./lab-artifacts/live --verbose

      # =======================================================================
      # Cleanup lab namespace (always runs)
      # =======================================================================
      - name: Cleanup lab namespace
        if: always()
        run: |
          echo "=== Cleaning up lab namespace: $LAB_NAMESPACE ==="
          kubectl delete namespace "$LAB_NAMESPACE" --wait=false --ignore-not-found=true || true
          echo "Lab namespace cleanup initiated"

      # =======================================================================
      # Upload artifacts
      # =======================================================================
      - name: Upload live lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k9b-cnpg-incident-lab-live-${{ github.run_id }}
          path: ./lab-artifacts/live/**
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Summary
        run: |
          echo "=== Live K3s CNPG Incident Lab Summary (Namespace Mode) ==="
          echo "Lab Namespace: $LAB_NAMESPACE"
          echo "Runner: self-hosted (existing cluster)"
          echo "CNPG Operator: existing (not installed by lab)"
          echo "Scenario: ${{ inputs.incident_scenario }}"
          echo "k9b Image: ${{ inputs.backend_image_ref }}"
          echo "Artifact: k9b-cnpg-incident-lab-live-${{ github.run_id }}"
          echo "Infrastructure: EXISTING | k9b Detection: DEFERRED | LLM: NOT CALLED"
          echo "Namespace cleanup: always()"