name: Verify

# Canonical verification gate for the k9b repository.
# Mirrors scripts/verify_all.sh for CI environments.
#
# Runs on:
#   - All pull requests (all branches)
#   - Push to main (for post-merge verification)
#   - Manual workflow dispatch for ad-hoc verification
#
# No secrets required - this is a read-only verification lane.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: 'Verification scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - python-only
          - frontend-only
          - helm-only

env:
  # Force color output for better CI logs
  FORCE_COLOR: '1'

jobs:
  # Python lint/type/doctrine gates (excluding unit tests - handled by shards)
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'python-only'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run lint checks
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python scripts/check_llm_friendly_files.py --quiet

      - name: Run type checks
        run: |
          .venv/bin/python -m mypy src/k8s_diag_agent
          .venv/bin/python -m mypy tests/__init__.py tests/path_helper.py tests/test_*.py

      - name: Run doctrine checks
        run: |
          bash scripts/verify_factory_doctrine.sh
          bash scripts/verify_dockerhub_base_images.sh
          bash scripts/verify_docker_workflow_hygiene.sh
          bash scripts/verify_docker_build_locality.sh
          bash scripts/verify_health_loop_structured_output.sh

      - name: Run Python doctrine checks
        run: |
          .venv/bin/python scripts/verify_agentic_pipeline.py
          .venv/bin/python scripts/verify_llm_evidence_boundaries.py
          .venv/bin/python scripts/verify_llm_semantic_injection_detection.py
          .venv/bin/python scripts/verify_discovery_logging_hygiene.py
          .venv/bin/python scripts/verify_pvc_rollout_policy.py
          .venv/bin/python scripts/verify_shared_pvc_colocation.py
          .venv/bin/python scripts/verify_next_check_sanitization_hygiene.py
          .venv/bin/python scripts/verify_operator_projection_hygiene.py

  # Python unit-test shards in parallel matrix
  python-unit-tests:
    needs: lint
    name: Python unit tests shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'python-only'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1]
        shard_total: [2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run Python unit test shard
        run: |
          echo "Running Python unit tests shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}"
          scripts/run_unit_tests.sh --shard "${{ matrix.shard_index }}" "${{ matrix.shard_total }}"

      - name: Upload test timing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-shard-${{ matrix.shard_index }}-${{ github.run_id }}
          path: |
            runs/verification/test-timings/
          retention-days: 7
          compression-level: 9

  # Verify shard union completeness
  python-unit-shard-union:
    needs: python-unit-tests
    name: Verify shard union completeness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'python-only'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Verify shard completeness
        run: |
          echo "Verifying 2-way shard partition completeness"
          scripts/run_unit_tests.sh --verify-shards 2

  # Frontend verification (no needs: lint - runs independently)
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'frontend-only'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ui

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # Helm chart verification (no needs: lint - runs independently)
  helm-chart:
    name: Helm chart verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'helm-only'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Run Helm chart verification
        run: |
          bash scripts/verify_helm_chart.sh
          bash scripts/verify_helm_oci_login.sh

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run coverage report
        run: ./scripts/run_coverage.sh

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.run_id }}
          path: |
            coverage/
          retention-days: 7
          compression-level: 9

      - name: Display coverage summary
        run: |
          echo "=== Backend Coverage Summary ==="
          if [ -f coverage/backend/coverage.json ]; then
            .venv/bin/python -c 'import json; d=json.load(open("coverage/backend/coverage.json")); t=d["totals"]; print("Line coverage: {:.2f}%".format(t["percent_covered"])); print("Lines: {}/{}".format(t["covered_lines"], t["num_statements"])); print("Branches: {}/{}".format(t["covered_branches"], t["num_branches"]))'
          else
            echo "Coverage report not available"
          fi
