# ACT-K9B-HULK-PROMOTION-AUTOMATED-CLOSURE-LIVE-QUALIFICATION-AND-CI-TIMING01
# WAVE CORRECTION02 — reusable verify workflow
#
# P0-5 caller + verify chain:
#   This workflow runs the canonical ACT-local gate at the locked
#   CLOSURE_SHA.  It re-verifies the committed evidence pair read-only,
#   runs the targeted-repository-gate with K9B_LLM_ALLOWLIST_BASE_REF
#   bound to BASE, and asserts HEAD == CLOSURE_SHA.
#
# P0-4 targeted gate range propagation:
#   K9B_LLM_ALLOWLIST_BASE_REF=BASE_SHA is set so the child verify uses
#   the exact closure subject range.

# CI-HERMETIC-TOOLCACHE:
# k9b CI is intentionally shell-first/toolcache-first.  Avoid setup/download
# actions where a pinned runner tool-cache path or checked-in script can be used.
# Missing cached tools must fail fast, not download mutable replacements.
# See docs/ci-hermetic-toolchain.md.

name: k9b promotion verify

on:
  workflow_call:
    inputs:
      closure_sha:
        type: string
        required: true
      subject_sha:
        type: string
        required: true
      subject_tree:
        type: string
        required: true
    outputs:
      verify_conclusion:
        value: ${{ jobs.verify.outputs.verify_conclusion }}
      parser_exit_code:
        value: ${{ jobs.verify.outputs.parser_exit_code }}
      overall_status:
        value: ${{ jobs.verify.outputs.overall_status }}
      checks_failed:
        value: ${{ jobs.verify.outputs.checks_failed }}
    secrets: {}

permissions:
  contents: read

jobs:
  verify:
    name: read-only verify at CLOSURE_SHA
    runs-on: ubuntu-latest
    outputs:
      verify_conclusion: ${{ steps.run.outputs.verify_conclusion }}
      parser_exit_code: ${{ steps.run.outputs.parser_exit_code }}
      overall_status: ${{ steps.run.outputs.overall_status }}
      checks_failed: ${{ steps.run.outputs.checks_failed }}
    env:
      K9B_LLM_ALLOWLIST_BASE_REF: f09348dc6f7dd8887c51278ee0a504c7e22d1417
    steps:
      - name: checkout at CLOSURE_SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.closure_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: assert HEAD == CLOSURE_SHA
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${{ inputs.closure_sha }}" ]; then
            echo "FATAL: HEAD drifted from CLOSURE_SHA"
            exit 1
          fi

      - name: assert parent(CLOSURE_SHA) == SUBJECT_SHA
        run: |
          set -euo pipefail
          if [ "$(git rev-parse "${{ inputs.closure_sha }}^")" != "${{ inputs.subject_sha }}" ]; then
            echo "FATAL: parent(CLOSURE_SHA) != SUBJECT_SHA"
            exit 1
          fi

      - name: assert SUBJECT_TREE matches recorded tree
        run: |
          set -euo pipefail
          expected="${{ inputs.subject_tree }}"
          actual="$(git log -1 --format=%T ${{ inputs.subject_sha }})"
          if [ "$expected" != "$actual" ]; then
            echo "FATAL: subject_tree mismatch (expected=$expected actual=$actual)"
            exit 1
          fi

      - name: canonical Python bootstrap (no setup actions)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel setuptools
          .venv/bin/python -m pip install -e .
          .venv/bin/python --version
          .venv/bin/python -m pytest --version

      - name: run ACT-local verification (read-only)
        id: run
        run: |
          set -euo pipefail
          # Read-only: verification MUST NOT write to .factory/
          BEFORE_SUMMARY="$(git rev-parse :.factory/gate-summary.json || echo none)"
          BEFORE_VALIDATION="$(git rev-parse :.factory/gate-summary-validation.json || echo none)"
          ./scripts/verify_all.sh --act-local --skip-gate-summary || EXIT=$?
          set +e
          AFTER_SUMMARY="$(git rev-parse :.factory/gate-summary.json || echo none)"
          AFTER_VALIDATION="$(git rev-parse :.factory/gate-summary-validation.json || echo none)"
          set -e
          if [ "$BEFORE_SUMMARY" != "$AFTER_SUMMARY" ] || [ "$BEFORE_VALIDATION" != "$AFTER_VALIDATION" ]; then
            echo "FATAL: verification dirtied the committed evidence pair"
            exit 1
          fi

      - name: extract verify verdict
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path(".factory/gate-summary.json").read_text())
          v = json.loads(Path(".factory/gate-summary-validation.json").read_text())
          with open("/tmp/k9b_verify_result.json", "w") as fh:
              json.dump({
                  "verify_conclusion": "success" if d["overall_status"] == "pass" else "failure",
                  "parser_exit_code": v["parser_exit_code"],
                  "overall_status": d["overall_status"],
                  "checks_failed": d["checks_failed"],
              }, fh)
          PY

      - name: emit verify outputs
        id: emit
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("/tmp/k9b_verify_result.json"))
          for k, v in d.items():
              print(f"{k}={v}")
          PY

      - name: upload verify artifact
        uses: actions/upload-artifact@v4
        with:
          name: verify-result-${{ inputs.closure_sha }}
          path: /tmp/k9b_verify_result.json