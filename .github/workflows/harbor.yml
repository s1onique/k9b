# CI-HERMETIC-TOOLCACHE:
# k9b CI is intentionally shell-first/toolcache-first. Avoid setup/download
# actions where a pinned runner tool-cache path or checked-in script can be use.
# Missing cached tools must fail fast, not download mutable replacements.
# See docs/ci-hermetic-toolchain.md.

name: Build and Push to Harbor

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  # Force color output for better CI logs
  FORCE_COLOR: '1'
  # Python version - pinned to specific patch for reproducible toolcache hits
  PYTHON_VERSION: '3.13.14'
  # Harbor registry configuration (internal hostname for ARC/k3s runners)
  REGISTRY: harbor-pve1.spbnix.local
  HARBOR_PROJECT: k9b
  BACKEND_IMAGE_NAME: k9b-backend
  FRONTEND_IMAGE_NAME: k9b-frontend

jobs:
  # =============================================================================
  # Quality gates - parallel lanes mirroring scripts/verify_all.sh structure
  # =============================================================================

  # Python lint/type/doctrine gates (excluding unit tests - handled by shards)
  lint-policy:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wire Python from tool cache
        run: source scripts/ci/wire_toolcache_python.sh "${{ env.PYTHON_VERSION }}"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run lint checks
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python scripts/check_llm_friendly_files.py --quiet

      - name: Run type checks
        run: |
          .venv/bin/python -m mypy src/k8s_diag_agent
          .venv/bin/python -m mypy tests/__init__.py tests/path_helper.py tests/test_*.py

      - name: Run doctrine checks
        run: |
          bash scripts/verify_factory_doctrine.sh
          bash scripts/verify_dockerhub_base_images.sh
          bash scripts/verify_docker_workflow_hygiene.sh
          bash scripts/verify_docker_build_locality.sh
          bash scripts/verify_health_loop_structured_output.sh

      - name: Run Python doctrine checks
        run: |
          .venv/bin/python scripts/verify_agentic_pipeline.py
          .venv/bin/python scripts/verify_llm_evidence_boundaries.py
          .venv/bin/python scripts/verify_llm_semantic_injection_detection.py
          .venv/bin/python scripts/verify_llm_security_requirements.py
          .venv/bin/python scripts/verify_security_claim_traceability.py
          .venv/bin/python scripts/verify_discovery_logging_hygiene.py
          .venv/bin/python scripts/verify_pvc_rollout_policy.py
          .venv/bin/python scripts/verify_shared_pvc_colocation.py
          .venv/bin/python scripts/verify_next_check_sanitization_hygiene.py
          .venv/bin/python scripts/verify_operator_projection_hygiene.py
          .venv/bin/python scripts/verify_incident_report_quality.py
          .venv/bin/python scripts/verify_artifact_immutability.py
          .venv/bin/python scripts/verify_production_readiness_disclaimer.py
          .venv/bin/python scripts/verify_docs_claim_candidate_dispositions.py

  # Python unit-test shards in parallel matrix (4-way duration-weighted)
  python-unit-tests:
    needs: lint-policy
    name: Python unit tests shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
        shard_total: [4]
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wire Python from tool cache
        run: source scripts/ci/wire_toolcache_python.sh "${{ env.PYTHON_VERSION }}"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: CI history preflight
        run: |
          set -euo pipefail
          BASE=b1294cee7cbfc1c1b22f0c11282eaab474f8dbb8
          test "$(git rev-parse --is-shallow-repository)" = false || {
            echo "::error::CI_REPOSITORY_SHALLOW=true -- repository cloned with shallow history"
            exit 1
          }
          git cat-file -e "${BASE}^{commit}" || {
            echo "::error::HISTORICAL_BASE_PRESENT=false -- ${BASE} not in clone"
            exit 1
          }
          git merge-base --is-ancestor "$BASE" HEAD || {
            echo "::error::HISTORICAL_BASE_IS_ANCESTOR=false -- ${BASE} is not an ancestor of HEAD"
            exit 1
          }
          echo "CI_REPOSITORY_SHALLOW=false"
          echo "HISTORICAL_BASE_PRESENT=true"
          echo "HISTORICAL_BASE_IS_ANCESTOR=true"

      - name: Capture shard collection artifact
        run: |
          echo "Capturing collection order for shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}"
          mkdir -p artifacts/collection
          .venv/bin/python scripts/shard_tests.py --shard "${{ matrix.shard_index }}" --total "${{ matrix.shard_total }}" \
            > "artifacts/collection/shard-${{ matrix.shard_index }}-nodeids.txt" 2>&1
          echo "Collection captured: $(wc -l < artifacts/collection/shard-${{ matrix.shard_index }}-nodeids.txt) tests"

      - name: Run Python unit test shard
        run: |
          echo "Running Python unit tests shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}"
          echo "Using duration-weighted sharding for optimal balance"
          scripts/run_unit_tests.sh --shard "${{ matrix.shard_index }}" "${{ matrix.shard_total }}"

      - name: Upload test timing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-shard-${{ matrix.shard_index }}-${{ github.run_id }}
          path: |
            runs/verification/test-timings/
          retention-days: 7
          compression-level: 9

  # Verify shard union completeness (4-way)
  python-unit-shard-union:
    needs: python-unit-tests
    name: Verify shard union completeness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: CI history preflight
        run: |
          set -euo pipefail
          BASE=b1294cee7cbfc1c1b22f0c11282eaab474f8dbb8
          test "$(git rev-parse --is-shallow-repository)" = false || {
            echo "::error::CI_REPOSITORY_SHALLOW=true -- repository cloned with shallow history"
            exit 1
          }
          git cat-file -e "${BASE}^{commit}" || {
            echo "::error::HISTORICAL_BASE_PRESENT=false -- ${BASE} not in clone"
            exit 1
          }
          git merge-base --is-ancestor "$BASE" HEAD || {
            echo "::error::HISTORICAL_BASE_IS_ANCESTOR=false -- ${BASE} is not an ancestor of HEAD"
            exit 1
          }
          echo "CI_REPOSITORY_SHALLOW=false"
          echo "HISTORICAL_BASE_PRESENT=true"
          echo "HISTORICAL_BASE_IS_ANCESTOR=true"

      - name: Wire Python from tool cache
        run: source scripts/ci/wire_toolcache_python.sh "${{ env.PYTHON_VERSION }}"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Verify shard completeness
        run: |
          echo "Verifying 4-way shard partition completeness"
          scripts/run_unit_tests.sh --verify-shards 4

      - name: Verify test exclusion policy
        run: |
          echo "Verifying test exclusion policy is enforced"
          .venv/bin/python scripts/verify_test_exclusions.py

  # Frontend verification - runs independently (no needs: lint-policy)
  frontend-tests:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wire Node.js from tool cache
        run: source scripts/ci/wire_toolcache_node.sh "20"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ui

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # Helm chart verification - runs independently
  helm-chart:
    name: Helm chart verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wire Python from tool cache
        run: source scripts/ci/wire_toolcache_python.sh "${{ env.PYTHON_VERSION }}"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Wire Helm from tool cache
        run: source scripts/ci/wire_toolcache_helm.sh "3.16.4"

      - name: Run Helm chart verification
        run: |
          bash scripts/verify_helm_workflow_hygiene.sh
          bash scripts/verify_helm_chart.sh
          bash scripts/verify_helm_oci_login.sh

  # =============================================================================
  # Image build jobs - separated by trust class
  #
  # CORRECTION07-B: Split PR and trusted publication callers with proper secret isolation
  #
  # Secret isolation matrix:
  # - same-repository PR:  SPBNIX_CA_CERT_PEM only (read-only, no Harbor auth)
  # - trusted push:        SPBNIX_CA_CERT_PEM + HARBOR_USERNAME + HARBOR_TOKEN
  #
  # Fork and Dependabot PRs are skipped - CA secret unavailable under secret-owned model
  # =============================================================================

  # Same-repository PR backend build (read-only, CA only)
  build-backend-pr:
    needs:
      - lint-policy
      - python-unit-shard-union
      - frontend-tests
      - helm-chart
    # Only run for same-repository PRs (not forks, not Dependabot)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/harbor-build-image.yml
    with:
      registry: harbor-pve1.spbnix.local
      harbor_project: k9b
      image_name: k9b-backend
      dockerfile: ./Dockerfile.python
      build_args: |
        KUBECTL_VERSION=v1.29.6
        HELM_VERSION=3.20.1
      # Read-only authorities for PR
      image_push_enabled: false
      registry_cache_read_enabled: true
      registry_cache_write_enabled: false
    # PR callers receive CA only - no Harbor authentication credentials
    secrets:
      SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}

  # Same-repository PR frontend build (read-only, CA only)
  build-frontend-pr:
    needs:
      - lint-policy
      - python-unit-shard-union
      - frontend-tests
      - helm-chart
    # Only run for same-repository PRs (not forks, not Dependabot)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/harbor-build-image.yml
    with:
      registry: harbor-pve1.spbnix.local
      harbor_project: k9b
      image_name: k9b-frontend
      dockerfile: ./frontend/Dockerfile
      build_args: ""
      # Read-only authorities for PR
      image_push_enabled: false
      registry_cache_read_enabled: true
      registry_cache_write_enabled: false
    # PR callers receive CA only - no Harbor authentication credentials
    secrets:
      SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}

  # Trusted backend publication (write access, full credentials)
  build-backend-publish:
    needs:
      - lint-policy
      - python-unit-shard-union
      - frontend-tests
      - helm-chart
    # Only run for non-PR events (push, tag, workflow_dispatch)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/harbor-build-image.yml
    with:
      registry: harbor-pve1.spbnix.local
      harbor_project: k9b
      image_name: k9b-backend
      dockerfile: ./Dockerfile.python
      build_args: |
        KUBECTL_VERSION=v1.29.6
        HELM_VERSION=3.20.1
      # Full publication authorities for trusted push
      image_push_enabled: true
      registry_cache_read_enabled: true
      registry_cache_write_enabled: true
    # Trusted callers receive all credentials
    secrets:
      SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}

  # Trusted frontend publication (write access, full credentials)
  build-frontend-publish:
    needs:
      - lint-policy
      - python-unit-shard-union
      - frontend-tests
      - helm-chart
    # Only run for non-PR events (push, tag, workflow_dispatch)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/harbor-build-image.yml
    with:
      registry: harbor-pve1.spbnix.local
      harbor_project: k9b
      image_name: k9b-frontend
      dockerfile: ./frontend/Dockerfile
      build_args: ""
      # Full publication authorities for trusted push
      image_push_enabled: true
      registry_cache_read_enabled: true
      registry_cache_write_enabled: true
    # Trusted callers receive all credentials
    secrets:
      SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}

  # =============================================================================
  # Untrusted PR skip status
  # Fork and Dependabot PRs cannot provide Harbor CA secret - skip image builds
  # =============================================================================

  pr-skip-status:
    needs:
      - lint-policy
      - python-unit-shard-union
      - frontend-tests
      - helm-chart
    # Only run for untrusted PRs (fork or Dependabot)
    # Same-repository PRs are handled by build-*-pr jobs
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.actor == 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      ACTOR: ${{ github.actor }}
      REPOSITORY: ${{ github.repository }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
    steps:
      - name: Check PR trust classification
        run: |
          echo "=== PR Trust Classification ==="
          printf 'Event: %s\n' "$EVENT_NAME"
          printf 'Actor: %s\n' "$ACTOR"
          printf 'Head repo: %s\n' "$HEAD_REPOSITORY"
          printf 'Base repo: %s\n' "$BASE_REPOSITORY"
          echo ""
          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            printf 'SKIP REASON: Fork PR - Harbor CA secret unavailable\n'
            printf 'ERROR_CODE: HARBOR_CA_SECRET_UNAVAILABLE_FOR_FORK_PR\n'
          elif [[ "$ACTOR" == "dependabot[bot]" ]]; then
            printf 'SKIP REASON: Dependabot PR - Actions secrets unavailable\n'
            printf 'ERROR_CODE: HARBOR_CA_SECRET_UNAVAILABLE_FOR_DEPENDABOT\n'
          else
            printf 'ERROR: Unexpected untrusted PR context\n'
            exit 1
          fi
