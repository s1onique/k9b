name: Build and Push to Harbor

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  # Force color output for better CI logs
  FORCE_COLOR: '1'
  # Harbor registry configuration (internal hostname for ARC/k3s runners)
  REGISTRY: harbor-pve1.spbnix.local
  HARBOR_PROJECT: k9b
  BACKEND_IMAGE_NAME: k9b-backend
  FRONTEND_IMAGE_NAME: k9b-frontend

jobs:
  # =============================================================================
  # Quality gates - parallel lanes mirroring scripts/verify_all.sh structure
  # =============================================================================

  # Python lint/type/doctrine gates (excluding unit tests - handled by shards)
  lint-policy:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run lint checks
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python scripts/check_llm_friendly_files.py --quiet

      - name: Run type checks
        run: |
          .venv/bin/python -m mypy src/k8s_diag_agent
          .venv/bin/python -m mypy tests/__init__.py tests/path_helper.py tests/test_*.py

      - name: Run doctrine checks
        run: |
          bash scripts/verify_factory_doctrine.sh
          bash scripts/verify_dockerhub_base_images.sh
          bash scripts/verify_docker_workflow_hygiene.sh
          bash scripts/verify_docker_build_locality.sh
          bash scripts/verify_health_loop_structured_output.sh

      - name: Run Python doctrine checks
        run: |
          .venv/bin/python scripts/verify_agentic_pipeline.py
          .venv/bin/python scripts/verify_llm_evidence_boundaries.py
          .venv/bin/python scripts/verify_llm_semantic_injection_detection.py
          .venv/bin/python scripts/verify_discovery_logging_hygiene.py
          .venv/bin/python scripts/verify_pvc_rollout_policy.py
          .venv/bin/python scripts/verify_shared_pvc_colocation.py
          .venv/bin/python scripts/verify_next_check_sanitization_hygiene.py
          .venv/bin/python scripts/verify_operator_projection_hygiene.py
          .venv/bin/python scripts/verify_incident_report_quality.py
          .venv/bin/python scripts/verify_artifact_immutability.py
          .venv/bin/python scripts/verify_production_readiness_disclaimer.py

  # Python unit-test shards in parallel matrix
  python-unit-tests:
    needs: lint-policy
    name: Python unit tests shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1]
        shard_total: [2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run Python unit test shard
        run: |
          echo "Running Python unit tests shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}"
          scripts/run_unit_tests.sh --shard "${{ matrix.shard_index }}" "${{ matrix.shard_total }}"

      - name: Upload test timing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-shard-${{ matrix.shard_index }}-${{ github.run_id }}
          path: |
            runs/verification/test-timings/
          retention-days: 7
          compression-level: 9

  # Verify shard union completeness
  python-unit-shard-union:
    needs: python-unit-tests
    name: Verify shard union completeness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Verify shard completeness
        run: |
          echo "Verifying 2-way shard partition completeness"
          scripts/run_unit_tests.sh --verify-shards 2

  # Frontend verification - runs independently (no needs: lint-policy)
  frontend-tests:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ui

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # Helm chart verification - runs independently
  helm-chart:
    name: Helm chart verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Run Helm chart verification
        run: |
          bash scripts/verify_helm_workflow_hygiene.sh
          bash scripts/verify_helm_chart.sh
          bash scripts/verify_helm_oci_login.sh

  # =============================================================================
  # Build and push jobs - depend on all quality gates
  # =============================================================================

  build-push:
    # Harbor resolves to internal SPbNIX names during OCI pushes; publish jobs must run inside SPbNIX infrastructure.
    # Docker-capable runner required for QEMU, Buildx, build, and push operations.
    runs-on: spbnix-k8s-docker
    needs:
      - lint-policy
      - python-unit-shard-union
      - frontend-tests
      - helm-chart
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker preflight
        run: |
          set -eux
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=${RUNNER_OS:-unknown}"
          echo "arch=${RUNNER_ARCH:-unknown}"
          which docker
          docker version
          docker info
          docker buildx version
          ls -l /var/run/docker.sock

      # CA must be installed BEFORE QEMU/Buildx because they pull images from Harbor.
      # The Docker daemon validates registry TLS, so the CA must be in daemon trust.
      # SKIP_RUNNER_DOCKER_CERTS_D=1: DinD sidecar owns daemon CA trust, runner-side is diagnostic.
      - name: Install SPbNIX Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
          SKIP_RUNNER_DOCKER_CERTS_D: "1"
        run: .github/scripts/install-spbnix-harbor-ca.sh

      # Proof step: docker pull exercises dockerd's trust path, not just CLI tools.
      # If this fails with "unknown ca", the DinD sidecar needs the CA mounted.
      - name: Verify Docker daemon trusts Harbor
        run: |
          set -euo pipefail
          echo "Runner-side Docker cert path:"
          ls -l /etc/docker/certs.d/harbor-pve1.spbnix.local/ca.crt 2>/dev/null || echo "NOT FOUND in runner"
          echo ""
          echo "Docker daemon probe (pulls from Harbor):"
          docker pull harbor-pve1.spbnix.local/dockerhub-cache/library/busybox:latest || {
            echo "ERROR: docker pull failed - Docker daemon does not trust Harbor CA"
            echo "If runner:/etc/docker/certs.d exists but dind sidecar does not,"
            echo "the ARC runner scale set pod template needs CA volume mount."
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: harbor-pve1.spbnix.local/dockerhub-cache/tonistiigi/binfmt:latest
          # Use Harbor proxy cache instead of GitHub Actions cache for faster, local-first pulls
          cache-image: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=harbor-pve1.spbnix.local/dockerhub-cache/moby/buildkit:buildx-stable-1

      # Patch BuildKit containers after they are created by setup-buildx-action
      - name: Patch BuildKit containers with Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
          BUILDX_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          SKIP_RUNNER_DOCKER_CERTS_D: "1"
        run: .github/scripts/install-spbnix-harbor-ca.sh

      - name: Login to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.python
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=harbor-pve1.spbnix.local/k9b/cache/k9b-backend:buildcache
          cache-to: type=registry,ref=harbor-pve1.spbnix.local/k9b/cache/k9b-backend:buildcache,mode=max
          build-args: |
            KUBECTL_VERSION=v1.29.6
            HELM_VERSION=3.20.1

  # Frontend image build - depends on quality gates but can run in parallel with build-push
  frontend:
    # Harbor resolves to internal SPbNIX names during OCI pushes; publish jobs must run inside SPbNIX infrastructure.
    # Docker-capable runner required for QEMU, Buildx, build, and push operations.
    runs-on: spbnix-k8s-docker
    needs:
      - lint-policy
      - python-unit-shard-union
      - frontend-tests
      - helm-chart
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker preflight
        run: |
          set -eux
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=${RUNNER_OS:-unknown}"
          echo "arch=${RUNNER_ARCH:-unknown}"
          which docker
          docker version
          docker info
          docker buildx version
          ls -l /var/run/docker.sock

      # CA must be installed BEFORE QEMU/Buildx because they pull images from Harbor.
      # The Docker daemon validates registry TLS, so the CA must be in daemon trust.
      # SKIP_RUNNER_DOCKER_CERTS_D=1: DinD sidecar owns daemon CA trust, runner-side is diagnostic.
      - name: Install SPbNIX Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
          SKIP_RUNNER_DOCKER_CERTS_D: "1"
        run: .github/scripts/install-spbnix-harbor-ca.sh

      # Proof step: docker pull exercises dockerd's trust path, not just CLI tools.
      # If this fails with "unknown ca", the DinD sidecar needs the CA mounted.
      - name: Verify Docker daemon trusts Harbor
        run: |
          set -euo pipefail
          echo "Runner-side Docker cert path:"
          ls -l /etc/docker/certs.d/harbor-pve1.spbnix.local/ca.crt 2>/dev/null || echo "NOT FOUND in runner"
          echo ""
          echo "Docker daemon probe (pulls from Harbor):"
          docker pull harbor-pve1.spbnix.local/dockerhub-cache/library/busybox:latest || {
            echo "ERROR: docker pull failed - Docker daemon does not trust Harbor CA"
            echo "If runner:/etc/docker/certs.d exists but dind sidecar does not,"
            echo "the ARC runner scale set pod template needs CA volume mount."
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: harbor-pve1.spbnix.local/dockerhub-cache/tonistiigi/binfmt:latest
          # Use Harbor proxy cache instead of GitHub Actions cache for faster, local-first pulls
          cache-image: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=harbor-pve1.spbnix.local/dockerhub-cache/moby/buildkit:buildx-stable-1

      # Patch BuildKit containers after they are created by setup-buildx-action
      - name: Patch BuildKit containers with Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
          BUILDX_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          SKIP_RUNNER_DOCKER_CERTS_D: "1"
        run: .github/scripts/install-spbnix-harbor-ca.sh

      - name: Login to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=harbor-pve1.spbnix.local/k9b/cache/k9b-frontend:buildcache
          cache-to: type=registry,ref=harbor-pve1.spbnix.local/k9b/cache/k9b-frontend:buildcache,mode=max
