name: K3s OTel Demo Incident Lab CI

# CI-only workflow for the OTel Demo incident lab scaffold.
# Runs build-and-verify without requiring K3s cluster access.

on:
  # CI on PR when lab files change
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/k9b-otel-demo-incident-lab*.yml"
      - "scripts/k9b_otel_demo_lab*.py"
      - "scripts/k9b_lab_common*.py"
      - "tests/test_otel_demo_lab.py"
      - "fixtures/otel-demo/**"
      - "Makefile"

  # CI on push to main when lab files change
  push:
    branches:
      - main
    paths:
      - ".github/workflows/k9b-otel-demo-incident-lab*.yml"
      - "scripts/k9b_otel_demo_lab*.py"
      - "scripts/k9b_lab_common*.py"
      - "tests/test_otel_demo_lab.py"
      - "fixtures/otel-demo/**"
      - "Makefile"

env:
  PYTHON_VERSION: '3.13'

jobs:
  build-and-verify:
    name: Build and Verify Lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Python verifier tests
        run: |
          echo "=== Running Python verifier tests ==="
          python -c "import yaml; print('PyYAML import OK')"
          python -m pytest tests/test_otel_demo_lab.py -v

      - name: Verify passing fixture
        run: |
          echo "=== Verifying passing fixture ==="
          python -m scripts.k9b_otel_demo_lab_verify --artifact-dir fixtures/otel-demo/pass

      - name: Verify fail-no-recommendationservice fixture
        run: |
          echo "=== Verifying fail-no-recommendationservice fixture (should fail) ==="
          set +e
          python -m scripts.k9b_otel_demo_lab_verify \
            --artifact-dir fixtures/otel-demo/fail-no-recommendationservice \
            > /tmp/fail-no-recommendationservice.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: fail-no-recommendationservice fixture unexpectedly passed"
            cat /tmp/fail-no-recommendationservice.log
            exit 1
          fi
          echo "fail-no-recommendationservice correctly failed with exit code $rc"
          grep -E "recommendationservice|feature flag" /tmp/fail-no-recommendationservice.log

      - name: Summary
        run: |
          echo "=== K3s OTel Demo Incident Lab CI Summary ==="
          echo "Python verifier tests: PASSED"
          echo "Passing fixture: PASSED"
          echo "Fail fixtures: Correctly rejected"
