name: k9b promotion experimental lab deploy

on:
  workflow_run:
    workflows: [k9b promotion experimental lab build]
    types: [completed]
    branches: [main]

concurrency:
  group: k9b-promotion-experimental-live-lab-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate-upstream:
    name: validate upstream and authorize deployment
    runs-on: ubuntu-latest
    outputs:
      subject_sha: ${{ steps.upstream.outputs.upstream_head_sha }}
      backend_image_ref: ${{ steps.artifact.outputs.backend_image_ref }}
      scheduler_image_ref: ${{ steps.artifact.outputs.scheduler_image_ref }}
      frontend_image_ref: ${{ steps.artifact.outputs.frontend_image_ref }}
      artifact_digest: ${{ steps.artifact.outputs.artifact_digest }}
      upstream_run_id: ${{ steps.upstream.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ steps.upstream.outputs.upstream_run_attempt }}
      authorization_status: ${{ steps.stale_main.outputs.authorization_status }}
    steps:
      - uses: actions/checkout@11c719be6d81d26f4e1e34f15c0d3a2da1661f36b
        with:
          persist-credentials: false

      - id: upstream
        run: |
          set -euo pipefail
          run_event="${{ github.event.workflow_run.event }}"
          run_conclusion="${{ github.event.workflow_run.conclusion }}"
          run_branch="${{ github.event.workflow_run.head_branch }}"
          run_sha="${{ github.event.workflow_run.head_sha }}"
          repo_id="${{ github.event.workflow_run.repository.id }}"
          head_repo_id="${{ github.event.workflow_run.head_repository.id }}"
          head_repo_name="${{ github.event.workflow_run.head_repository.full_name }}"
          if [ "$run_event" != "push" ]; then exit 1; fi
          if [ "$run_conclusion" != "success" ]; then exit 1; fi
          if [ "$run_branch" != "main" ]; then exit 1; fi
          if ! echo "$run_sha" | grep -qE '^[0-9a-f]{40}$'; then exit 1; fi
          if [ "$repo_id" != "${{ github.repository_id }}" ]; then exit 1; fi
          if [ "$head_repo_id" != "${{ github.repository_id }}" ]; then exit 1; fi
          if [ "$head_repo_name" != "${{ github.repository }}" ]; then exit 1; fi
          echo "upstream_run_id=${{ github.event.workflow_run.run_id }}" >> "$GITHUB_OUTPUT"
          echo "upstream_run_attempt=${{ github.event.workflow_run.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "upstream_head_sha=$run_sha" >> "$GITHUB_OUTPUT"

      - id: stale_main
        run: |
          set -euo pipefail
          upstream_sha="${{ steps.upstream.outputs.upstream_head_sha }}"
          current_main=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          echo "current_main_sha=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$upstream_sha" != "$current_main" ]; then
            echo "authorization_status=stale_upstream" >> "$GITHUB_OUTPUT"
          else
            echo "authorization_status=authorized" >> "$GITHUB_OUTPUT"
          fi

      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ steps.upstream.outputs.upstream_run_id }}"
          upstream_sha="${{ steps.upstream.outputs.upstream_head_sha }}"
          artifacts_json=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts")
          count=$(echo "$artifacts_json" | python3 -c "import sys,json; print(len([a for a in json.load(sys.stdin)['artifacts'] if a['name'] == 'experimental-lab-record']))")
          if [ "$count" != "1" ]; then echo "FATAL: expected 1 artifact, found $count"; exit 1; fi
          artifact_id=$(echo "$artifacts_json" | python3 -c "import sys,json; print(next(a['id'] for a in json.load(sys.stdin)['artifacts'] if a['name'] == 'experimental-lab-record'))")
          artifact_digest=$(echo "$artifacts_json" | python3 -c "import sys,json; print(next(a.get('digest', '') for a in json.load(sys.stdin)['artifacts'] if a['name'] == 'experimental-lab-record'))")
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: experimental-lab-record
          run-id: ${{ steps.upstream.outputs.upstream_run_id }}
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          path: artifacts/record_extracted

      - id: record
        run: |
          set -euo pipefail
          record_sha=$(sha256sum artifacts/record_extracted/*.json | awk '{print $1}')
          python3 scripts/ci/promotion_experimental_lab_artifact.py \
            "${{ steps.upstream.outputs.upstream_run_id }}" \
            "${{ steps.upstream.outputs.upstream_head_sha }}" \
            "${{ steps.artifact.outputs.artifact_digest }}"

      - id: authorize
        run: |
          set -euo pipefail
          python3 scripts/ci/promotion_experimental_lab_authorization.py write \
            "$(cat artifacts/artifact_result.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["record_sha256"])')" \
            "${{ steps.stale_main.outputs.current_main_sha }}" \
            "${{ steps.stale_main.outputs.authorization_status }}" \
            "$(cat artifacts/artifact_result.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["backend_image_ref"])')" \
            "$(cat artifacts/artifact_result.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["scheduler_image_ref"])')" \
            "$(cat artifacts/artifact_result.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["frontend_image_ref"])')" \
            "${{ steps.upstream.outputs.upstream_head_sha }}" \
            "${{ steps.upstream.outputs.upstream_run_id }}" \
            "${{ steps.upstream.outputs.upstream_run_attempt }}" \
            "${{ github.sha }}" \
            "${{ github.run_id }}" \
            "${{ github.run_attempt }}" \
            "${{ steps.artifact.outputs.artifact_id }}" \
            "experimental-lab-record" \
            "${{ steps.artifact.outputs.artifact_digest }}"

      - uses: actions/upload-artifact@v4
        with:
          name: experimental-lab-deploy-authorization-${{ github.run_id }}
          path: |
            artifacts/experimental-lab-deploy-authorization.json
            artifacts/experimental-lab-deploy-authorization.json.sha256
          retention-days: 7

  authorize-latest:
    name: authorize latest deployment
    needs: validate-upstream
    runs-on: ubuntu-latest
    outputs:
      subject_sha: ${{ steps.confirm.outputs.subject_sha }}
      backend_image_ref: ${{ steps.confirm.outputs.backend_image_ref }}
      scheduler_image_ref: ${{ steps.confirm.outputs.scheduler_image_ref }}
      frontend_image_ref: ${{ steps.confirm.outputs.frontend_image_ref }}
      artifact_digest: ${{ steps.confirm.outputs.artifact_digest }}
      upstream_run_id: ${{ steps.confirm.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ steps.confirm.outputs.upstream_run_attempt }}
    if: ${{ needs.validate-upstream.outputs.authorization_status == 'authorized' }}
    steps:
      - uses: actions/checkout@11c719be6d81d26f4e1e34f15c0d3a2da1661f36b
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: experimental-lab-deploy-authorization-${{ github.run_id }}
          path: artifacts/auth_extracted

      - id: confirm
        run: |
          set -euo pipefail
          current_main=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          python3 scripts/ci/promotion_experimental_lab_authorization.py verify "$current_main"

  deploy:
    name: deploy to experimental lab
    needs: authorize-latest
    uses: ./.github/workflows/reusable-promotion-deploy.yml
    with:
      closure_sha: ${{ needs.authorize-latest.outputs.subject_sha }}
      backend_image_ref: ${{ needs.authorize-latest.outputs.backend_image_ref }}
      scheduler_image_ref: ${{ needs.authorize-latest.outputs.scheduler_image_ref }}
      frontend_image_ref: ${{ needs.authorize-latest.outputs.frontend_image_ref }}
      environment: lab
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      REGISTRY: ${{ secrets.REGISTRY }}
    permissions:
      contents: read
      id-token: write
