name: k9b promotion experimental lab deploy

on:
  workflow_run:
    workflows: [k9b promotion experimental lab build]
    types: [completed]
    branches: [main]

concurrency:
  group: k9b-promotion-experimental-live-lab-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate-upstream:
    name: validate upstream and authorize deployment
    runs-on: ubuntu-latest
    outputs:
      authorization_status: ${{ steps.stale_main.outputs.authorization_status }}
      artifact_id: ${{ steps.artifact_metadata.outputs.artifact_id }}
      artifact_name: ${{ steps.artifact_metadata.outputs.artifact_name }}
      artifact_metadata_digest: ${{ steps.artifact_metadata.outputs.artifact_metadata_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: initialize bridge artifact workspace
        run: |
          set -euo pipefail
          install -d -m 0700 \
            artifacts \
            artifacts/record_extracted

      - id: upstream
        run: |
          set -euo pipefail
          run_event="${{ github.event.workflow_run.event }}"
          run_conclusion="${{ github.event.workflow_run.conclusion }}"
          run_branch="${{ github.event.workflow_run.head_branch }}"
          run_sha="${{ github.event.workflow_run.head_sha }}"
          repo_id="${{ github.event.workflow_run.repository.id }}"
          head_repo_id="${{ github.event.workflow_run.head_repository.id }}"
          head_repo_name="${{ github.event.workflow_run.head_repository.full_name }}"
          if [ "$run_event" != "push" ]; then exit 1; fi
          if [ "$run_conclusion" != "success" ]; then exit 1; fi
          if [ "$run_branch" != "main" ]; then exit 1; fi
          if ! echo "$run_sha" | grep -qE '^[0-9a-f]{40}$'; then exit 1; fi
          if [ "$repo_id" != "${{ github.repository_id }}" ]; then exit 1; fi
          if [ "$head_repo_id" != "${{ github.repository_id }}" ]; then exit 1; fi
          if [ "$head_repo_name" != "${{ github.repository }}" ]; then exit 1; fi
          run_id="${{ github.event.workflow_run.id }}"
          if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "FATAL: workflow_run.id is missing or invalid"
            exit 1
          fi
          echo "upstream_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "upstream_run_attempt=${{ github.event.workflow_run.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "upstream_head_sha=$run_sha" >> "$GITHUB_OUTPUT"

      - id: stale_main
        run: |
          set -euo pipefail
          upstream_sha="${{ steps.upstream.outputs.upstream_head_sha }}"
          current_main=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          echo "current_main_sha=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$upstream_sha" != "$current_main" ]; then
            echo "authorization_status=stale_upstream" >> "$GITHUB_OUTPUT"
          else
            echo "authorization_status=authorized" >> "$GITHUB_OUTPUT"
          fi

      - id: artifact_query
        if: ${{ steps.stale_main.outputs.authorization_status == 'authorized' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ steps.upstream.outputs.upstream_run_id }}"
          test -d artifacts
          test -w artifacts
          gh api \
            "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
            > artifacts/metadata.json
          test -f artifacts/metadata.json
          test -s artifacts/metadata.json
          echo "metadata_path=artifacts/metadata.json" >> "$GITHUB_OUTPUT"

      - id: artifact_metadata
        if: ${{ steps.stale_main.outputs.authorization_status == 'authorized' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/promotion_experimental_lab_artifact.py select-metadata \
            --metadata-json "${{ steps.artifact_query.outputs.metadata_path }}" \
            --expected-run-id "${{ steps.upstream.outputs.upstream_run_id }}" \
            --expected-subject-sha "${{ steps.upstream.outputs.upstream_head_sha }}" \
            --expected-repository-id "${{ github.repository_id }}" \
            --output artifacts/artifact_metadata.json \
            --github-output artifacts/artifact_metadata.env

      - name: download validated experimental record
        if: ${{ steps.stale_main.outputs.authorization_status == 'authorized' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.artifact_metadata.outputs.artifact_name }}
          run-id: ${{ steps.upstream.outputs.upstream_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/record_extracted

      - id: record_valid
        if: ${{ steps.stale_main.outputs.authorization_status == 'authorized' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/promotion_experimental_lab_artifact.py validate-record \
            --record-path artifacts/record_extracted/experimental-lab-record.json \
            --expected-run-id "${{ steps.upstream.outputs.upstream_run_id }}" \
            --expected-run-attempt "${{ steps.upstream.outputs.upstream_run_attempt }}" \
            --expected-subject-sha "${{ steps.upstream.outputs.upstream_head_sha }}" \
            --artifact-id "${{ steps.artifact_metadata.outputs.artifact_id }}" \
            --artifact-metadata-digest "${{ steps.artifact_metadata.outputs.artifact_metadata_digest }}" \
            --output artifacts/artifact_result.json \
            --github-output artifacts/artifact_result.env
          echo "artifact_id=$(python3 -c 'import json; print(json.load(open(\"artifacts/artifact_result.json\"))[\"artifact_id\"])')" >> "$GITHUB_OUTPUT"
          echo "artifact_metadata_digest=$(python3 -c 'import json; print(json.load(open(\"artifacts/artifact_result.json\"))[\"artifact_metadata_digest\"])')" >> "$GITHUB_OUTPUT"

      - id: authorize
        if: ${{ steps.stale_main.outputs.authorization_status == 'authorized' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/promotion_experimental_lab_authorization.py write \
            --artifact-result artifacts/artifact_result.json \
            --current-main-sha "${{ steps.stale_main.outputs.current_main_sha }}" \
            --bridge-sha "${{ github.sha }}" \
            --bridge-run-id "${{ github.run_id }}" \
            --bridge-run-attempt "${{ github.run_attempt }}" \
            --authorization-status "${{ steps.stale_main.outputs.authorization_status }}" \
            --output-dir artifacts \
            --github-output "$GITHUB_OUTPUT"

      - id: upload_auth
        if: ${{ steps.stale_main.outputs.authorization_status == 'authorized' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-lab-deploy-authorization-${{ github.run_id }}
          path: |
            artifacts/experimental-lab-deploy-authorization.json
            artifacts/experimental-lab-deploy-authorization.json.sha256
          retention-days: 7

  authorize-latest:
    name: authorize latest deployment
    needs: validate-upstream
    runs-on: ubuntu-latest
    outputs:
      subject_sha: ${{ steps.confirm.outputs.subject_sha }}
      backend_image_ref: ${{ steps.confirm.outputs.backend_image_ref }}
      scheduler_image_ref: ${{ steps.confirm.outputs.scheduler_image_ref }}
      frontend_image_ref: ${{ steps.confirm.outputs.frontend_image_ref }}
      artifact_metadata_digest: ${{ steps.confirm.outputs.artifact_metadata_digest }}
      upstream_run_id: ${{ steps.confirm.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ steps.confirm.outputs.upstream_run_attempt }}
    if: ${{ needs.validate-upstream.outputs.authorization_status == 'authorized' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: initialize bridge authorization workspace
        run: |
          set -euo pipefail
          install -d -m 0700 \
            artifacts \
            artifacts/auth_extracted

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-lab-deploy-authorization-${{ github.run_id }}
          path: artifacts/auth_extracted

      - id: confirm
        run: |
          set -euo pipefail
          current_main=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/main" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          python3 scripts/ci/promotion_experimental_lab_authorization.py verify \
            --auth-dir artifacts/auth_extracted \
            --current-main-sha "$current_main" \
            --github-output "$GITHUB_OUTPUT"

  deploy:
    name: deploy to experimental lab
    needs: authorize-latest
    uses: ./.github/workflows/reusable-promotion-deploy.yml
    with:
      closure_sha: ${{ needs.authorize-latest.outputs.subject_sha }}
      backend_image_ref: ${{ needs.authorize-latest.outputs.backend_image_ref }}
      scheduler_image_ref: ${{ needs.authorize-latest.outputs.scheduler_image_ref }}
      frontend_image_ref: ${{ needs.authorize-latest.outputs.frontend_image_ref }}
      environment: lab
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      REGISTRY: ${{ secrets.REGISTRY }}
    permissions:
      contents: read
      id-token: write
