name: k9b promotion experimental lab deploy

on:
  workflow_run:
    workflows: [k9b promotion experimental lab build]
    types: [completed]
    branches: [main]

concurrency:
  group: k9b-promotion-experimental-live-lab-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate-upstream:
    name: validate upstream and authorize deployment
    runs-on: ubuntu-latest
    outputs:
      subject_sha: ${{ steps.upstream.outputs.upstream_head_sha }}
      backend_image_ref: ${{ steps.validate_record.outputs.backend_image_ref }}
      scheduler_image_ref: ${{ steps.validate_record.outputs.scheduler_image_ref }}
      frontend_image_ref: ${{ steps.validate_record.outputs.frontend_image_ref }}
      artifact_digest: ${{ steps.artifact.outputs.artifact_digest }}
      upstream_run_id: ${{ steps.upstream.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ steps.upstream.outputs.upstream_run_attempt }}
      authorization_status: ${{ steps.stale_main.outputs.authorization_status }}
      auth_record_digest: ${{ steps.authorize.outputs.auth_record_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: upstream
        run: |
          set -euo pipefail
          run_event="${{ github.event.workflow_run.event }}"
          run_conclusion="${{ github.event.workflow_run.conclusion }}"
          run_branch="${{ github.event.workflow_run.head_branch }}"
          run_sha="${{ github.event.workflow_run.head_sha }}"
          repo_id="${{ github.event.workflow_run.repository.id }}"
          head_repo_id="${{ github.event.workflow_run.head_repository.id }}"
          head_repo_name="${{ github.event.workflow_run.head_repository.full_name }}"
          if [ "$run_event" != "push" ]; then exit 1; fi
          if [ "$run_conclusion" != "success" ]; then exit 1; fi
          if [ "$run_branch" != "main" ]; then exit 1; fi
          if ! echo "$run_sha" | grep -qE '^[0-9a-f]{40}$'; then exit 1; fi
          if [ "$repo_id" != "${{ github.repository_id }}" ]; then exit 1; fi
          if [ "$head_repo_id" != "${{ github.repository_id }}" ]; then exit 1; fi
          if [ "$head_repo_name" != "${{ github.repository }}" ]; then exit 1; fi
          echo "upstream_run_id=${{ github.event.workflow_run.run_id }}" >> "$GITHUB_OUTPUT"
          echo "upstream_run_attempt=${{ github.event.workflow_run.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "upstream_head_sha=$run_sha" >> "$GITHUB_OUTPUT"

      - id: stale_main
        run: |
          set -euo pipefail
          upstream_sha="${{ steps.upstream.outputs.upstream_head_sha }}"
          current_main=$(curl -s -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/main" | python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")
          echo "current_main_sha=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$upstream_sha" != "$current_main" ]; then
            echo "authorization_status=stale_upstream" >> "$GITHUB_OUTPUT"
          else
            echo "authorization_status=authorized" >> "$GITHUB_OUTPUT"
          fi

      - id: artifact
        run: |
          set -euo pipefail
          run_id="${{ steps.upstream.outputs.upstream_run_id }}"
          artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name == "experimental-lab-record") | .id')
          if [ -z "$artifact_id" ]; then exit 1; fi
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=verified" >> "$GITHUB_OUTPUT"

      - run: |
          set -euo pipefail
          mkdir -p artifacts
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ steps.artifact.outputs.artifact_id }}/zip" --method GET -H "Accept: application/vnd.github+json" -o artifacts/record.zip

      - id: validate_record
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-record.py "${{ steps.upstream.outputs.upstream_head_sha }}"

      - id: authorize
        run: |
          set -euo pipefail
          record_sha=$(sha256sum artifacts/record.zip | awk '{print $1}')
          python3 .github/scripts/write-auth-record.py \
            "$record_sha" \
            "${{ steps.stale_main.outputs.current_main_sha }}" \
            "${{ steps.stale_main.outputs.authorization_status }}" \
            "${{ steps.validate_record.outputs.backend_image_ref }}" \
            "${{ steps.validate_record.outputs.scheduler_image_ref }}" \
            "${{ steps.validate_record.outputs.frontend_image_ref }}" \
            "${{ steps.upstream.outputs.upstream_head_sha }}" \
            "${{ steps.upstream.outputs.upstream_run_id }}" \
            "${{ steps.upstream.outputs.upstream_run_attempt }}"
          auth_record_sha=$(sha256sum artifacts/experimental-lab-deploy-authorization.json | awk '{print $1}')
          echo "auth_record_digest=$auth_record_sha" >> "$GITHUB_OUTPUT"

      - if: always()
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" --method POST -H "Accept: application/vnd.github+json" -F "name=experimental-lab-deploy-authorization-${{ github.run_id }}" -F "file=@artifacts/experimental-lab-deploy-authorization.json"

  authorize-latest:
    name: authorize latest deployment
    needs: validate-upstream
    runs-on: ubuntu-latest
    outputs:
      subject_sha: ${{ steps.confirm.outputs.subject_sha }}
      backend_image_ref: ${{ steps.confirm.outputs.backend_image_ref }}
      scheduler_image_ref: ${{ steps.confirm.outputs.scheduler_image_ref }}
      frontend_image_ref: ${{ steps.confirm.outputs.frontend_image_ref }}
      artifact_digest: ${{ steps.confirm.outputs.artifact_digest }}
      upstream_run_id: ${{ steps.confirm.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ steps.confirm.outputs.upstream_run_attempt }}
    if: ${{ needs.validate-upstream.outputs.authorization_status == 'authorized' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: |
          set -euo pipefail
          mkdir -p artifacts
          auth_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name | contains("experimental-lab-deploy-authorization")) | .id')
          if [ -z "$auth_id" ]; then exit 1; fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$auth_id/zip" --method GET -H "Accept: application/vnd.github+json" -o artifacts/auth.zip
          unzip -o artifacts/auth.zip -d artifacts/auth_extracted/

      - run: |
          set -euo pipefail
          python3 .github/scripts/verify-auth-record.py

      - id: confirm
        run: |
          set -euo pipefail
          python3 .github/scripts/confirm-auth-output.py

  deploy:
    name: deploy to experimental lab
    needs: authorize-latest
    uses: ./.github/workflows/reusable-promotion-deploy.yml
    with:
      closure_sha: ${{ needs.authorize-latest.outputs.subject_sha }}
      backend_image_ref: ${{ needs.authorize-latest.outputs.backend_image_ref }}
      scheduler_image_ref: ${{ needs.authorize-latest.outputs.scheduler_image_ref }}
      frontend_image_ref: ${{ needs.authorize-latest.outputs.frontend_image_ref }}
      environment: lab
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      REGISTRY: ${{ secrets.REGISTRY }}
    permissions:
      contents: read
      id-token: write
