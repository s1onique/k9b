name: Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/k9b/**'
      - 'scripts/verify_helm_chart.sh'
      - 'scripts/package_helm_chart.sh'
      - 'scripts/verify_all.sh'
      - '.github/workflows/helm-chart.yml'
  pull_request:
    paths:
      - 'charts/k9b/**'
      - 'scripts/verify_helm_chart.sh'
      - 'scripts/package_helm_chart.sh'
      - 'scripts/verify_all.sh'
      - '.github/workflows/helm-chart.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version (optional, defaults to Chart.yaml version)'
        required: false
        type: string

env:
  CHART_DIR: charts/k9b

jobs:
  verify:
    name: Verify Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Verify Helm chart
        run: bash scripts/verify_helm_chart.sh

  package:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: verify
    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      package_file: ${{ steps.package.outputs.package_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Read chart version
        id: version
        run: |
          VERSION=$(grep '^version:' charts/k9b/Chart.yaml | awk '{print $2}')
          echo "Chart version: $VERSION"
          echo "chart_version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "${{ inputs.version }}" != "" ]]; then
            echo "Override version: ${{ inputs.version }}"
            echo "chart_version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Package chart
        id: package
        run: |
          mkdir -p dist
          helm package charts/k9b --destination dist --version ${{ steps.version.outputs.chart_version }}
          PACKAGE_FILE=$(ls dist/*.tgz | head -1)
          echo "Package file: $PACKAGE_FILE"
          echo "package_file=$PACKAGE_FILE" >> $GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ steps.version.outputs.chart_version }}
          path: ${{ steps.package.outputs.package_file }}
          retention-days: 5

  publish:
    name: Publish Helm Chart to DockerHub OCI
    runs-on: ubuntu-latest
    needs: [verify, package]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Validate DockerHub configuration
        run: |
          echo "Validating DockerHub configuration..."
          
          # Check DOCKERHUB_ORG is set and not placeholder
          if [[ -z "${{ vars.DOCKERHUB_ORG }}" ]]; then
            echo "ERROR: DOCKERHUB_ORG GitHub variable is not set."
            echo "Please set DOCKERHUB_ORG in repository settings -> Variables and secrets -> Variables"
            exit 1
          fi
          
          if [[ "${{ vars.DOCKERHUB_ORG }}" == "your-org" ]]; then
            echo "ERROR: DOCKERHUB_ORG is set to placeholder 'your-org'."
            echo "Please set DOCKERHUB_ORG to your actual Docker Hub organization name."
            exit 1
          fi
          
          # Check required secrets
          if [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is not set."
            echo "Please add DOCKERHUB_USERNAME in repository settings -> Variables and secrets -> Secrets"
            exit 1
          fi
          
          if [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "ERROR: DOCKERHUB_TOKEN secret is not set."
            echo "Please add DOCKERHUB_TOKEN in repository settings -> Variables and secrets -> Secrets"
            exit 1
          fi
          
          echo "✓ DOCKERHUB_ORG=${{ vars.DOCKERHUB_ORG }}"
          echo "✓ Docker Hub secrets configured"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart-${{ needs.package.outputs.chart_version }}
          path: dist/

      - name: Push chart to DockerHub OCI
        run: |
          PACKAGE_FILE=$(ls dist/*.tgz)
          CHART_VERSION=${{ needs.package.outputs.chart_version }}
          DOCKERHUB_ORG="${{ vars.DOCKERHUB_ORG }}"
          PUSH_TARGET="oci://registry-1.docker.io/${DOCKERHUB_ORG}"
          RESOLVED_IMAGE="registry-1.docker.io/${DOCKERHUB_ORG}/k9b:${CHART_VERSION}"
          
          echo "Pushing Helm chart package: $PACKAGE_FILE"
          echo "Resolved push target: ${PUSH_TARGET}"
          echo "Chart will be published as: ${RESOLVED_IMAGE}"
          
          helm push "$PACKAGE_FILE" "${PUSH_TARGET}"
