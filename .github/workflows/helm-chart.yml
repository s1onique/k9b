name: Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/k9b/**'
      - 'scripts/verify_helm_chart.sh'
      - 'scripts/verify_helm_oci_login.sh'
      - 'scripts/package_helm_chart.sh'
      - 'scripts/verify_all.sh'
      - '.github/workflows/helm-chart.yml'
  pull_request:
    paths:
      - 'charts/k9b/**'
      - 'scripts/verify_helm_chart.sh'
      - 'scripts/verify_helm_oci_login.sh'
      - 'scripts/package_helm_chart.sh'
      - 'scripts/verify_all.sh'
      - '.github/workflows/helm-chart.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version (optional, defaults to Chart.yaml version)'
        required: false
        type: string

env:
  # Harbor registry configuration
  REGISTRY: registry.spbnix.com
  HARBOR_PROJECT: k9b
  CHART_NAME: k9b
  CHART_DIR: charts/k9b

jobs:
  verify:
    name: Verify Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Verify Helm chart
        run: bash scripts/verify_helm_chart.sh

  package:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: verify
    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      package_file: ${{ steps.package.outputs.package_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Read chart version
        id: version
        run: |
          VERSION=$(grep '^version:' charts/k9b/Chart.yaml | awk '{print $2}')
          echo "Chart version: $VERSION"
          echo "chart_version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "${{ inputs.version }}" != "" ]]; then
            echo "Override version: ${{ inputs.version }}"
            echo "chart_version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Package chart
        id: package
        run: |
          mkdir -p dist
          helm package charts/k9b --destination dist --version ${{ steps.version.outputs.chart_version }}
          PACKAGE_FILE=$(ls dist/*.tgz | head -1)
          echo "Package file: $PACKAGE_FILE"
          echo "package_file=$PACKAGE_FILE" >> $GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ steps.version.outputs.chart_version }}
          path: ${{ steps.package.outputs.package_file }}
          retention-days: 5

  publish:
    name: Publish Helm Chart to Harbor OCI
    # Harbor resolves to internal SPbNIX names during OCI pushes; publish jobs must run inside SPbNIX infrastructure.
    # Docker-capable runner required for Harbor registry login.
    runs-on: spbnix-k8s-docker
    needs: [verify, package]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Docker preflight
        run: |
          set -eux
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=${RUNNER_OS:-unknown}"
          echo "arch=${RUNNER_ARCH:-unknown}"
          which docker
          docker version
          docker info
          docker buildx version
          ls -l /var/run/docker.sock

      - name: Install SPbNIX Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
        run: .github/scripts/install-spbnix-harbor-ca.sh

      - name: Validate Harbor configuration
        run: |
          echo "Validating Harbor configuration..."
          
          # Check required secrets
          if [[ -z "${{ secrets.HARBOR_USERNAME }}" ]]; then
            echo "ERROR: HARBOR_USERNAME secret is not set."
            echo "Please add HARBOR_USERNAME in repository settings -> Variables and secrets -> Secrets"
            exit 1
          fi
          
          if [[ -z "${{ secrets.HARBOR_TOKEN }}" ]]; then
            echo "ERROR: HARBOR_TOKEN secret is not set."
            echo "Please add HARBOR_TOKEN in repository settings -> Variables and secrets -> Secrets"
            exit 1
          fi
          
          echo "✓ REGISTRY=$REGISTRY"
          echo "✓ HARBOR_PROJECT=$HARBOR_PROJECT"
          echo "✓ Harbor secrets configured (HARBOR_USERNAME, HARBOR_TOKEN)"

      - name: Log in to Harbor (external hostname)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Log in to Harbor (internal blob-upload hostname)
        # WORKAROUND: Harbor leaks harbor-pve1.spbnix.local in OCI blob-upload URLs.
        # The internal host uses an internal CA not trusted by GitHub-hosted runners,
        # so this login is isolated to Helm and uses --insecure only for the leaked
        # internal hostname. Remove this login once Harbor's external URL / reverse-proxy
        # header is fixed to never emit internal hostnames.
        shell: bash
        run: |
          echo "${{ secrets.HARBOR_TOKEN }}" | helm registry login harbor-pve1.spbnix.local \
            --username "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin \
            --insecure

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart-${{ needs.package.outputs.chart_version }}
          path: dist/

      - name: Push chart to Harbor OCI
        run: |
          PACKAGE_FILE=$(ls dist/*.tgz)
          CHART_VERSION=${{ needs.package.outputs.chart_version }}
          PUSH_TARGET="oci://${REGISTRY}/${HARBOR_PROJECT}"
          RESOLVED_IMAGE="${REGISTRY}/${HARBOR_PROJECT}/${CHART_NAME}:${CHART_VERSION}"
          
          echo "Pushing Helm chart package: $PACKAGE_FILE"
          echo "Resolved push target: ${PUSH_TARGET}"
          echo "Chart will be published as: ${RESOLVED_IMAGE}"
          
          helm push "$PACKAGE_FILE" "${PUSH_TARGET}"
