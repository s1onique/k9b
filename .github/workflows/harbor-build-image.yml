name: Harbor Build Image

on:
  workflow_call:
    inputs:
      registry:
        description: "Harbor registry hostname"
        required: true
        type: string
      harbor_project:
        description: "Harbor project name"
        required: true
        type: string
      image_name:
        description: "Image name (e.g., k9b-backend or k9b-frontend)"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile relative to repo root"
        required: true
        type: string
      build_args:
        description: "Build arguments (one per line, KEY=VALUE format)"
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build & push ${{ inputs.image_name }}
    runs-on: spbnix-k8s-docker
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Docker preflight
        run: |
          set -eux
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=${RUNNER_OS:-unknown}"
          echo "arch=${RUNNER_ARCH:-unknown}"
          which docker
          docker version
          docker info
          docker buildx version
          ls -l /var/run/docker.sock

      # CA must be installed BEFORE QEMU/Buildx because they pull images from Harbor.
      # The Docker daemon validates registry TLS, so the CA must be in daemon trust.
      # SKIP_RUNNER_DOCKER_CERTS_D=1: DinD sidecar owns daemon CA trust, runner-side is diagnostic.
      - name: Install SPbNIX Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
          SKIP_RUNNER_DOCKER_CERTS_D: "1"
        run: .github/scripts/install-spbnix-harbor-ca.sh

      # Proof step: docker pull exercises dockerd's trust path, not just CLI tools.
      # If this fails with "unknown ca", the DinD sidecar needs the CA mounted.
      - name: Verify Docker daemon trusts Harbor
        run: |
          set -euo pipefail
          echo "Runner-side Docker cert path:"
          ls -l /etc/docker/certs.d/harbor-pve1.spbnix.local/ca.crt 2>/dev/null || echo "NOT FOUND in runner"
          echo ""
          echo "Docker daemon probe (pulls from Harbor):"
          docker pull harbor-pve1.spbnix.local/dockerhub-cache/library/busybox:latest || {
            echo "ERROR: docker pull failed - Docker daemon does not trust Harbor CA"
            echo "If runner:/etc/docker/certs.d exists but dind sidecar does not,"
            echo "the ARC runner scale set pod template needs CA volume mount."
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: harbor-pve1.spbnix.local/dockerhub-cache/tonistiigi/binfmt:latest
          # Use Harbor proxy cache instead of GitHub Actions cache for faster, local-first pulls
          cache-image: false

      # Configure BuildKit with Harbor CA trust
      # BuildKit runs in docker-container driver mode, requiring explicit registry CA config.
      # Without this, BuildKit cannot resolve Harbor images with self-signed certs.
      - name: Configure BuildKit with Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/buildkit-certs"
          mkdir -p "${RUNNER_TEMP}/buildkit"

          cert_path="${RUNNER_TEMP}/buildkit-certs/harbor-pve1.spbnix.local.pem"
          printf '%s\n' "${SPBNIX_CA_CERT_PEM}" > "${cert_path}"

          # Write buildkitd.toml with registry CA configuration
          # Use a host-readable path; buildx copies registry certs into the BuildKit container.
          cat > "${RUNNER_TEMP}/buildkit/buildkitd.toml" <<EOF
          debug = true

          [registry."harbor-pve1.spbnix.local"]
            ca = ["${cert_path}"]
          EOF

          echo "BuildKit config written to ${RUNNER_TEMP}/buildkit/buildkitd.toml"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=harbor-pve1.spbnix.local/dockerhub-cache/moby/buildkit:buildx-stable-1
          buildkitd-config: ${{ runner.temp }}/buildkit/buildkitd.toml

      # Patch BuildKit containers after they are created by setup-buildx-action
      - name: Patch BuildKit containers with Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
          BUILDX_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          SKIP_RUNNER_DOCKER_CERTS_D: "1"
        run: .github/scripts/install-spbnix-harbor-ca.sh

      - name: Login to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.harbor_project }}/${{ inputs.image_name }}
          tags: |
            type=sha,prefix=,format=short

      - name: BuildKit cache ref
        run: |
          echo "BuildKit cache ref: ${{ inputs.registry }}/${{ inputs.harbor_project }}/cache/${{ inputs.image_name }}:buildcache"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ inputs.registry }}/${{ inputs.harbor_project }}/cache/${{ inputs.image_name }}:buildcache
          cache-to: type=registry,ref=${{ inputs.registry }}/${{ inputs.harbor_project }}/cache/${{ inputs.image_name }}:buildcache,mode=max
          build-args: ${{ inputs.build_args }}
