# CI-HERMETIC-TOOLCACHE:
# k9b CI is intentionally shell-first/toolcache-first. Avoid setup/download
# actions where a pinned runner tool-cache path or checked-in script can be used.
# Missing cached tools must fail fast, not download mutable replacements.
# See docs/ci-hermetic-toolchain.md.

name: Harbor Build Image

on:
  workflow_call:
    inputs:
      registry:
        description: "Harbor registry hostname"
        required: true
        type: string
      harbor_project:
        description: "Harbor project name"
        required: true
        type: string
      image_name:
        description: "Image name (e.g., k9b-backend or k9b-frontend)"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile relative to repo root"
        required: true
        type: string
      build_args:
        description: "Build arguments (one per line, KEY=VALUE format)"
        required: false
        type: string
        default: ""
      # =============================================================================
      # Explicit publication authorities - see ACT-K9B-IMAGE-BUILDER-REGISTRY-CACHE-AUTHORIZATION01
      # These three flags control independent operations:
      # - image_push_enabled: controls application-image registry publication
      # - registry_cache_read_enabled: controls cache-from (BuildKit cache import)
      # - registry_cache_write_enabled: controls cache-to (BuildKit cache export)
      #
      # IMPORTANT: All write authorities default to false (fail-closed).
      # Every caller MUST explicitly supply all three inputs.
      # =============================================================================
      image_push_enabled:
        description: "Whether to push the application image to registry (write operation)"
        required: true
        type: boolean
      registry_cache_read_enabled:
        description: "Whether to read from registry cache (cache-from, read-only)"
        required: true
        type: boolean
      registry_cache_write_enabled:
        description: "Whether to write to registry cache (cache-to, write operation)"
        required: true
        type: boolean
    # =============================================================================
    # Image-reference outputs - see ACT-K9B-HULK-PROMOTION-EXPERIMENTAL-LAB-BUILD-LANE01-CORRECTION02
    # Required grammar: ^[^@]+@sha256:[0-9a-f]{64}$
    # Callers MUST consume these declared outputs via `needs.<job>.outputs.*`
    # (no second registry lookup; no assumed registry path reconstruction).
    # =============================================================================
    outputs:
      image_repository:
        description: "Image repository (registry/project/name) without tag or digest"
        value: ${{ jobs.build.outputs.image_repository }}
      image_tag:
        description: "Image tag (short SHA)"
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: "Image digest (sha256:<64hex>)"
        value: ${{ jobs.build.outputs.image_digest }}
      image_ref:
        description: "Immutable image reference (registry/project/name@sha256:<64hex>)"
        value: ${{ jobs.build.outputs.image_ref }}
    secrets:
      HARBOR_USERNAME:
        required: false
        description: "Harbor username for write operations"
      HARBOR_TOKEN:
        required: false
        description: "Harbor token for write operations"
      # CA certificate - required; forwarded from caller secret
      SPBNIX_CA_CERT_PEM:
        required: true
        description: "SPbNIX CA certificate in PEM format for Harbor TLS trust"

jobs:
  build:
    name: Build & push ${{ inputs.image_name }}
    runs-on: spbnix-k8s-docker
    permissions:
      contents: read
    outputs:
      image_repository: ${{ steps.emit-image-ref.outputs.image_repository }}
      image_tag: ${{ steps.emit-image-ref.outputs.image_tag }}
      image_digest: ${{ steps.emit-image-ref.outputs.image_digest }}
      image_ref: ${{ steps.emit-image-ref.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Docker preflight
        run: |
          set -eux
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=${RUNNER_OS:-unknown}"
          echo "arch=${RUNNER_ARCH:-unknown}"
          which docker
          docker version
          docker info
          docker buildx version
          ls -l /var/run/docker.sock

      # =============================================================================
      # Authority preflight - fail fast before expensive multi-platform build
      #
      # Security model:
      # - All PRs (fork, same-repo, Dependabot, bot) are read-only
      # - Write authority requires explicit non-PR event AND explicit input=true
      # - Secrets are never interpolated into shell source
      # =============================================================================
      - name: Authority preflight
        id: authority-preflight
        env:
          # External values transferred through env (not interpolated into shell source)
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name || '' }}
          BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name || github.repository }}

          # Input values
          REGISTRY: ${{ inputs.registry }}
          HARBOR_PROJECT: ${{ inputs.harbor_project }}
          IMAGE_NAME: ${{ inputs.image_name }}

          # Authority inputs
          IMAGE_PUSH_ENABLED: ${{ inputs.image_push_enabled }}
          CACHE_READ_ENABLED: ${{ inputs.registry_cache_read_enabled }}
          CACHE_WRITE_ENABLED: ${{ inputs.registry_cache_write_enabled }}

          # Secrets (available in env but never printed)
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}

        run: |
          set -euo pipefail

          echo "=== Authority Preflight ==="
          echo ""
          echo "Event classification: ${EVENT_NAME}"
          echo "Actor: ${ACTOR}"
          echo "Head repository: ${HEAD_REPO_FULL_NAME}"
          echo "Base repository: ${BASE_REPO_FULL_NAME}"
          echo ""

          # =================================================================
          # Phase 1: Validate required inputs
          # =================================================================
          if [[ -z "${REGISTRY}" ]]; then
            echo "ERROR: registry input is empty"
            exit 1
          fi
          if [[ -z "${HARBOR_PROJECT}" ]]; then
            echo "ERROR: harbor_project input is empty"
            exit 1
          fi
          if [[ -z "${IMAGE_NAME}" ]]; then
            echo "ERROR: image_name input is empty"
            exit 1
          fi

          # =================================================================
          # Phase 2: Validate boolean inputs
          # =================================================================
          case "${IMAGE_PUSH_ENABLED}" in
            true|false) ;;
            *) echo "ERROR: image_push_enabled must be true or false, got '${IMAGE_PUSH_ENABLED}'"; exit 1 ;;
          esac
          case "${CACHE_READ_ENABLED}" in
            true|false) ;;
            *) echo "ERROR: registry_cache_read_enabled must be true or false, got '${CACHE_READ_ENABLED}'"; exit 1 ;;
          esac
          case "${CACHE_WRITE_ENABLED}" in
            true|false) ;;
            *) echo "ERROR: registry_cache_write_enabled must be true or false, got '${CACHE_WRITE_ENABLED}'"; exit 1 ;;
          esac

          echo "Image push enabled: ${IMAGE_PUSH_ENABLED}"
          echo "Cache read enabled: ${CACHE_READ_ENABLED}"
          echo "Cache write enabled: ${CACHE_WRITE_ENABLED}"
          echo ""

          # =================================================================
          # Phase 3: Reject ALL PR write operations (fail-closed policy)
          #
          # This applies to ALL PR types:
          # - Fork PRs
          # - Same-repository PRs
          # - Dependabot PRs
          # - Bot PRs
          # - Manually approved PRs
          #
          # GitHub actor classification may be logged but NEVER grants write.
          # =================================================================
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            echo "Security policy: ALL pull_request events are read-only"
            echo "  - Same-repository PR write: REJECTED"
            echo "  - Dependabot PR write: REJECTED"
            echo "  - Fork PR write: REJECTED"
            echo ""

            if [[ "${IMAGE_PUSH_ENABLED}" == "true" ]]; then
              echo "ERROR: PR_WRITE_AUTHORITY_FORBIDDEN"
              echo "ERROR: Image push requested on pull_request event"
              echo "  Actor: ${ACTOR}"
              echo "  Head repository: ${HEAD_REPO_FULL_NAME}"
              echo ""
              echo "Pull requests are read-only. Set image_push_enabled=false."
              exit 1
            fi

            if [[ "${CACHE_WRITE_ENABLED}" == "true" ]]; then
              echo "ERROR: PR_WRITE_AUTHORITY_FORBIDDEN"
              echo "ERROR: Cache write requested on pull_request event"
              echo "  Actor: ${ACTOR}"
              echo "  Head repository: ${HEAD_REPO_FULL_NAME}"
              echo ""
              echo "Pull requests are read-only. Set registry_cache_write_enabled=false."
              exit 1
            fi

            echo "Security: PR correctly configured (read-only)"
            echo ""

            # PRs do not require Harbor write credentials
            echo "Harbor credential required: false (PR is read-only)"
            echo ""
            echo "=== Authority Preflight: PASSED (read-only PR) ==="
            exit 0
          fi

          # =================================================================
          # Phase 4: Non-PR event - determine write requirements
          # =================================================================
          echo "Security policy: Non-PR event - evaluating write requirements"
          echo ""

          HARBOR_WRITE_REQUIRED="false"
          if [[ "${IMAGE_PUSH_ENABLED}" == "true" ]] || [[ "${CACHE_WRITE_ENABLED}" == "true" ]]; then
            HARBOR_WRITE_REQUIRED="true"
          fi
          echo "Harbor write required: ${HARBOR_WRITE_REQUIRED}"

          # =================================================================
          # Phase 5: Validate credential availability when write is required
          # =================================================================
          if [[ "${HARBOR_WRITE_REQUIRED}" == "true" ]]; then
            echo "Write operation requested, validating credentials..."

            if [[ -z "${HARBOR_USERNAME}" ]] || [[ -z "${HARBOR_TOKEN}" ]]; then
              echo "ERROR: Write operations require HARBOR_USERNAME and HARBOR_TOKEN"
              echo "ERROR: One or both credentials are missing"
              exit 1
            fi

            echo "Credentials validated: present"
          else
            echo "No write operation requested"
            echo "Credentials: not required"
          fi

          echo ""
          echo "Cache reference: ${REGISTRY}/${HARBOR_PROJECT}/cache/${IMAGE_NAME}:buildcache"
          echo "Image reference: ${REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          echo ""
          echo "=== Authority Preflight: PASSED ==="

      # CA must be installed BEFORE QEMU/Buildx because they pull images from Harbor.
      # The Docker daemon validates registry TLS, so the CA must be in daemon trust.
      # SKIP_RUNNER_DOCKER_CERTS_D=1: DinD sidecar owns daemon CA trust, runner-side is diagnostic.
      - name: Install SPbNIX Harbor CA
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
          SKIP_RUNNER_DOCKER_CERTS_D: "1"
        run: .github/scripts/install-spbnix-harbor-ca.sh

      # Proof step: docker pull exercises dockerd's trust path, not just CLI tools.
      # If this fails with "unknown ca", the DinD sidecar needs the CA mounted.
      - name: Verify Docker daemon trusts Harbor
        run: |
          set -euo pipefail
          echo "Runner-side Docker cert path:"
          ls -l /etc/docker/certs.d/harbor-pve1.spbnix.local/ca.crt 2>/dev/null || echo "NOT FOUND in runner"
          echo ""
          echo "Docker daemon probe (pulls from Harbor):"
          docker pull harbor-pve1.spbnix.local/dockerhub-cache/library/busybox:latest || {
            echo "ERROR: docker pull failed - Docker daemon does not trust Harbor CA"
            echo "If runner:/etc/docker/certs.d exists but dind sidecar does not,"
            echo "the ARC runner scale set pod template needs CA volume mount."
            exit 1
          }

      - name: Set up QEMU
        run: scripts/ci/wire_qemu_binfmt.sh aarch64

      # Configure BuildKit with Harbor CA trust
      # BuildKit runs in docker-container driver mode, requiring explicit registry CA config.
      # Without this, BuildKit cannot resolve Harbor images with self-signed certs.
      - name: Configure BuildKit with Harbor CA
        id: buildkitd-config
        env:
          SPBNIX_CA_CERT_PEM: ${{ secrets.SPBNIX_CA_CERT_PEM }}
          HARBOR_REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/buildkit-certs"
          mkdir -p "${RUNNER_TEMP}/buildkit"

          cert_path="${RUNNER_TEMP}/buildkit-certs/harbor-pve1.spbnix.local.pem"
          printf '%s\n' "${SPBNIX_CA_CERT_PEM}" > "${cert_path}"

          # Write buildkitd.toml with registry CA configuration
          # Use a host-readable path; buildx copies registry certs into the BuildKit container.
          cat > "${RUNNER_TEMP}/buildkit/buildkitd.toml" <<EOF
          debug = true

          [registry."harbor-pve1.spbnix.local"]
            ca = ["${cert_path}"]
          EOF

          echo "BuildKit config written to ${RUNNER_TEMP}/buildkit/buildkitd.toml"
          echo "path=${RUNNER_TEMP}/buildkit/buildkitd.toml" >> "${GITHUB_OUTPUT}"

      # CI-HERMETIC-TOOLCACHE: Buildx is pre-wired by runner tool cache, no setup action needed.
      # BuildKit daemon is configured via buildkitd-config step above.
      - name: Emit Docker toolchain provenance
        run: scripts/ci/emit_toolchain_provenance.sh "docker,buildx"

      # CI-HERMETIC-TOOLCACHE: Buildx wired via hermetic shell script.
      # BuildKit daemon is configured via buildkitd-config step above.
      - name: Set up Docker Buildx
        id: buildx
        run: |
          scripts/ci/wire_docker_buildx.sh \
            --buildkitd-config "${{ steps.buildkitd-config.outputs.path }}"

      # =============================================================================
      # Harbor login - only required for write operations
      # =============================================================================
      # CI-HERMETIC-TOOLCACHE: docker/login-action replaced with docker_login.sh.
      # Login required when either image_push_enabled OR registry_cache_write_enabled.
      - name: Login to Harbor
        if: inputs.image_push_enabled == true || inputs.registry_cache_write_enabled == true
        env:
          HARBOR_REGISTRY: ${{ inputs.registry }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
        run: source scripts/ci/docker_login.sh "${HARBOR_REGISTRY}" "${HARBOR_USERNAME}" "HARBOR_TOKEN"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.harbor_project }}/${{ inputs.image_name }}
          tags: |
            type=sha,prefix=,format=short

      - name: BuildKit cache ref
        env:
          REGISTRY: ${{ inputs.registry }}
          HARBOR_PROJECT: ${{ inputs.harbor_project }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          echo "BuildKit cache ref: ${REGISTRY}/${HARBOR_PROJECT}/cache/${IMAGE_NAME}:buildcache"

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.image_push_enabled }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ inputs.registry_cache_read_enabled && format('type=registry,ref={0}/{1}/cache/{2}:buildcache', inputs.registry, inputs.harbor_project, inputs.image_name) || '' }}
          cache-to: ${{ inputs.registry_cache_write_enabled && format('type=registry,ref={0}/{1}/cache/{2}:buildcache,mode=max', inputs.registry, inputs.harbor_project, inputs.image_name) || '' }}
          build-args: ${{ inputs.build_args }}
          builder: ${{ steps.buildx.outputs.name }}

      # =============================================================================
      # Emit image-reference outputs (P0-4)
      #
      # Combines caller inputs with the docker/metadata-action output
      # ``version`` and the docker/build-push-action output ``digest`` into
      # the canonical immutable reference grammar:
      #   registry/project/name@sha256:<64hex>
      #
      # ``docker/metadata-action`` outputs are ``version``, ``tags``,
      # ``tag-names``, ``labels``, ``annotations``, ``json``.  It does NOT
      # expose ``image_repository`` or ``image_tag``; those names are not
      # recognised by the action.  We derive ``image_repository`` from the
      # caller inputs (``inputs.registry``, ``inputs.harbor_project``,
      # ``inputs.image_name``) and use ``steps.meta.outputs.version`` for
      # the tag.
      #
      # These outputs are the SOLE source of truth for callers; no second
      # registry lookup is permitted.  The digest is validated against
      # ``sha256:<64-lowercase-hex>`` before emit.
      # =============================================================================
      - name: Emit image-reference outputs
        id: emit-image-ref
        env:
          REGISTRY: ${{ inputs.registry }}
          HARBOR_PROJECT: ${{ inputs.harbor_project }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_PUSH_ENABLED: ${{ inputs.image_push_enabled }}
          META_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          set -euo pipefail

          image_repository="${REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          image_tag="${META_VERSION}"
          if [ -z "${image_tag}" ]; then
            echo "FATAL: metadata-action produced no version output"
            exit 1
          fi

          image_digest="${BUILD_DIGEST}"
          if [ "${IMAGE_PUSH_ENABLED}" = "true" ]; then
            if [ -z "${image_digest}" ]; then
              echo "FATAL: docker/build-push-action did not return digest"
              exit 1
            fi
            # Validate exactly ``sha256:`` + 64 lowercase hex characters.
            case "${image_digest}" in
              sha256:????????????????????????????????????????????????????????????????)
                ;;
              *)
                echo "FATAL: digest is not sha256:<64hex>: ${image_digest}"
                exit 1
                ;;
            esac
            image_ref="${image_repository}@${image_digest}"
          else
            image_digest=""
            image_ref="${image_repository}:${image_tag}"
          fi

          {
            echo "image_repository=${image_repository}"
            echo "image_tag=${image_tag}"
            echo "image_digest=${image_digest}"
            echo "image_ref=${image_ref}"
          } >> "${GITHUB_OUTPUT}"

          echo "=== Image Reference ==="
          echo "  repository: ${image_repository}"
          echo "  tag:        ${image_tag}"
          echo "  digest:     ${image_digest}"
          echo "  ref:        ${image_ref}"

      # =============================================================================
      # Post-build summary with authority details
      # =============================================================================
      - name: Build summary
        env:
          IMAGE_PUSH_ENABLED: ${{ inputs.image_push_enabled }}
          CACHE_READ_ENABLED: ${{ inputs.registry_cache_read_enabled }}
          CACHE_WRITE_ENABLED: ${{ inputs.registry_cache_write_enabled }}
          REGISTRY: ${{ inputs.registry }}
          HARBOR_PROJECT: ${{ inputs.harbor_project }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          echo "=== Build Summary ==="
          echo ""
          echo "Authority configuration:"
          echo "  Image push enabled: ${IMAGE_PUSH_ENABLED}"
          echo "  Cache read enabled: ${CACHE_READ_ENABLED}"
          echo "  Cache write enabled: ${CACHE_WRITE_ENABLED}"
          echo ""
          echo "Build outputs:"
          echo "  Image: ${REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          echo "  Cache: ${REGISTRY}/${HARBOR_PROJECT}/cache/${IMAGE_NAME}:buildcache"
