# CI-HERMETIC-TOOLCACHE:
# k9b CI is intentionally shell-first/toolcache-first. Avoid setup/download
# actions where a pinned runner tool-cache path or checked-in script can be used.
# Missing cached tools must fail fast, not download mutable replacements.
# See docs/ci-hermetic-toolchain.md.

name: k9b live lab toolchain
description: |
  Wire Python, kubectl, and Helm from local runner tool cache for k9b live labs.
  This avoids redundant setup action overhead on warm self-hosted runners.
  Fails fast with diagnostics when required tools are missing.

inputs:
  python-version:
    required: false
    default: '3.13'
    description: Python version (used for cache key fingerprint)
  kubectl-version:
    required: false
    default: 'v1.31.0'
    description: kubectl version to use (pinned, e.g. v1.31.0)
  helm-version:
    required: false
    default: '3.16.3'
    description: Helm version (used for cache key fingerprint)
  allow-tool-download:
    required: false
    default: 'false'
    description: Allow downloading missing kubectl into runner tool cache

outputs:
  python-location:
    description: Path to Python binary directory
    value: ${{ steps.wire-tools.outputs.python-bin-dir }}
  helm-location:
    description: Path to Helm binary
    value: ${{ steps.wire-tools.outputs.helm-path }}
  kubectl-location:
    description: Path to kubectl binary
    value: ${{ steps.wire-tools.outputs.kubectl-path }}
  K9B_LIVE_LAB_PYTHON:
    description: Path to Python binary
    value: ${{ steps.wire-tools.outputs.python-bin-dir }}/python3
  K9B_LIVE_LAB_HELM:
    description: Path to Helm binary
    value: ${{ steps.wire-tools.outputs.helm-path }}
  K9B_LIVE_LAB_KUBECTL:
    description: Path to kubectl binary
    value: ${{ steps.wire-tools.outputs.kubectl-path }}
  tool-cache-hit:
    description: Whether all tools were found in local cache
    value: ${{ steps.wire-tools.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # =======================================================================
    # Step 1: Show tool cache diagnostics
    # =======================================================================
    - name: Show tool cache diagnostics
      shell: bash
      run: |
        echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
        echo "AGENT_TOOLSDIRECTORY=${AGENT_TOOLSDIRECTORY:-<unset>}"
        echo "runner.tool_cache=${{ runner.tool_cache }}"
        echo "=== Top-level tool cache contents ==="
        ls -la "${{ runner.tool_cache }}" 2>/dev/null || echo "Tool cache root not accessible"
        echo "=== Python tool cache contents ==="
        find "${{ runner.tool_cache }}/Python" -maxdepth 4 -type d -print 2>/dev/null | sort || true
        find "${{ runner.tool_cache }}/Python" -maxdepth 3 -type f -name '*.complete' -print 2>/dev/null | sort || true
        echo "=== Helm tool cache contents ==="
        find "${{ runner.tool_cache }}/helm" -maxdepth 3 -type d -print 2>/dev/null | sort || true
        echo "=== kubectl tool cache contents ==="
        find "${{ runner.tool_cache }}/kubectl" -maxdepth 3 -type d -print 2>/dev/null | sort || true

    # =======================================================================
    # Step 2: Wire tools from local runner tool cache
    # =======================================================================
    - name: Wire tools from local runner tool cache
      id: wire-tools
      shell: bash
      run: |
        set -euo pipefail

        tool_cache="${RUNNER_TOOL_CACHE:-${{ runner.tool_cache }}}"
        echo "Using tool cache root: ${tool_cache}"
        echo "cache-hit=true" >> "$GITHUB_OUTPUT"

        # --- Wire Python ---
        echo "=== Wiring Python ==="
        python_bin=""
        python_paths=(
          "${tool_cache}/Python/3.13.14/x64/bin"
          "${tool_cache}/Python/3.13.13/x64/bin"
          "${tool_cache}/Python/3.13.12/x64/bin"
          "${tool_cache}/Python/3.13.11/x64/bin"
          "${tool_cache}/Python/3.13.10/x64/bin"
          "${tool_cache}/Python/3.13.9/x64/bin"
          "${tool_cache}/Python/3.13.8/x64/bin"
          "${tool_cache}/Python/3.13.7/x64/bin"
          "${tool_cache}/Python/3.13.6/x64/bin"
          "${tool_cache}/Python/3.13.5/x64/bin"
          "${tool_cache}/Python/3.13.4/x64/bin"
          "${tool_cache}/Python/3.13.3/x64/bin"
          "${tool_cache}/Python/3.13.2/x64/bin"
          "${tool_cache}/Python/3.13.1/x64/bin"
          "${tool_cache}/Python/3.13.0/x64/bin"
        )

        for python_path in "${python_paths[@]}"; do
          if [[ -x "${python_path}/python3" ]]; then
            python_bin="${python_path}"
            # python_path is already the bin dir (e.g. .../x64/bin); root is one level up
            python_root="$(cd "${python_path}/.." && pwd)"
            echo "Found Python at: ${python_path}"
            echo "python_bin=${python_bin}" >> "$GITHUB_OUTPUT"
            echo "python-bin-dir=${python_bin}" >> "$GITHUB_OUTPUT"
            break
          fi
        done

        if [[ -z "${python_bin}" ]]; then
          echo "ERROR: No Python 3.13 found in tool cache at expected paths"
          echo "=== Directory listing of ${tool_cache}/Python ==="
          find "${tool_cache}/Python" -maxdepth 4 -type d -print 2>/dev/null | sort || echo "No Python directory found"
          echo "=== Directory listing of ${tool_cache} ==="
          ls -la "${tool_cache}" 2>/dev/null || echo "Tool cache not accessible"
          echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        # Preflight: verify libpython is present (fails fast with diagnostics)
        echo "python_root=${python_root}"
        if ! ls "${python_root}/lib/libpython"* 1>/dev/null 2>&1; then
          echo "::error::Python tool-cache entry is missing libpython under ${python_root}/lib"
          ls -la "${python_root}/lib" 2>/dev/null || echo "lib directory not found"
          exit 127
        fi

        # Append Python bin to PATH and set LD_LIBRARY_PATH for shared library linking
        echo "${python_bin}" >> "$GITHUB_PATH"
        echo "PATH extended with: ${python_bin}"

        # Build LD_LIBRARY_PATH without trailing empty element (avoids cwd lookup from ':')
        if [[ -n "${LD_LIBRARY_PATH:-}" ]]; then
          python_ld_library_path="${python_root}/lib:${LD_LIBRARY_PATH}"
        else
          python_ld_library_path="${python_root}/lib"
        fi

        # Export Python environment variables (mirrors actions/setup-python behavior)
        {
          echo "pythonLocation=${python_root}"
          echo "Python_ROOT_DIR=${python_root}"
          echo "Python3_ROOT_DIR=${python_root}"
          echo "PKG_CONFIG_PATH=${python_root}/lib/pkgconfig"
          echo "LD_LIBRARY_PATH=${python_ld_library_path}"
        } >> "$GITHUB_ENV"

        echo "LD_LIBRARY_PATH set to: ${python_ld_library_path}"
        echo "pythonLocation=${python_root}"

        # Show library dependencies with correct LD_LIBRARY_PATH
        LD_LIBRARY_PATH="${python_ld_library_path}" ldd "${python_bin}/python3" 2>&1 | grep -E 'libpython|not found' || true

        # Verify Python works with LD_LIBRARY_PATH set
        LD_LIBRARY_PATH="${python_ld_library_path}" "${python_bin}/python3" --version

        # --- Wire Helm ---
        echo "=== Wiring Helm ==="
        # x64 paths (azure/setup-helm / Actions tool-cache style layout) checked first
        helm_paths=(
          "${tool_cache}/helm/3.16.3/x64/linux-amd64/helm"
          "${tool_cache}/helm/3.16.2/x64/linux-amd64/helm"
          "${tool_cache}/helm/3.16.1/x64/linux-amd64/helm"
          "${tool_cache}/helm/3.16.0/x64/linux-amd64/helm"
          "${tool_cache}/helm/3.15.0/x64/linux-amd64/helm"
          "${tool_cache}/helm/3.14.0/x64/linux-amd64/helm"
          "${tool_cache}/helm/3.13.0/x64/linux-amd64/helm"
          # Legacy paths (without x64 segment) - fallback for older runner caches
          "${tool_cache}/helm/3.16.3/linux-amd64/helm"
          "${tool_cache}/helm/3.16.2/linux-amd64/helm"
          "${tool_cache}/helm/3.16.1/linux-amd64/helm"
          "${tool_cache}/helm/3.16.0/linux-amd64/helm"
          "${tool_cache}/helm/3.15.0/linux-amd64/helm"
          "${tool_cache}/helm/3.14.0/linux-amd64/helm"
          "${tool_cache}/helm/3.13.0/linux-amd64/helm"
        )

        helm_path=""
        for helm_p in "${helm_paths[@]}"; do
          if [[ -x "${helm_p}" ]]; then
            helm_path="${helm_p}"
            echo "Found Helm at: ${helm_path}"
            break
          fi
        done

        # Also check if helm is in PATH already (from pre-installed)
        if [[ -z "${helm_path}" ]] && command -v helm &>/dev/null; then
          helm_path="$(command -v helm)"
          echo "Using pre-installed Helm at: ${helm_path}"
        fi

        if [[ -z "${helm_path}" ]]; then
          echo "ERROR: Helm not found in local runner tool cache"
          echo "Searched paths:"
          printf '  - %s\n' "${helm_paths[@]}"
          echo "Helm is required for live lab execution. Ensure Helm is installed in the runner tool cache."
          exit 1
        else
          helm_dir="$(dirname "${helm_path}")"
          echo "${helm_dir}" >> "$GITHUB_PATH"
          echo "helm-path=${helm_path}" >> "$GITHUB_OUTPUT"
          "${helm_path}" version --short
        fi

        # --- Wire kubectl ---
        # Cache-first: try known toolcache paths, then pre-installed PATH lookup,
        # then download-on-miss with checksum validation (if allow-tool-download=true).
        # Default behavior is fail-fast (allow-tool-download=false) for hermetic mode.
        echo "=== Wiring kubectl ==="
        kubectl_version="${{ inputs.kubectl-version }}"
        allow_tool_download="${{ inputs.allow-tool-download }}"
        echo "kubectl-version requested: ${kubectl_version}"
        echo "allow-tool-download: ${allow_tool_download}"

        # Determine architecture for download
        case "$(uname -m)" in
          x86_64|amd64) kubectl_arch="amd64" ;;
          aarch64|arm64) kubectl_arch="arm64" ;;
          *)
            echo "ERROR: unsupported architecture for kubectl: $(uname -m)" >&2
            exit 1
            ;;
        esac
        echo "kubectl architecture: ${kubectl_arch}"

        # Resolve 'latest' to actual version BEFORE cache lookup.
        # This ensures 'latest' actually means latest, not an older cached fallback.
        if [[ "${kubectl_version}" == "latest" ]]; then
          echo "Fetching latest kubectl version..."
          kubectl_version="$(curl -fsSL https://dl.k8s.io/release/stable.txt 2>/dev/null)"
          if [[ -z "${kubectl_version}" ]]; then
            echo "ERROR: Failed to fetch latest kubectl version" >&2
            exit 1
          fi
          echo "Latest kubectl version: ${kubectl_version}"
        fi

        # Try exact version in toolcache (no fallback for pinned versions)
        kubectl_path=""
        kubectl_cache_dir=""

        exact_path="${tool_cache}/kubectl/${kubectl_version}/linux-${kubectl_arch}/kubectl"
        if [[ -x "${exact_path}" ]]; then
          kubectl_path="${exact_path}"
          kubectl_cache_dir="${tool_cache}/kubectl/${kubectl_version}/linux-${kubectl_arch}"
          echo "Found kubectl at: ${kubectl_path}"
        fi

        # Also check if kubectl is in PATH already (from pre-installed)
        if [[ -z "${kubectl_path}" ]] && command -v kubectl &>/dev/null; then
          kubectl_path="$(command -v kubectl)"
          kubectl_dir="$(dirname "${kubectl_path}")"
          kubectl_cache_dir="${kubectl_dir}"
          echo "Using pre-installed kubectl at: ${kubectl_path}"
        fi

        # Cache miss: download if allowed
        if [[ -z "${kubectl_path}" ]]; then
          if [[ "${allow_tool_download}" != "true" ]]; then
            echo "ERROR: kubectl not found in local runner tool cache and allow-tool-download=false"
            echo "Searched path: ${tool_cache}/kubectl/${kubectl_version}/linux-${kubectl_arch}/kubectl"
            echo "kubectl is required for live lab execution."
            echo "Either pre-seed kubectl in the runner tool cache, or set allow-tool-download=true."
            exit 1
          fi

          echo "kubectl not found in local runner tool cache, downloading..."

          kubectl_cache_dir="${tool_cache}/kubectl/${kubectl_version}/linux-${kubectl_arch}"
          kubectl_path="${kubectl_cache_dir}/kubectl"

          echo "Downloading kubectl ${kubectl_version} for linux/${kubectl_arch}"

          tmp_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "${tmp_dir}"
          }
          trap cleanup EXIT

          base_url="https://dl.k8s.io/release/${kubectl_version}/bin/linux/${kubectl_arch}"

          echo "Downloading binary from: ${base_url}/kubectl"
          curl -fsSL -o "${tmp_dir}/kubectl" "${base_url}/kubectl" || {
            echo "ERROR: Failed to download kubectl binary" >&2
            exit 1
          }

          echo "Downloading checksum from: ${base_url}/kubectl.sha256"
          curl -fsSL -o "${tmp_dir}/kubectl.sha256" "${base_url}/kubectl.sha256" || {
            echo "ERROR: Failed to download kubectl checksum" >&2
            exit 1
          }

          # Validate checksum using Kubernetes' official format:
          # echo "<sha256>  <filename>" | sha256sum --check
          echo "Validating checksum..."
          (
            cd "${tmp_dir}"
            echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check || {
              echo "ERROR: kubectl checksum validation failed" >&2
              exit 1
            }
          )
          echo "Checksum validated successfully"

          chmod 0755 "${tmp_dir}/kubectl"

          # Atomic install with file locking for concurrent cache population safety
          mkdir -p "${tool_cache}/kubectl/${kubectl_version}"
          mkdir -p "${tool_cache}/.locks"

          lock_file="${tool_cache}/.locks/kubectl-${kubectl_version}-linux-${kubectl_arch}.lock"
          exec 9>"${lock_file}"
          flock 9 || {
            echo "ERROR: Failed to acquire lock: ${lock_file}" >&2
            exit 1
          }

          # Double-check after acquiring lock (another job may have installed it)
          if [[ ! -x "${kubectl_path}" ]]; then
            install_dir_tmp="${kubectl_cache_dir}.tmp.$$"
            rm -rf "${install_dir_tmp}"
            mkdir -p "${install_dir_tmp}"
            install -m 0755 "${tmp_dir}/kubectl" "${install_dir_tmp}/kubectl"

            # Remove existing directory to handle broken partial cache dirs
            rm -rf "${kubectl_cache_dir}"
            mv -T "${install_dir_tmp}" "${kubectl_cache_dir}"
            echo "Installed kubectl to: ${kubectl_path}"
          else
            echo "kubectl already installed by another process: ${kubectl_path}"
          fi
        fi

        kubectl_dir="$(dirname "${kubectl_path}")"
        echo "${kubectl_dir}" >> "$GITHUB_PATH"
        echo "kubectl-path=${kubectl_path}" >> "$GITHUB_OUTPUT"
        echo "kubectl-cache-dir=${kubectl_cache_dir}" >> "$GITHUB_OUTPUT"
        "${kubectl_path}" version --client

        echo "=== Tool wiring complete ==="

    # =======================================================================
    # Step 3: Python startup proof (LD_LIBRARY_PATH + executable verification)
    # =======================================================================
    - name: Python startup proof
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Python startup proof ==="
        # LD_LIBRARY_PATH is already set in Step 2 via GITHUB_ENV (inherited automatically).
        # Verify it is present; if not, something is wrong with the wiring step.
        if [[ -z "${LD_LIBRARY_PATH:-}" ]]; then
          echo "::error::LD_LIBRARY_PATH not set. Step 2 (Wire tools) must export it to GITHUB_ENV."
          exit 1
        fi
        echo "LD_LIBRARY_PATH inherited: ${LD_LIBRARY_PATH}"
        # Prove executable startup (LD_LIBRARY_PATH inherited from GITHUB_ENV)
        python3 -VV
        python3 -c "import sys; print('sys.executable:', sys.executable)"
        python3 -c "import ssl; print('SSL OK')"
        echo "=== Python startup proof PASSED ==="

    # =======================================================================
    # Step 4: Validate toolchain
    # =======================================================================
    - name: Validate toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Validating wired toolchain ==="
        which python3 || { echo "ERROR: python3 not in PATH"; exit 1; }
        python3 --version || { echo "ERROR: python3 failed"; exit 1; }
        which pip3 || { echo "ERROR: pip3 not in PATH"; exit 1; }
        pip3 --version || { echo "ERROR: pip3 failed"; exit 1; }
        which helm || { echo "ERROR: helm not in PATH"; exit 1; }
        helm version --short || { echo "ERROR: helm failed"; exit 1; }
        which kubectl || { echo "ERROR: kubectl not in PATH"; exit 1; }
        kubectl version --client || { echo "ERROR: kubectl failed"; exit 1; }
        echo "=== Toolchain validation PASSED ==="

    # =======================================================================
    # Step 5: Show final PATH and tool versions  (previous step was Step 4: Validate toolchain)
    # =======================================================================
    - name: Show final toolchain state
      shell: bash
      run: |
        echo "=== Final PATH ==="
        echo "$PATH" | tr ':' '\n' | head -20
        echo ""
        echo "=== Tool versions ==="
        echo "Python: $(python3 --version)"
        echo "Pip: $(pip3 --version | head -1)"
        echo "Helm: $(helm version --short)"
        echo "kubectl: $(kubectl version --client | head -1)"
