[mypy]
python_version = 3.11
explicit_package_bases = True
namespace_packages = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disable_error_code = attr-defined
warn_unused_ignores = True
warn_unused_configs = True
warn_return_any = True
show_error_codes = True
ignore_missing_imports = True

# Test files don't require strict type annotations for fixtures/helpers
[mypy-tests.*]
disallow_any_generics = False
disallow_subclassing_any = False
disable_error_code = redundant-cast
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Strict typing island for typed incident lifecycle domain core
# This module is isolated from IO, Kubernetes, HTTP, subprocess, and store dependencies.
[mypy-k8s_diag_agent.domain.incident_lifecycle]
strict = True
warn_return_any = True
disallow_any_generics = True
no_implicit_optional = True
warn_unused_ignores = True
