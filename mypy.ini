[mypy]
python_version = 3.11
explicit_package_bases = True
namespace_packages = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disable_error_code = attr-defined
warn_unused_ignores = True
warn_unused_configs = True
warn_return_any = True
show_error_codes = True
ignore_missing_imports = True
# CORRECTION05 R6: ``incremental = False`` is required so that
# ``warn_unused_configs = True`` reliably reports unmatched
# per-module sections (mypy would otherwise cache the previous
# resolution and silently skip them).
incremental = False

# Test files don't require strict type annotations for fixtures/helpers
[mypy-tests.*]
disallow_any_generics = False
disallow_subclassing_any = False
disable_error_code = redundant-cast
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Strict typing island for typed incident lifecycle domain core
# This module is isolated from IO, Kubernetes, HTTP, subprocess, and store dependencies.
[mypy-k8s_diag_agent.domain.incident_lifecycle]
strict = True
warn_return_any = True
disallow_any_generics = True
no_implicit_optional = True
warn_unused_ignores = True
# The R20 incident-current-run-promotion verifier preserves the
# 21 historical sibling detectors verbatim. Their signatures are
# structural (tree, path) rather than domain-typed, and the original
# R20 verifier was deliberately exempted from strict mypy. The
# intentional typing policy is: WARN (not FAIL) on untyped defs and
# unspecified returns in this file. The new canonical core in
# ``verifier_core`` and the new canonical R20 detector are
# strict-typed -- only the preserved sibling helpers are relaxed.
[mypy-scripts.verifiers.incident_current_run_promotion_workset01]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
no_implicit_optional = False

# CORRECTION05 R6: one intentional package-wide strict rule for
# the verifier_core package. Per-submodule sections were redundant
# in CORRECTION04 (every submodule had the same three settings),
# and ``incremental = False`` + ``warn_unused_configs = True`` will
# report any future misspelled per-submodule section without
# relying on a separate per-submodule section here. A separate
# exact-package section may be reintroduced only when a submodule
# needs a demonstrably different policy.
[mypy-scripts.verifiers.verifier_core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
