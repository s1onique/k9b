      - all
    agent_rules:
      - .kilocode/rules/00-global.md
      - .kilocode/rules/10-agent-mission.md
      - .kilocode/rules/20-architecture-doctrine.md
    required_checks:
      - principles align with foundational governance
    manual_only: false
    notes: Core stable layer - rarely changes.

  - id: precedence
