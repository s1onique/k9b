    manual_only: false
    notes: Used to resolve rule conflicts.

  - id: seed-rules
    title: Seed Rules
    file: docs/doctrine/seed_rules.md
    applies_to:
      - all
    agent_rules:
      - .kilocode/rules/00-global.md
      - .kilocode/rules/20-architecture-doctrine.md
      - .kilocode/rules/40-tool-use.md
    required_checks:
      - TRUTH, SAFETY, EVOL, OBS, DIAG, ARCH, IMPL, OUTPUT, EVAL rules followed
