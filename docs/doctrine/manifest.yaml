# Doctrine Manifest
# This file catalogs all canonical doctrines in the repository.
# Doctrines must be registered here to be considered "active" in agent workflows.
# Each entry defines the doctrine's identity, scope, and enforcement requirements.

version: "1"
last_updated: "2026-05-31"

doctrines:
  - id: constitution
    title: Constitution
    file: docs/doctrine/constitution.md
