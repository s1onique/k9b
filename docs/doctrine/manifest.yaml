# Task-type bootstrap table
# Maps task types to required doctrine bootstrap
task_bootstrap:
  security-path:
    trigger:
      - static-serving
      - artifact-serving
      - file-download
      - path-validation
      - user-controlled-paths
    read:
      - docs/doctrine/path-security-doctrine.md
      - src/k8s_diag_agent/security/path_validation.py
      - tests/test_security_path_validation.py
    checks:
      - run targeted path traversal tests
      - add regression test for new path boundary
      - close report must include trust-boundary statement

  bug-fix:
    trigger:
      - bug-fix
    read:
      - docs/doctrine/bug-fossils.md
    checks:
      - regression test for bug class
      - root cause documented

  ui-claims:
    trigger:
      - ui-claims
      - report-generation
    read:
      - docs/doctrine/operator-path-truth.md
      - docs/doctrine/executable-claims.md
    checks:
      - claims backed by artifacts
      - uncertainty explicit

  file-creation:
    trigger:
      - file-creation
      - large-file-work
    read:
      - docs/doctrine/llm-friendly-files.md
    checks:
      - file size < 300 lines (warning)
      - file size < 500 lines (failure)
      - splitting plan if over threshold

# Close report requirements
close_report:
  required_sections:
    - doctrines_read
    - changed_files
    - risk_class
    - tests_run
    - residual_risks
  doctrine_evidence_required: true
  verification_evidence_required: true

# Reviewer enforcement
reviewer:
  rejection_triggers:
    - missing_doctrine_list
    - risk_area_without_matching_doctrine
    - security_fix_without_regression_tests
    - bug_fix_without_bug_fossil_evidence
    - unsupported_production_ready_claim
    - llm_unfriendly_file_without_justification