  - id: blockstor-derived
    title: Blockstor-Derived Factory Rules
    file: docs/doctrine/blockstor-derived-rules.md
    applies_to:
      - release-process
      - clean-room-claims
      - cold-resume
      - artifact-quality
    agent_rules:
      - .kilocode/rules/00-global.md
      - .kilocode/rules/20-architecture-doctrine.md
    required_checks:
      - clean-room claims have executable evidence
      - cold resume artifacts exist
      - release certification is evidence-backed
    manual_only: false
    notes: Derived from Factory blockstor review.

  - id: llm-friendly-files
    title: LLM-Friendly Files Doctrine
    file: docs/doctrine/llm-friendly-files.md
    applies_to:
      - file-creation
      - file-modification
      - large-files
    agent_rules:
      - .kilocode/rules/05-fast-task-bootstrap.md
      - .kilocode/rules/40-tool-use.md
    required_checks:
      - new files < 300 lines (warning threshold)
      - new files < 500 lines (failure threshold)
      - large files must be justified and tracked
    manual_only: false
    notes: Enforced via scripts/check_llm_friendly_files.py.

  - id: path-security
    title: Path and Artifact Security
    file: docs/doctrine/path-security-doctrine.md
    applies_to:
      - static-serving
      - artifact-serving
      - file-download
      - path-validation
      - user-controlled-paths
    agent_rules:
      - .kilocode/rules/40-tool-use.md
      - .kilocode/rules/05-fast-task-bootstrap.md
    required_checks:
      - run targeted path traversal tests
      - prove path stays under allowed root
      - test dotdot, encoding, symlink boundaries
      - no string-prefix path checks (use resolved paths)
    manual_only: false
    notes: Critical for static serving and artifact handling.

  - id: identity-primer
    title: Identity Primer
    file: docs/doctrine/identity-primer.md
    applies_to:
      - security-sensitive
      - authentication
      - authorization
    agent_rules:
      - .kilocode/rules/40-tool-use.md
    required_checks:
      - security-sensitive changes reviewed
    manual_only: true
    notes: Security-focused guidance, manual review recommended.

  - id: beta-real-incident-validation
    title: Beta Real Incident Validation
    file: docs/doctrine/beta-real-incident-validation.md
    applies_to:
      - beta-validation
      - incident-handling
    agent_rules: []
    required_checks:
      - incidents validated against real operator feedback
    manual_only: true
    notes: Beta-specific guidance, active during beta phase.

