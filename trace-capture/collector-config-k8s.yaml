# OpenTelemetry Collector configuration for k9b backend trace capture lab (Kubernetes version).
#
# This config provides:
# - OTLP receiver on gRPC 4317
# - Batch processor for efficient export
# - Debug exporter for log output
# - File exporter to /var/lib/k9b-traces/ for kubectl cp extraction
#
# Usage:
#   kubectl cp collector-config-k8s.yaml k9b/otel-collector-pod:/etc/otel/collector-config.yaml
#   kubectl exec k9b otel-collector-pod -- collector-config restart

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Allow unauthenticated local connections for lab purposes
        auth: null

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: detailed
    # Limit output to prevent unbounded log growth
    sampling_initial: 100
    sampling_thereafter: 100

  # File exporter for structured trace output
  # Write to mounted emptyDir volume for kubectl cp extraction
  file/k9b:
    path: /var/lib/k9b-traces/collector-traces.jsonl
    format: json
    rotation:
      max_size_mib: 10
      max_backups: 3

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/k9b]
  telemetry:
    logs:
      level: info
