services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: localhost/k9b_python:latest
    # The health UI/API exposes mutation endpoints, so the server refuses
    # non-loopback binds unless the risk is explicitly acknowledged.
    # In local Compose dev, 0.0.0.0 is required so the frontend container
    # can reach the backend over the private Compose network.
    # Do not copy this into exposed production deployments without an
    # auth/proxy/network boundary.
    # See: --unsafe-bind.
    command: ["backend", "--unsafe-bind"]
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    environment:
      HEALTH_SKIP_REFRESH: 1
      HEALTH_CONFIG_PATH: /app/runs/health-config.local.json
      HEALTH_RUNS_DIR: /app/runs
      HEALTH_UI_RUNS_DIR: /app/runs
      HEALTH_UI_HOST: 0.0.0.0
      HEALTH_UI_PORT: "8080"
      KUBECONFIG: /app/kubeconfig/config
      PYTHONPATH: /app/src
    ports:
      - "8080:8080"
    volumes:
      - ./runs:/app/runs
      - ./podman/kubeconfig:/app/kubeconfig:Z
    networks:
      default:
        aliases:
          - k9b-backend

  scheduler:
    image: localhost/k9b_python:latest
    command: ["scheduler"]
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    restart: unless-stopped
    environment:
      LLAMA_CPP_BASE_URL: http://192.168.99.134:32597
      LLAMA_CPP_MODEL: "openai/qwen"
      HEALTH_CONFIG_PATH: /app/runs/health-config.local.json
      HEALTH_RUNS_DIR: /app/runs/health
      KUBECONFIG: /app/kubeconfig/config
      PYTHONPATH: /app/src
      HEALTH_BUILD_DIAGNOSTIC_PACK: 1
      LLAMA_CPP_ENABLE_THINKING: false
    volumes:
      - ./runs:/app/runs
      - ./podman/kubeconfig:/app/kubeconfig:Z

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    depends_on:
      - backend
    environment:
      VITE_BACKEND_HOST: backend
      VITE_BACKEND_PORT: "8080"
      FRONTEND_HOST: "0.0.0.0"
    ports:
      - "5173:5173"
