[pytest]
pythonpath = src tests

# Hang diagnostics: dump all-thread stack traces if any test exceeds this timeout
# This helps identify deadlocks/hangs in CI without pytest-timeout plugin
# Value is in seconds
faulthandler_timeout = 60

# Per-test timeout (requires pytest-timeout plugin)
# When a test exceeds this timeout, its thread stacks are dumped and the test fails
# Use --timeout-method=thread for deadlock detection (default), or signal for actual kill
timeout = 90
timeout_method = thread
